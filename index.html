/* As peças: cartão de corpus na secção dos textos, cartão de análise na secção
   da análise, e a lista de descargas na secção dos dados. */

function chaveDaPeca(peca){ return encodeURIComponent(peca.slug || peca.titulo); }

function numerosDaAnalise(a){
  const m = a.metricas || {};
  return [
    [m.n_recursos,     t("ui.occurrences")],
    [m.n_personagens,  t("ui.characters")],
    [m.n_relacoes,     t("ui.relations")],
    [m.n_vernaculo,    t("ui.vernacular")],
    [a.n_linhas || m.n_linhas_peca, t("ui.textLines")]
  ].filter(x => x[0]).map(([v, r]) =>
    `<div><b>${num(v)}</b><span>${esc(r)}</span></div>`).join("");
}

/* ---------- secção «Dramatic texts» ---------- */
function cartaoTexto(peca){
  const a = maisRecente(peca);
  const linha2 = [txt(peca.genero), txt(peca.datacao)].filter(Boolean).join(" · ");
  return `<article class="peca ${a ? "" : "anunciada"}">
    <div class="peca-topo">
      <div>
        <h3>${esc(peca.titulo)}</h3>
        ${linha2 ? `<p class="genero">${esc(linha2)}</p>` : ""}
      </div>
      ${a ? "" : `<span class="selo muted">${esc(txt(peca.estado) || t("ui.inPreparation"))}</span>`}
    </div>
    ${peca.proveniencia ? `<p class="proveniencia">${esc(txt(peca.proveniencia))}</p>` : ""}
    ${peca.nota ? `<p class="nota">${esc(txt(peca.nota))}</p>` : ""}
    ${a ? `<div class="numeros">${numerosDaAnalise(a)}</div>
           <div class="accoes">
             <a class="botao primario" href="#/analysis/${chaveDaPeca(peca)}">${esc(t("ui.open"))}</a>
           </div>` : ""}
  </article>`;
}

/* ---------- secção «Analysis» ---------- */
function cartaoAnalise(peca, indice){
  const a = maisRecente(peca);
  if (!a) return "";
  const anteriores = peca.analises.slice(1);
  const quando = t("ui.analysedOn", {d: a.data || "—"}) + (a.modelo ? " · " + a.modelo : "");

  const versoes = anteriores.length ? `
    <details>
      <summary>${esc(anteriores.length === 1
        ? t("ui.previousOne") : t("ui.previousMany", {n: anteriores.length}))}</summary>
      <ul class="versoes">
        ${anteriores.map((v, i) => `
          <li><a href="#/analysis/${chaveDaPeca(peca)}/${i + 1}">${esc(v.data || "—")}</a>
              <span class="modelo">${esc(v.modelo || "")}</span></li>`).join("")}
      </ul>
    </details>` : "";

  return `<article class="peca">
    <div class="peca-topo">
      <div><h3>${esc(peca.titulo)}</h3>
        <p class="genero">${esc([txt(peca.genero), txt(peca.datacao)].filter(Boolean).join(" · "))}</p>
      </div>
      ${selo(estadoCotejo(a))}
    </div>
    <div class="numeros">${numerosDaAnalise(a)}</div>
    <div class="accoes">
      <a class="botao primario" href="#/analysis/${chaveDaPeca(peca)}">${esc(t("ui.openDashboard"))}</a>
      <span class="quando">${esc(quando)}</span>
    </div>
    ${versoes}
  </article>`;
}

/* ---------- secção «Data» ---------- */
function blocoDescargas(peca, iPeca){
  const a = maisRecente(peca);
  if (!a || !a.ficheiros || !a.ficheiros.length) return "";
  return `<section class="descarga">
    <h3>${esc(peca.titulo)}</h3>
    <p class="muted">${esc(t("ui.analysedOn", {d: a.data || "—"}))}</p>
    <ul class="dados">
      ${a.ficheiros.map((f, i) => `
        <li><a href="${esc(f.url)}" download="${esc(f.nome)}"
               ${f.conteudo !== undefined ? `data-embutido="${iPeca}:${i}"` : ""}>
              <code>${esc(f.nome)}</code></a>
            <span class="tam">${tamanho(f.bytes)}</span></li>`).join("")}
    </ul>
  </section>`;
}

/* ---------- desenho das três listas ---------- */
function pecas(){
  const lista = D.pecas || [];
  const vazio = `<div class="vazio">${esc(t("ui.noAnalyses"))}</div>`;

  $("#pecas-textos").innerHTML = lista.length ? lista.map(cartaoTexto).join("") : vazio;

  const comAnalise = analisadas();
  $("#pecas-analise").innerHTML = comAnalise.length
    ? comAnalise.map(cartaoAnalise).join("") : vazio;

  $("#descargas").innerHTML = comAnalise.length
    ? comAnalise.map(blocoDescargas).join("") : vazio;

  ligarDescargas();
}

/* Os ficheiros incorporados descarregam-se a partir do conteúdo que a página
   traz consigo, e não de um vizinho no disco — pela mesma razão que o dashboard
   vai embutido: para a página funcionar onde quer que esteja. */
function ligarDescargas(){
  $$("#descargas a[data-embutido]").forEach(a => {
    a.addEventListener("click", ev => {
      const [iPeca, iFich] = a.dataset.embutido.split(":").map(Number);
      const peca = analisadas()[iPeca];
      const analise = peca && maisRecente(peca);
      const f = analise && analise.ficheiros[iFich];
      if (!f || f.conteudo === undefined) return;      // deixa seguir a ligação
      ev.preventDefault();
      const tipo = f.nome.endsWith(".csv")  ? "text/csv;charset=utf-8"
                 : f.nome.endsWith(".json") ? "application/json;charset=utf-8"
                 : "text/plain;charset=utf-8";
      const url = URL.createObjectURL(new Blob([f.conteudo], {type: tipo}));
      const link = document.createElement("a");
      link.href = url; link.download = f.nome;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  });
}

/* Vistas do Tableau Public embebidas na secção da análise.

   Esta é a única parte do sítio que depende da rede, e é uma dependência
   assumida: uma vista do Tableau vive no servidor do Tableau e não pode ser
   incorporada como o resto. Por isso é carregada só quando a secção é aberta, e
   a sua falta nunca impede o resto da página de funcionar — offline, o leitor vê
   uma explicação e a ligação directa, em vez de um espaço vazio.

   Configura-se no catalogo.yaml:

       tableau:
         - titulo:    {en: "…", pt: "…"}
           descricao: {en: "…", pt: "…"}
           url: "https://public.tableau.com/views/Livro/Folha"
           altura: 720
*/

const TABLEAU_API = "https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js";
let tableauPedido = false;

/* O catálogo já entrega o endereço reduzido à vista; esta função repete a
   redução para o caso de a página ser editada à mão. O que se copia da barra do
   navegador — `/app/profile/<autor>/viz/<Livro>/<Folha>` — é a página onde uma
   pessoa lê a vista; a API de incorporação quer a vista em si, em
   `/views/<Livro>/<Folha>`. */
function limparUrlTableau(u){
  const s = String(u || "").trim().split("?")[0].replace(/\/+$/, "");
  if (!s) return "";
  const perfil = s.match(/^(https?:\/\/[^/]+)\/app\/profile\/[^/]+\/viz\/(.+)$/i);
  return perfil ? `${perfil[1]}/views/${perfil[2]}` : s;
}

function carregarApiTableau(){
  if (tableauPedido) return;
  tableauPedido = true;
  const s = document.createElement("script");
  s.type = "module";
  s.src = TABLEAU_API;
  s.addEventListener("error", () => {
    $$(".tableau-espera").forEach(e => e.classList.remove("hidden"));
  });
  document.head.appendChild(s);
}

function vistasTableau(){
  const vistas = (D.tableau || []).filter(v => limparUrlTableau(v.url));
  const alvo = $("#tableau");
  if (!alvo) return;

  if (!vistas.length){
    alvo.innerHTML = `<div class="vazio">
      <p>${esc(t("analysis.tableauPending"))}</p>
      <code>tableau:
  - titulo: "…"
    url: "https://public.tableau.com/views/…"</code>
    </div>`;
    return;
  }

  alvo.innerHTML = vistas.map((v, i) => {
    const altura = Number(v.altura) || 720;
    return `
    <figure class="vista">
      ${txt(v.titulo) ? `<figcaption><h3>${esc(txt(v.titulo))}</h3>
        ${txt(v.descricao) ? `<p>${esc(txt(v.descricao))}</p>` : ""}</figcaption>` : ""}
      <div class="vista-quadro" style="--altura:${altura}px">
        <tableau-viz id="tv-${i}" src="${esc(limparUrlTableau(v.url))}"
                     width="100%" height="${altura}"
                     toolbar="bottom" hide-tabs></tableau-viz>
        <p class="tableau-espera hidden">
          ${esc(t("analysis.tableauOffline"))}
          <a href="${esc(v.pagina || v.url)}" target="_blank" rel="noopener">
            ${esc(t("analysis.tableauOpen"))}</a>
        </p>
      </div>
    </figure>`;
  }).join("");

  carregarApiTableau();
}

/* Navegação, língua e o enquadramento de uma análise.

   Tudo vive no endereço: `#/texts`, `#/pt/data`, `#/analysis/<peça>/<versão>`.
   O botão de retroceder do navegador funciona, e qualquer secção — ou uma
   análise concreta, numa versão concreta — pode ser enviada por ligação. */

const SECCOES = ["home", "texts", "data", "analysis", "method", "about"];
const enderecosBlob = {};
let posicaoPagina = {};

function lerRota(){
  const partes = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
  let lingua = null;
  if (partes[0] === "pt" || partes[0] === "en") lingua = partes.shift();
  const seccao = SECCOES.includes(partes[0]) ? partes.shift() : "home";
  return {lingua, seccao, params: partes};
}

function irPara(seccao, params){
  const cauda = (params && params.length) ? "/" + params.join("/") : "";
  location.hash = `#/${LINGUA === "pt" ? "pt/" : ""}${seccao}${cauda}`;
}

/* ---------- o quadro da análise ---------- */
function acharPeca(chave){
  const alvo = decodeURIComponent(chave || "");
  return (D.pecas || []).find(p => (p.slug || p.titulo) === alvo)
      || (D.pecas || []).find(p => p.titulo === alvo) || null;
}

/* Quando a análise vem incorporada, o quadro é alimentado directamente com o
   HTML em vez de apontar para um ficheiro vizinho: é o que permite à página
   funcionar movida, enviada por email ou publicada em qualquer pasta. */
function enderecoSeparado(analise, chave){
  if (!analise.html) return analise.dashboard;
  if (!enderecosBlob[chave]){
    enderecosBlob[chave] = URL.createObjectURL(new Blob([analise.html], {type:"text/html"}));
  }
  return enderecosBlob[chave];
}

function mostrarQuadro(peca, indice){
  const analise = peca.analises[indice];
  if (!analise) return irPara("analysis");

  const separado = enderecoSeparado(analise, (peca.slug || peca.titulo) + "/" + indice);
  const sub = [
    analise.data ? t("ui.analysedOn", {d: analise.data}) : "",
    analise.modelo,
    indice > 0 ? t("ui.earlierVersion") : ""
  ].filter(Boolean).join(" · ");

  $("#barra-titulo").textContent = peca.titulo;
  $("#barra-sub").textContent = sub;
  $("#abrir-fora").href = separado;
  $("#recurso-link").href = separado;
  if (analise.html){
    $("#quadro").removeAttribute("src");
    $("#quadro").srcdoc = analise.html;
  } else {
    $("#quadro").removeAttribute("srcdoc");
    $("#quadro").src = analise.dashboard;
  }
  $("#quadro").title = peca.titulo;
  document.title = peca.titulo;
  linguaParaOQuadro();

  $("#paginas").hidden = true;
  $("#rodape").hidden = true;
  $("#barra-analise").classList.remove("hidden");
  $("#visualizador").classList.remove("hidden");
  document.body.classList.add("enquadrando");
  window.scrollTo(0, 0);
}

/* A análise enquadrada tem interface próprio, com a sua própria língua. Quando
   está dentro do sítio, é o sítio que manda: uma página não pode estar meia em
   inglês e meia em português. A mensagem repete-se após o carregamento porque
   o quadro pode ainda não ter scripts a correr no momento em que é escrito. */
function linguaParaOQuadro(){
  const quadro = $("#quadro");
  const enviar = () => {
    try { quadro.contentWindow.postMessage({tipo:"lingua", lingua:LINGUA}, "*"); }
    catch (e) { /* o quadro ainda não está pronto; a tentativa seguinte trata disso */ }
  };
  enviar();
  quadro.addEventListener("load", enviar, {once:true});
  setTimeout(enviar, 120);
}

function esconderQuadro(){
  document.body.classList.remove("enquadrando");
  $("#barra-analise").classList.add("hidden");
  $("#visualizador").classList.add("hidden");
  $("#quadro").removeAttribute("srcdoc");
  $("#quadro").src = "about:blank";
  $("#paginas").hidden = false;
  $("#rodape").hidden = false;
  cabecalhoDoSitio();
}

/* ---------- o router ---------- */
function mostrarSeccao(seccao){
  SECCOES.forEach(s => { $("#pg-" + s).hidden = (s !== seccao); });
  $$("#nav a").forEach(a =>
    a.classList.toggle("activo", a.dataset.seccao === seccao));
  $("#nav").classList.remove("aberto");
  $("#menu").setAttribute("aria-expanded", "false");
  if (seccao === "analysis") vistasTableau();
}

function rota(){
  const r = lerRota();
  if (r.lingua && r.lingua !== LINGUA){
    LINGUA = r.lingua;
    aplicarIdiomaEstatico();
    conteudo();
    pecas();
  }
  if (r.seccao === "analysis" && r.params.length){
    const peca = acharPeca(r.params[0]);
    if (peca && peca.analises && peca.analises.length){
      const i = Math.max(0, Math.min(peca.analises.length - 1, parseInt(r.params[1] || "0", 10) || 0));
      mostrarSeccao("analysis");
      return mostrarQuadro(peca, i);
    }
  }
  esconderQuadro();
  mostrarSeccao(r.seccao);
  window.scrollTo(0, posicaoPagina[r.seccao] || 0);
}

/* ---------- controlos ---------- */
function trocarLingua(nova){
  if (nova === LINGUA) return;
  LINGUA = nova;
  aplicarIdiomaEstatico();
  conteudo();
  pecas();
  const r = lerRota();
  const cauda = (r.params.length ? "/" + r.params.join("/") : "");
  location.hash = `#/${LINGUA === "pt" ? "pt/" : ""}${r.seccao}${cauda}`;
  if (!$("#pg-analysis").hidden) vistasTableau();
  if (document.body.classList.contains("enquadrando")) linguaParaOQuadro();
}

function ligarControlos(){
  window.addEventListener("hashchange", rota);

  $$(".lingua button").forEach(b =>
    b.addEventListener("click", () => trocarLingua(b.dataset.lingua)));

  $("#voltar").addEventListener("click", () => irPara("analysis"));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && document.body.classList.contains("enquadrando")) irPara("analysis");
  });

  $("#menu").addEventListener("click", () => {
    const aberto = $("#nav").classList.toggle("aberto");
    $("#menu").setAttribute("aria-expanded", String(aberto));
  });

  $("#tema").addEventListener("click", () => {
    const actual = document.documentElement.getAttribute("data-theme");
    const escuroSO = matchMedia("(prefers-color-scheme: dark)").matches;
    const proximo = actual ? (actual === "dark" ? "light" : "dark") : (escuroSO ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", proximo);
    // os ícones de estado leem as cores do tema no momento em que são escritos
    tiles(); pecas();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { tiles(); pecas(); });

  // guarda a posição de leitura de cada secção, para lá voltar onde se estava
  addEventListener("scroll", () => {
    if (document.body.classList.contains("enquadrando")) return;
    posicaoPagina[lerRota().seccao] = window.scrollY;
  }, {passive:true});
}

/* Ordem de arranque. Tem de ser o último ficheiro da pasta. */

aplicarIdiomaEstatico();
conteudo();
pecas();
ligarControlos();
ligarIndice();
rota();

})();
</script>
