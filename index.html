 senhor Oslofernes há muntas cosas, há pão, há vinho\",\"localizacao\":\"L0671-L0672\",\"personagem\":\"Preto (criado de Olofernes)\",\"interpretacao\":\"Depois de negar tudo, o cozinheiro aponta a despensa do amo. A fala expõe, sem o dizer, que a escassez dos criados coexiste com a abundância do senhor.\",\"verificacao\":\"verificada\",\"linha\":\"671\"},{\"id\":\"R079\",\"tipo_recurso\":\"eufemismo\",\"citacao\":\"dormindo está, eterno há de ser o seu descanso\",\"localizacao\":\"L0689-L0690\",\"personagem\":\"Judite\",\"interpretacao\":\"O sono desliza para a morte no espaço de uma vírgula. O eufemismo é idêntico em função ao de Caim (L0239), com valoração moral oposta.\",\"verificacao\":\"verificada\",\"linha\":\"689\"},{\"id\":\"R080\",\"tipo_recurso\":\"apóstrofe\",\"citacao\":\"morre ó mostro da tirania não blazones de atrevido quando uma molher te osurpa os assentos\",\"localizacao\":\"L0692-L0694\",\"personagem\":\"Judite\",\"interpretacao\":\"O golpe é acompanhado de sentença. «Assentos» retoma pela terceira vez a palavra que Luzbel quis ocupar (L0040) e que São Miguel lhe negou (L0053): a inversão hierárquica fecha aqui o seu ciclo.\",\"verificacao\":\"verificada\",\"linha\":\"692\"},{\"id\":\"R081\",\"tipo_recurso\":\"comparação\",\"citacao\":\"Oh valerosa Pantalisea, bote, bote aqui neste avental que eu levo lá para dentro\",\"localizacao\":\"L0695-L0696\",\"personagem\":\"Velha\",\"interpretacao\":\"Judite é saudada como Pentesileia e no mesmo fôlego convidada a pôr a cabeça num avental. A queda do registo épico para o doméstico é o mais eficaz bathos do papel.\",\"verificacao\":\"verificada\",\"linha\":\"695\"},{\"id\":\"R082\",\"tipo_recurso\":\"ironia\",\"citacao\":\"Quem havia de ser senão aquela caganita que lhe levou a cabeça\",\"localizacao\":\"L0707-L0708\",\"personagem\":\"Mestre-Sala\",\"interpretacao\":\"O tiranicídio é reportado em linguagem de insulto de rua. O criado retira à heroína a solenidade que o texto sério lhe atribui, e a peça deixa as duas leituras coexistir.\",\"verificacao\":\"verificada\",\"linha\":\"707\"},{\"id\":\"R083\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"aqui tens a cabeça mais ferina\",\"localizacao\":\"L0719\",\"personagem\":\"Judite\",\"interpretacao\":\"Superlativo que transforma o despojo em prova pública. A oitava final devolve o passo ao registo elevado, apagando o entremez que acabara de decorrer.\",\"verificacao\":\"verificada\",\"linha\":\"719\"},{\"id\":\"R084\",\"tipo_recurso\":\"apóstrofe\",\"citacao\":\"Descuidados pastores, ter sentido, despertai desse sono tão profundo\",\"localizacao\":\"L0733-L0734\",\"personagem\":\"Anjo\",\"interpretacao\":\"O anúncio começa por repreensão. O sono dos pastores é o mesmo descuido moral de que a peça vem tratando desde Adão, e o despertar vale por conversão.\",\"verificacao\":\"verificada\",\"linha\":\"733\"},{\"id\":\"R085\",\"tipo_recurso\":\"anáfora\",\"citacao\":\"Já o Céu glória em si está possuindo, já os homens tem paz, gosto jocundo\",\"localizacao\":\"L0737-L0738\",\"personagem\":\"Anjo\",\"interpretacao\":\"A dupla anáfora do «já» marca a mudança de tempo teológico: o que era espera passa a estado presente. É a articulação que justifica todos os passos anteriores.\",\"verificacao\":\"verificada\",\"linha\":\"737\"},{\"id\":\"R086\",\"tipo_recurso\":\"antítese\",\"citacao\":\"ou será favor do Céu ou é sonho do sentido\",\"localizacao\":\"L0747-L0748\",\"personagem\":\"Alceto\",\"interpretacao\":\"Fala colectiva dos pastores. A alternativa entre revelação e ilusão é resolvida pela verificação («pois eu os olhos abrindo», L0750), procedimento que dá ao milagre o estatuto de facto testemunhado.\",\"verificacao\":\"verificada\",\"linha\":\"747\"},{\"id\":\"R087\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"vi encaminhar-se ao Céu um celeste paranifo\",\"localizacao\":\"L0751-L0752\",\"personagem\":\"Alceto\",\"interpretacao\":\"«Paraninfo» — o que conduz a noiva — aplica ao anjo vocabulário de núpcias, alusão à união entre o divino e o humano que o Natal celebra.\",\"verificacao\":\"verificada\",\"linha\":\"751\"},{\"id\":\"R088\",\"tipo_recurso\":\"antítese\",\"citacao\":\"Tens do céu estimação, arruinado idifício, pois em ti nasce o prencípio para a nossa salvação\",\"localizacao\":\"L0765-L0768\",\"personagem\":\"Alceto\",\"interpretacao\":\"A ruína material é a condição da elevação espiritual. Esta antítese é a formulação central da teologia do presépio e responde, ponto por ponto, à ruína de Betúlia.\",\"verificacao\":\"verificada\",\"linha\":\"765\"},{\"id\":\"R089\",\"tipo_recurso\":\"anáfora\",\"citacao\":\"Quanto posso e quanto tenho desde já fica ofrecido\",\"localizacao\":\"L0771-L0772\",\"personagem\":\"Alceto\",\"interpretacao\":\"A oferta define-se por totalidade, não por quantidade. A anáfora mede a dádiva pela capacidade e não pelo valor — doutrina que Anfriso completará oferecendo a pobreza.\",\"verificacao\":\"verificada\",\"linha\":\"771\"},{\"id\":\"R090\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"só por ser ademetido ao vosso santo rebenho\",\"localizacao\":\"L0773-L0774\",\"personagem\":\"Alceto\",\"interpretacao\":\"O pastor pede para ser ovelha. A inversão de papéis dentro da própria metáfora pastoril é o modo como o passo articula ofício real e figura religiosa.\",\"verificacao\":\"verificada\",\"linha\":\"773\"},{\"id\":\"R091\",\"tipo_recurso\":\"apóstrofe\",\"citacao\":\"Oh, ditosas porfecias de alto mistério profundo\",\"localizacao\":\"L0785-L0786\",\"personagem\":\"Amador\",\"interpretacao\":\"A invocação dirige-se às profecias e não a Deus: o que se celebra é o cumprimento de um texto, o que faz do presépio a última cena de uma escritura.\",\"verificacao\":\"verificada\",\"linha\":\"785\"},{\"id\":\"R092\",\"tipo_recurso\":\"antítese\",\"citacao\":\"para ter fim todo o mal, é nascido o nosso bem\",\"localizacao\":\"L0797-L0798\",\"personagem\":\"Florindo\",\"interpretacao\":\"Fecho doutrinal da adoração, com paralelismo perfeito entre mal e bem. Encerra a série de antíteses aberta em L0169 pela auto-acusação de Adão.\",\"verificacao\":\"verificada\",\"linha\":\"797\"},{\"id\":\"R093\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"Todas as horas e dias seja o louvor de contínuo\",\"localizacao\":\"L0789-L0790\",\"personagem\":\"Amador\",\"interpretacao\":\"A totalidade temporal do louvor responde à totalidade da oferta (L0771). Os quatro pastores repartem entre si os modos possíveis de dar.\",\"verificacao\":\"verificada\",\"linha\":\"789\"},{\"id\":\"R094\",\"tipo_recurso\":\"apóstrofe\",\"citacao\":\"Ah tempos, tempos, como estais virsificados dos antigos tempos!\",\"localizacao\":\"L0818\",\"personagem\":\"Manuel Gonçalves\",\"interpretacao\":\"Tópico do elogio do tempo antigo, transposto para a boca de um pescador. A queixa geracional abre o monólogo e legitima a evocação nostálgica que se segue.\",\"verificacao\":\"verificada\",\"linha\":\"818\"},{\"id\":\"R095\",\"tipo_recurso\":\"ironia\",\"citacao\":\"Qui seja possibli que estes labutem nos destranques e que eu ande chafurdando na obra da arca\",\"localizacao\":\"L0818\",\"personagem\":\"Manuel Gonçalves\",\"interpretacao\":\"Fala metateatral: o actor queixa-se do serviço que lhe dá a máquina do dilúvio. É a prova interna mais forte de que este monólogo é a «parte» anunciada em L0289, dentro do passo de Noé.\",\"verificacao\":\"verificada\",\"linha\":\"818\"},{\"id\":\"R096\",\"tipo_recurso\":\"comparação\",\"citacao\":\"uma delas era mocetona como um barco\",\"localizacao\":\"L0818\",\"personagem\":\"Manuel Gonçalves\",\"interpretacao\":\"O corpo feminino medido em tonelagem. A comparação instala o campo náutico que organizará todo o monólogo, do vestuário à correspondência amorosa.\",\"verificacao\":\"verificada\",\"linha\":\"818\"},{\"id\":\"R097\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"era um camezote de Holanda, de vela de navios, com punhos e bofes de casa de traquete\",\"localizacao\":\"L0818\",\"personagem\":\"Manuel Gonçalves\",\"interpretacao\":\"A camisa é descrita peça a peça como aparelho de navio. O luxo é dito no único vocabulário técnico que o falante possui — o que é simultaneamente cómico e socialmente exacto.\",\"verificacao\":\"verificada\",\"linha\":\"818\"},{\"id\":\"R098\",\"tipo_recurso\":\"enumeração\",\"citacao\":\"pondem-se-á 3 casões, 20 arraias, 18 safios, 30 eroses , 60 caxuxos, e de sardinhas 500\",\"localizacao\":\"L0818\",\"personagem\":\"Manuel Gonçalves\",\"interpretacao\":\"Inventário de pescado com quantidades crescentes. A enumeração serve de prova de amor e é, ao mesmo tempo, o documento lexical mais rico do papel sobre a pesca da costa.\",\"verificacao\":\"verificada\",\"linha\":\"818\"},{\"id\":\"R099\",\"tipo_recurso\":\"trocadilho\",\"citacao\":\"te rimeto esse despigo pois ainda me não despigo\",\"localizacao\":\"L0821-L0822\",\"personagem\":\"Manuel Gonçalves\",\"interpretacao\":\"Paronomásia entre o despojo de pescado e o despicar-se amoroso. A décima do pescador constrói-se inteira sobre este tipo de duplo sentido técnico-afectivo.\",\"verificacao\":\"verificada\",\"linha\":\"821\"},{\"id\":\"R100\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"pois vai com o sangue na guelra\",\"localizacao\":\"L0829\",\"personagem\":\"Manuel Gonçalves\",\"interpretacao\":\"A frescura do peixe garante a frescura do amor. A metáfora funde por completo o campo do ofício e o do sentimento, sem resto.\",\"verificacao\":\"verificada\",\"linha\":\"829\"},{\"id\":\"R101\",\"tipo_recurso\":\"trocadilho\",\"citacao\":\"pois na compra do carinho, ninguém me tira do lanço\",\"localizacao\":\"L0832-L0833\",\"personagem\":\"Manuel Gonçalves\",\"interpretacao\":\"«Lanço» é ao mesmo tempo o lance da rede e o lance do leilão. O afecto é dito como transacção em que o falante não se deixa cobrir.\",\"verificacao\":\"verificada\",\"linha\":\"832\"},{\"id\":\"R102\",\"tipo_recurso\":\"trocadilho\",\"citacao\":\"só contigo mi trismalho\",\"localizacao\":\"L0839\",\"personagem\":\"Manuel Gonçalves\",\"interpretacao\":\"O trasmalho é a rede de três malhas e «tresmalhar-se» é perder-se. O verso condensa em três palavras a arte e o desnorte amoroso.\",\"verificacao\":\"verificada\",\"linha\":\"839\"},{\"id\":\"R103\",\"tipo_recurso\":\"alegoria\",\"citacao\":\"Fichi a carta e miti a chavi n'alzibeira, embarquei-a no paquete, largou este o passo todo, foi bolinando por i fora, chegou à porta da moça, pouse a capa, fez sinal à fortaleza\",\"localizacao\":\"L0841\",\"personagem\":\"Manuel Gonçalves\",\"interpretacao\":\"A entrega da carta é narrada como viagem completa de embarcação, com manobra, aproximação e sinal à fortaleza. É a alegoria mais desenvolvida do papel e transforma um recado numa campanha naval.\",\"verificacao\":\"verificada\",\"linha\":\"841\"},{\"id\":\"R104\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"cingi a farrusca a balravento, mandi abri os embornais nos sapatos, pus o galério no topi, virei o gajeiro para a parte esquerda\",\"localizacao\":\"L0841\",\"personagem\":\"Manuel Gonçalves\",\"interpretacao\":\"O corpo vestido é aparelhado como navio, do calçado ao chapéu. O léxico náutico converte-se aqui em código de elegância popular.\",\"verificacao\":\"verificada\",\"linha\":\"841\"},{\"id\":\"R105\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"só os bofes afogados podiam encher todas as tavernas do mal cozinhado\",\"localizacao\":\"L0841\",\"personagem\":\"Manuel Gonçalves\",\"interpretacao\":\"Os folhos da camisa dariam para abastecer as casas de comida da Ribeira. A hipérbole mede o traje pela geografia comercial de Lisboa.\",\"verificacao\":\"verificada\",\"linha\":\"841\"},{\"id\":\"R106\",\"tipo_recurso\":\"ironia\",\"citacao\":\"mas isperi, com quem falo eu\",\"localizacao\":\"L0841\",\"personagem\":\"Manuel Gonçalves\",\"interpretacao\":\"Interrupção metateatral que devolve o falante à consciência do público. Fecha o monólogo com a mesma quebra de ilusão com que ele começara (L0818).\",\"verificacao\":\"verificada\",\"linha\":\"841\"},{\"id\":\"R107\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"vamos entrando na palesta de Cupido\",\"localizacao\":\"L0861\",\"personagem\":\"Chantre\",\"interpretacao\":\"A portaria do convento é declarada palestra — lugar de combate e de exercício. O galanteio é enquadrado desde a primeira fala como desporto regrado.\",\"verificacao\":\"verificada\",\"linha\":\"861\"},{\"id\":\"R108\",\"tipo_recurso\":\"antítese\",\"citacao\":\"que sendo esta portaria aula de amorosos certames, se veja agora teatro de mercancias\",\"localizacao\":\"L0861\",\"personagem\":\"Chantre\",\"interpretacao\":\"Contraste entre o passado cortês e o presente comercial da mesma grade. A palavra «teatro» acrescenta uma camada metateatral à sátira do freiratismo.\",\"verificacao\":\"verificada\",\"linha\":\"861\"},{\"id\":\"R109\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"os frios corações de afectos perseverantes vinham buscar calor no moratório aos raios de tantos sóis que garnecem esta clausura\",\"localizacao\":\"L0861\",\"personagem\":\"Chantre\",\"interpretacao\":\"As freiras são sóis e a clausura é braseiro. A metáfora petrarquista é aplicada com toda a seriedade a um espaço religioso, e é dessa impropriedade que nasce a sátira.\",\"verificacao\":\"verificada\",\"linha\":\"861\"},{\"id\":\"R110\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"Se a enfirmidade de amor precisa de junta, aqui está um doutor\",\"localizacao\":\"L0867\",\"personagem\":\"Doutor\",\"interpretacao\":\"O amor como doença que requer junta médica. A isotopia clínica atravessará todo o passo e permite ao Doutor tratar sentimentos como sintomas.\",\"verificacao\":\"verificada\",\"linha\":\"867\"},{\"id\":\"R111\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"ainda não está enferma a nossa conrespondência\",\"localizacao\":\"L0869\",\"personagem\":\"Chantre\",\"interpretacao\":\"O Chantre aceita a metáfora do outro e continua-a. A amizade é diagnosticada como se fosse corpo — sinal de que os dois falam a mesma língua paródica.\",\"verificacao\":\"verificada\",\"linha\":\"869\"},{\"id\":\"R112\",\"tipo_recurso\":\"trocadilho\",\"citacao\":\"Função rija? De que é, de pau do Brasil?\",\"localizacao\":\"L0871\",\"personagem\":\"Doutor\",\"interpretacao\":\"O adjectivo «rija» é desviado do sentido de solene para o de dura, e daí para a madeira colonial. O equívoco obsceno funciona por deslize material.\",\"verificacao\":\"verificada\",\"linha\":\"871\"},{\"id\":\"R113\",\"tipo_recurso\":\"trocadilho\",\"citacao\":\"Por que mandaste vir algum romendão? Ora estimo pois também quero o meu romendo\",\"localizacao\":\"L0875\",\"personagem\":\"Doutor\",\"interpretacao\":\"Jogo entre o músico remendão e o remendo. A resposta rebaixa o concerto anunciado a trabalho de costura.\",\"verificacao\":\"verificada\",\"linha\":\"875\"},{\"id\":\"R114\",\"tipo_recurso\":\"sátira\",\"citacao\":\"Tudo o que é asneira é despidido juízo, pois na loucura não se dá acto de descurso Ergo; é vossa mercê um pedaço d'asno\",\"localizacao\":\"L0883\",\"personagem\":\"Doutor\",\"interpretacao\":\"Silogismo escolástico completo, com «Ergo» incluído, ao serviço de um insulto. É o núcleo intelectual do entremez: a lógica das escolas exibida como maquinaria vazia.\",\"verificacao\":\"verificada\",\"linha\":\"883\"},{\"id\":\"R115\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"Quem, por destino dos astros, vem comprir o fado desta portaria\",\"localizacao\":\"L0889-L0890\",\"personagem\":\"Chantre\",\"interpretacao\":\"Resposta a uma porteira formulada em estilo de tragédia. O desajuste entre a grandeza do enunciado e a banalidade da situação é o método cómico do passo.\",\"verificacao\":\"verificada\",\"linha\":\"889\"},{\"id\":\"R116\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"É forte lobisomi\",\"localizacao\":\"L0892\",\"personagem\":\"Doutor\",\"interpretacao\":\"Aparte que classifica o companheiro como criatura nocturna. O Doutor comenta à parte tudo o que o Chantre diz a sério, mantendo o público do seu lado.\",\"verificacao\":\"verificada\",\"linha\":\"892\"},{\"id\":\"R117\",\"tipo_recurso\":\"ironia\",\"citacao\":\"Se a saúde tem notícia dela, pregoa/prego-a no mar\",\"localizacao\":\"L0896\",\"personagem\":\"Doutor\",\"interpretacao\":\"A saúde da freira é dada por perdida numa fórmula de escárnio marítimo. A barra é do transcritor e assinala leitura dupla, não uma escolha do texto.\",\"verificacao\":\"verificada\",\"linha\":\"896\"},{\"id\":\"R118\",\"tipo_recurso\":\"ironia\",\"citacao\":\"estimarei que vossa senhoria conte dilatados anos só para vir a ser desengano das idades\",\"localizacao\":\"L0900\",\"personagem\":\"Doutor\",\"interpretacao\":\"O voto de vida longa converte-se em insulto pela finalidade que lhe é dada. É a construção irónica mais fina do papel: a cortesia usada como veículo exacto da ofensa.\",\"verificacao\":\"verificada\",\"linha\":\"900\"},{\"id\":\"R119\",\"tipo_recurso\":\"ironia\",\"citacao\":\"Não, minha senhora, mas está já muito alquebrada\",\"localizacao\":\"L0904\",\"personagem\":\"Doutor\",\"interpretacao\":\"A negação atenuante agrava o insulto anterior. O par pergunta/resposta mostra que a vítima entende, o que aumenta a crueldade cómica.\",\"verificacao\":\"verificada\",\"linha\":\"904\"},{\"id\":\"R120\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"Isso é uma traquinada de cacos que vinha da botica\",\"localizacao\":\"L0922\",\"personagem\":\"Galego\",\"interpretacao\":\"O criado reporta a medicação como estrondo de louça. A deformação popular do vocabulário médico caracteriza-o socialmente e ridiculariza a farmacopeia.\",\"verificacao\":\"verificada\",\"linha\":\"922\"},{\"id\":\"R121\",\"tipo_recurso\":\"ironia\",\"citacao\":\"Ó galego, teu amo quer pôr agora loje de sabão!\",\"localizacao\":\"L0924\",\"personagem\":\"Doutor\",\"interpretacao\":\"Do relato dos frascos deduz-se um negócio de sabão. O Doutor troça do criado e, por tabela, do amo que o emprega.\",\"verificacao\":\"verificada\",\"linha\":\"924\"},{\"id\":\"R122\",\"tipo_recurso\":\"ironia\",\"citacao\":\"Vai, que eu cá a irei temperando\",\"localizacao\":\"L0932\",\"personagem\":\"Doutor\",\"interpretacao\":\"O verbo oscila entre acalmar e afinar, com evidente insinuação. O médico oferece-se para cuidar da prima na ausência do primo.\",\"verificacao\":\"verificada\",\"linha\":\"932\"},{\"id\":\"R123\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"quem ama, os minutos lhe parece itirnidade\",\"localizacao\":\"L0952\",\"personagem\":\"Freira\",\"interpretacao\":\"Tópico petrarquista do tempo dilatado, dito com toda a seriedade dentro de uma cena cómica. A Freira é a única personagem do passo que não faz troça de ninguém.\",\"verificacao\":\"verificada\",\"linha\":\"952\"},{\"id\":\"R124\",\"tipo_recurso\":\"sátira\",\"citacao\":\"Ah, que a freira quer ter cachorrinho de fralda a toda a hora\",\"localizacao\":\"L0954\",\"personagem\":\"Doutor\",\"interpretacao\":\"O primo é reduzido a animal de regaço. A imagem satiriza de um golpe o freiratismo, a ociosidade conventual e a masculinidade do Chantre.\",\"verificacao\":\"verificada\",\"linha\":\"954\"},{\"id\":\"R125\",\"tipo_recurso\":\"sátira\",\"citacao\":\"seriam poucos todos os gorgomilos para poblicar a glória que tenho de ver a vossa senhoria\",\"localizacao\":\"L0958\",\"personagem\":\"Doutor\",\"interpretacao\":\"Paródia do estilo cultista levada ao limite do inteligível. O excesso de ornamento denuncia-se a si próprio, e o cumprimento não chega a significar nada.\",\"verificacao\":\"verificada\",\"linha\":\"958\"},{\"id\":\"R126\",\"tipo_recurso\":\"comparação\",\"citacao\":\"Seu primo parece-me um bonecro\",\"localizacao\":\"L0962\",\"personagem\":\"Doutor\",\"interpretacao\":\"O Chantre é comparado a um boneco. A redução a objecto articulado prepara o soneto ridículo que ele próprio vai declamar.\",\"verificacao\":\"verificada\",\"linha\":\"962\"},{\"id\":\"R127\",\"tipo_recurso\":\"enumeração\",\"citacao\":\"Durmo pouco, ando sempre com mil pressas, visto às vezes as meias às avessas, não sei o que vou ler no bribiário\",\"localizacao\":\"L0975-L0977\",\"personagem\":\"Chantre\",\"interpretacao\":\"Catálogo de sintomas amorosos rebaixado do sofrimento cortês para o desmazelo doméstico. A meia às avessas substitui as insónias de Petrarca.\",\"verificacao\":\"verificada\",\"linha\":\"975\"},{\"id\":\"R128\",\"tipo_recurso\":\"sátira\",\"citacao\":\"fui marrar outro dia com um almário\",\"localizacao\":\"L0981-L0982\",\"personagem\":\"Chantre\",\"interpretacao\":\"O soneto amoroso termina com uma cabeçada num armário. O bathos final desmonta os treze versos anteriores e é a assinatura cómica do passo.\",\"verificacao\":\"verificada\",\"linha\":\"981\"},{\"id\":\"R129\",\"tipo_recurso\":\"sátira\",\"citacao\":\"Tenho um primo Joaquim que é um galante sujeito, comprei onte à tarde um leito para esta noute dormir\",\"localizacao\":\"L0992-L0995\",\"personagem\":\"Doutor\",\"interpretacao\":\"Décima de disparates encadeados sem nexo, em resposta ao soneto do Chantre. A paródia opera pela ausência total de pertinência — a forma poética mantém-se, o sentido evapora-se.\",\"verificacao\":\"verificada\",\"linha\":\"992\"},{\"id\":\"R130\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"depois de vos ouvir, prima adorada, já não tem mais que ouvir o meu desejo\",\"localizacao\":\"L1043-L1044\",\"personagem\":\"Chantre\",\"interpretacao\":\"Encerramento do encómio: ouvir a prima esgota o desejo de ouvir. A hipérbole é sincera dentro da ficção e ridícula fora dela.\",\"verificacao\":\"verificada\",\"linha\":\"1043\"},{\"id\":\"R131\",\"tipo_recurso\":\"ironia\",\"citacao\":\"que essa voz, pelo grosso e pelo fino, bem pode acompanhar qualquer defunto\",\"localizacao\":\"L1050-L1051\",\"personagem\":\"Doutor\",\"interpretacao\":\"Primeiro verso do contra-encómio. O soneto do Doutor responde ao do Chantre verso a verso, formando um díptico louvor/vitupério que é a construção retórica mais elaborada do papel.\",\"verificacao\":\"verificada\",\"linha\":\"1050\"},{\"id\":\"R132\",\"tipo_recurso\":\"comparação\",\"citacao\":\"esse eco substimado parece de rapaz inda de escola quando vai a fazer o seu recado\",\"localizacao\":\"L1057-L1059\",\"personagem\":\"Doutor\",\"interpretacao\":\"A voz da freira é comparada à de um moço de recados. A comparação retira-lhe simultaneamente idade, sexo e dignidade.\",\"verificacao\":\"verificada\",\"linha\":\"1057\"},{\"id\":\"R133\",\"tipo_recurso\":\"ironia\",\"citacao\":\"há de cantar os passos da charola\",\"localizacao\":\"L1063\",\"personagem\":\"Doutor\",\"interpretacao\":\"O destino artístico prometido é o das procissões da Quaresma. A referência local dá ao insulto uma precisão que o público reconheceria de imediato.\",\"verificacao\":\"verificada\",\"linha\":\"1063\"},{\"id\":\"R134\",\"tipo_recurso\":\"trocadilho\",\"citacao\":\"Cacau tem ela, que lhe dá o Chantre\",\"localizacao\":\"L1068\",\"personagem\":\"Doutor\",\"interpretacao\":\"Aparte obsceno construído sobre a mercadoria colonial que acaba de entrar em cena. É o ponto em que a sátira ao clero se torna mais crua.\",\"verificacao\":\"verificada\",\"linha\":\"1068\"},{\"id\":\"R135\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"Essa vozo é um trovão\",\"localizacao\":\"L1079\",\"personagem\":\"Preto (vendedor de cacau)\",\"interpretacao\":\"O elogio hiperbólico do vendedor é sincero e, por isso mesmo, mais devastador do que a ironia do Doutor. A voz que todos criticaram é aqui fenómeno meteorológico.\",\"verificacao\":\"verificada\",\"linha\":\"1079\"},{\"id\":\"R136\",\"tipo_recurso\":\"comparação\",\"citacao\":\"pode ir a uma função com os pretinhos de Guiné\",\"localizacao\":\"L1083-L1084\",\"personagem\":\"Preto (vendedor de cacau)\",\"interpretacao\":\"O louvor situa a freira numa festa negra de Lisboa. A comparação atravessa a fronteira social do convento e é, no papel, a única que o faz por elogio.\",\"verificacao\":\"verificada\",\"linha\":\"1083\"},{\"id\":\"R137\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"Ai, que o sebo vai-se derretendo\",\"localizacao\":\"L1090\",\"personagem\":\"Doutor\",\"interpretacao\":\"Aparte que traduz o enlevo geral em gordura a derreter. A metáfora corpórea desfaz o clima de galanteio no exacto momento em que ele culmina.\",\"verificacao\":\"verificada\",\"linha\":\"1090\"},{\"id\":\"R138\",\"tipo_recurso\":\"comparação\",\"citacao\":\"O senhor doutor parece que gritava àque del rei\",\"localizacao\":\"L1110\",\"personagem\":\"Preto (vendedor de cacau)\",\"interpretacao\":\"O canto do médico é comparado ao grito de socorro. A comparação vinga, sem intenção aparente, todas as troças que o Doutor distribuiu.\",\"verificacao\":\"verificada\",\"linha\":\"1110\"},{\"id\":\"R139\",\"tipo_recurso\":\"ironia\",\"citacao\":\"Se ele curasse os doentes cantando, morriam todos\",\"localizacao\":\"L1112\",\"personagem\":\"Galego\",\"interpretacao\":\"O criado remata o escárnio ao médico. É significativo que a sentença mais dura contra o Doutor venha do galego, a personagem de menor estatuto da cena.\",\"verificacao\":\"verificada\",\"linha\":\"1112\"},{\"id\":\"R140\",\"tipo_recurso\":\"antítese\",\"citacao\":\"quem não vive duvidoso não ama os finos desvelos\",\"localizacao\":\"L1120-L1121\",\"personagem\":\"Chantre\",\"interpretacao\":\"Glosa do mote «Quem tem amores, tem zelos». A antítese entre dúvida e amor é doutrina cortês tratada com seriedade, num contexto que a esvazia.\",\"verificacao\":\"verificada\",\"linha\":\"1120\"},{\"id\":\"R141\",\"tipo_recurso\":\"enumeração\",\"citacao\":\"Casado tem mulher, quem bem paga tem dinheiro, vende vinho o taverneiro, quem tem fome quer comer\",\"localizacao\":\"L1129-L1132\",\"personagem\":\"Doutor\",\"interpretacao\":\"Glosa feita inteira de truísmos. A forma poética cumpre-se com rigor enquanto o conteúdo se recusa: é paródia da glosa como exercício obrigatório de sociedade.\",\"verificacao\":\"verificada\",\"linha\":\"1129\"},{\"id\":\"R142\",\"tipo_recurso\":\"ironia\",\"citacao\":\"era preta dos outro laia, parenta dos Vasconcelos\",\"localizacao\":\"L1155-L1156\",\"personagem\":\"Preto (vendedor de cacau)\",\"interpretacao\":\"Atribui-se à mulher negra parentesco com uma casa nobre portuguesa. O verso brinca com a genealogia e com os apelidos impostos pela escravatura — leitura que o texto abre e não desenvolve.\",\"verificacao\":\"verificada\",\"linha\":\"1155\"},{\"id\":\"R143\",\"tipo_recurso\":\"sátira\",\"citacao\":\"que o mesmo é ter freira que cobrar a cabeça\",\"localizacao\":\"L1166\",\"personagem\":\"Doutor\",\"interpretacao\":\"Sentença final sobre o freiratismo, com jogo entre a cabeça que se cobra e a que se perde. Fecha o passo devolvendo-lhe o motivo da decapitação que o passo de Judite tratara a sério.\",\"verificacao\":\"verificada\",\"linha\":\"1166\"},{\"id\":\"R144\",\"tipo_recurso\":\"trocadilho\",\"citacao\":\"vá-se embora, que aqui não há frete\",\"localizacao\":\"L1180\",\"personagem\":\"Preto (vendedor de cacau)\",\"interpretacao\":\"«Frete» é carreto e é proveito. A altercação final entre os dois criados estrangeirados faz-se toda sobre os ofícios a que cada um é socialmente atribuído.\",\"verificacao\":\"verificada\",\"linha\":\"1180\"},{\"id\":\"R145\",\"tipo_recurso\":\"trocadilho\",\"citacao\":\"vá-se embora que aqui não há que esfolar\",\"localizacao\":\"L1182\",\"personagem\":\"Galego\",\"interpretacao\":\"Resposta simétrica, com o ofício de esfolar atribuído ao adversário. A peça acaba, significativamente, num conflito entre subalternos e não entre senhores.\",\"verificacao\":\"verificada\",\"linha\":\"1182\"}],\"personagens\":[{\"personagem\":\"Padre Eterno\",\"funcao_dramatica\":\"Criador, legislador e juiz; estrutura todo o primeiro terço por preceito e sanção\",\"simbologia\":\"A ordem como palavra eficaz: cada fala sua é seguida de uma mutação de cenário, de modo que a omnipotência se traduz materialmente em tramoia\"},{\"personagem\":\"Luzbel\",\"funcao_dramatica\":\"Antagonista inaugural; abre a peça com o soneto da revolta\",\"simbologia\":\"Soberba como erro de medida; a semelhança com Deus pretendida por usurpação, em espelho invertido da semelhança concedida a Adão\"},{\"personagem\":\"São Miguel\",\"funcao_dramatica\":\"Executor da sentença divina, em soneto simétrico ao de Luzbel\",\"simbologia\":\"A justiça como interrupção imediata e proporcional; a palavra que repõe a ordem que outra palavra tentara subverter\"},{\"personagem\":\"Adão\",\"funcao_dramatica\":\"Criatura, transgressor e penitente; passa da prosa ao verso depois da queda\",\"simbologia\":\"O homem como sujeito da culpa e da esperança; a sua penitência antecipa a Redenção que só Belém cumprirá\"},{\"personagem\":\"Eva\",\"funcao_dramatica\":\"Interlocutora da Serpente e primeira transgressora; co-protagonista da lamentação\",\"simbologia\":\"Recebe a maldição socialmente mais pesada do papel (dor, sujeição, domínio); a hierarquia doméstica setecentista dita como sentença divina\"},{\"personagem\":\"Serpente\",\"funcao_dramatica\":\"Tentadora; opera por pergunta antes de negar\",\"simbologia\":\"A palavra que engana pela forma; primeira de uma série de enganadores que continua no Diabo e se inverte na dissimulação virtuosa de Judite\"},{\"personagem\":\"Anjo\",\"funcao_dramatica\":\"Mensageiro celeste; expulsa do Paraíso em oitava e anuncia o Natal em oitava\",\"simbologia\":\"A mesma voz e a mesma estrofe fecham o arco que abriram: o desengano do mundo e a convocação a Belém são as duas pontas da peça\"},{\"personagem\":\"Coro\",\"funcao_dramatica\":\"Voz colectiva sentenciosa; responde com uma palavra a cada pergunta de Adão e Eva\",\"simbologia\":\"O destino como eco — aquilo que não se argumenta, apenas se repete\"},{\"personagem\":\"Abel\",\"funcao_dramatica\":\"Vítima do fratricídio; modelo de obediência que não pergunta\",\"simbologia\":\"A submissão devota como recusa de saber, contraposta ponto por ponto à curiosidade que perde Caim\"},{\"personagem\":\"Caim\",\"funcao_dramatica\":\"Fratricida; repete em escala humana o gesto de Luzbel\",\"simbologia\":\"O desespero que recusa até o amparo; única figura trágica a quem a peça retira a dignidade, entregando-a a um entremez\"},{\"personagem\":\"Diabo\",\"funcao_dramatica\":\"Tentador cómico; primeira grande ruptura de registo do papel\",\"simbologia\":\"O mal domesticado em mundanidade lisboeta — com chá, criadagem e visitas — e por isso mais perigoso do que o mal terrível\"},{\"personagem\":\"Noé\",\"funcao_dramatica\":\"Obediente exemplar; o seu passo é o mais breve e menos dramatizado\",\"simbologia\":\"A arca lida como clausura monástica: a salvação figurada como recolhimento regrado\"},{\"personagem\":\"Sem\",\"funcao_dramatica\":\"Filho de Noé; função coral de agradecimento\",\"simbologia\":\"A obediência filial como forma de piedade colectiva\"},{\"personagem\":\"Jafé\",\"funcao_dramatica\":\"Filho de Noé; reparte com Sem o agradecimento\",\"simbologia\":\"A gratidão repartida por vozes, que converte a salvação individual em rito de família\"},{\"personagem\":\"Olofernes\",\"funcao_dramatica\":\"Tirano assírio; antagonista de escala política, o único do papel\",\"simbologia\":\"O poder como excesso de linguagem: a sua ameaça é pura potência verbal, desmentida por uma mulher e um jantar\"},{\"personagem\":\"Judite\",\"funcao_dramatica\":\"Protagonista do passo mais longo; agente único da reviravolta\",\"simbologia\":\"Mulher forte que decapita o tirano; leitura tipológica tradicional como prefiguração de Maria, o que explica a sua presença num presépio\"},{\"personagem\":\"Sacerdote\",\"funcao_dramatica\":\"Autoridade religiosa que legitima a acção de Judite e a devolve à liturgia\",\"simbologia\":\"Converte iniciativa individual em causa colectiva; a fé como armadura que autoriza a violência\"},{\"personagem\":\"Mestre-Sala\",\"funcao_dramatica\":\"Gracioso do passo de Olofernes; comenta e desmonta toda a acção séria\",\"simbologia\":\"O criado que vê o senhor por dentro; é por ele que o sublime bíblico é continuamente rebaixado à rua de Lisboa\"},{\"personagem\":\"Velha\",\"funcao_dramatica\":\"Criada de Judite; cúmplice no plano sério e adversária do Mestre-Sala no cómico\",\"simbologia\":\"A velhice popular como língua solta e corpo desqualificado; produz o maior bathos do papel ao saudar Judite como Pentesileia e logo lhe pedir o avental\"},{\"personagem\":\"Volante\",\"funcao_dramatica\":\"Arauto; leva o ultimato e traz a recusa\",\"simbologia\":\"A brevidade da sua função sublinha que a guerra já estava decidida antes de ser anunciada\"},{\"personagem\":\"1.º Capitão\",\"funcao_dramatica\":\"Coro militar; fala um soneto a dois com o companheiro\",\"simbologia\":\"A obediência armada como forma métrica: o encaixe das réplicas é a imagem da disciplina\"},{\"personagem\":\"2.º Capitão\",\"funcao_dramatica\":\"Coro militar; completa os quartetos e tercetos do companheiro\",\"simbologia\":\"A intercambialidade das vozes como figura da tropa — nenhum dos dois tem traço próprio\"},{\"personagem\":\"Preto (criado de Olofernes)\",\"funcao_dramatica\":\"Cozinheiro; nega sucessivamente ao Mestre-Sala tudo o que ele pede\",\"simbologia\":\"A escassez vista de baixo e a hierarquia entre criados; fala na convenção teatral da língua de preto\"},{\"personagem\":\"Soldado\",\"funcao_dramatica\":\"Descobre o corpo de Olofernes e desencadeia o desfecho\",\"simbologia\":\"A autoridade militar reduzida a testemunha tardia do que já aconteceu\"},{\"personagem\":\"Alceto\",\"funcao_dramatica\":\"Pastor; abre a adoração oferecendo os seus bens\",\"simbologia\":\"A dádiva medida pela capacidade e não pelo valor; nome de tradição arcádica que o separa dos rústicos cómicos\"},{\"personagem\":\"Anfriso\",\"funcao_dramatica\":\"Pastor; oferece a própria pobreza\",\"simbologia\":\"O pobre que se apresenta como oferta — inversão da lógica do dom que sustenta a doutrina do presépio\"},{\"personagem\":\"Amador\",\"funcao_dramatica\":\"Pastor; oferece o louvor contínuo\",\"simbologia\":\"A totalidade temporal da devoção, resposta à totalidade material oferecida por Alceto\"},{\"personagem\":\"Florindo\",\"funcao_dramatica\":\"Pastor; formula a doutrina no fecho da adoração\",\"simbologia\":\"A síntese teológica posta na boca do último e mais humilde: o mal termina onde o bem nasce\"},{\"personagem\":\"Manuel Gonçalves\",\"funcao_dramatica\":\"Pescador; solo cómico autónomo, provavelmente a parte de actor anunciada no passo de Noé\",\"simbologia\":\"A Lisboa ribeirinha entra na peça pela boca de quem a trabalha; a sua queixa metateatral sobre a máquina da arca liga o entremez ao passo bíblico\"},{\"personagem\":\"Chantre\",\"funcao_dramatica\":\"Clérigo enamorado da prima freira; protagonista e alvo principal da sátira do último passo\",\"simbologia\":\"O freirático — o eclesiástico que faz da grade do convento salão de galanteio; fala em soneto quando quer ser levado a sério, o que o torna duplamente ridículo\"},{\"personagem\":\"Freira\",\"funcao_dramatica\":\"Prima do Chantre; sustenta a cena, pede o canto, distribui as vezes\",\"simbologia\":\"A clausura como espaço de sociabilidade mundana; não é censurada pelo texto — o riso recai sobre os homens que a cortejam\"},{\"personagem\":\"Doutor\",\"funcao_dramatica\":\"Médico; comentador satírico universal e motor cómico do passo\",\"simbologia\":\"O saber como impostura verbal: parodia o silogismo escolástico, o estilo cultista e a própria medicina\"},{\"personagem\":\"Galego\",\"funcao_dramatica\":\"Criado do Chantre; traz três vezes a má notícia com urgência crescente\",\"simbologia\":\"Tipo cómico fixo do teatro português: servil, de fala regionalizada e associado aos ofícios pesados\"},{\"personagem\":\"Rodeira\",\"funcao_dramatica\":\"Irmã da roda; medeia o acesso à grade do convento\",\"simbologia\":\"O guarda da clausura que na prática a franqueia; recebe do Doutor o insulto mais fino do papel\"},{\"personagem\":\"Preto (vendedor de cacau)\",\"funcao_dramatica\":\"Vendedor ambulante; entra "grau_certeza\":\"provável\",\"localizacao\":\"L1182\",\"n_ocorrencias\":\"1\"},{\"expressao\":\"frete\",\"significado_epoca\":\"Carreto, transporte pago; e, por extensão de calão, serviço ou proveito. Ambos os sentidos activos na altercação final\",\"grau_certeza\":\"provável\",\"localizacao\":\"L1148; L1180\",\"n_ocorrencias\":\"2\"},{\"expressao\":\"àque del rei\",\"significado_epoca\":\"Acuda-me el-rei — grito de socorro em via pública, fórmula fixa de apelo à justiça régia\",\"grau_certeza\":\"seguro\",\"localizacao\":\"L1110; L1186\",\"n_ocorrencias\":\"3\"},{\"expressao\":\"pau do Brasil\",\"significado_epoca\":\"Madeira dura de tinturaria vinda da colónia; serve de equívoco obsceno a partir do adjectivo rija\",\"grau_certeza\":\"seguro\",\"localizacao\":\"L0871\",\"n_ocorrencias\":\"1\"},{\"expressao\":\"romendão\",\"significado_epoca\":\"Remendão: músico ou artífice de má qualidade, em jogo com remendo de costura\",\"grau_certeza\":\"provável\",\"localizacao\":\"L0875\",\"n_ocorrencias\":\"2\"},{\"expressao\":\"charola\",\"significado_epoca\":\"Andor de procissão; cantar os passos da charola é actuar nas procissões da Quaresma\",\"grau_certeza\":\"provável\",\"localizacao\":\"L1063\",\"n_ocorrencias\":\"1\"},{\"expressao\":\"goloseis\",\"significado_epoca\":\"Glosar, desenvolver um mote em verso. Forma popular do termo técnico da poesia de sociedade\",\"grau_certeza\":\"provável\",\"localizacao\":\"L1114\",\"n_ocorrencias\":\"1\"},{\"expressao\":\"bribiário\",\"significado_epoca\":\"Breviário, livro das horas canónicas. Deformação que caracteriza a distracção amorosa do clérigo\",\"grau_certeza\":\"seguro\",\"localizacao\":\"L0977\",\"n_ocorrencias\":\"1\"},{\"expressao\":\"almário\",\"significado_epoca\":\"Armário. Metátese popular, usada aqui para o bathos final do soneto\",\"grau_certeza\":\"seguro\",\"localizacao\":\"L0982\",\"n_ocorrencias\":\"1\"},{\"expressao\":\"gorgomilos\",\"significado_epoca\":\"Goelas, gargantas. Termo baixo inserido em período de estilo cultista, para denunciar a impostura do ornamento\",\"grau_certeza\":\"seguro\",\"localizacao\":\"L0958\",\"n_ocorrencias\":\"1\"}],\"frequencias\":[{\"tipo_recurso\":\"metáfora\",\"n_ocorrencias\":\"31\"},{\"tipo_recurso\":\"ironia\",\"n_ocorrencias\":\"19\"},{\"tipo_recurso\":\"hipérbole\",\"n_ocorrencias\":\"18\"},{\"tipo_recurso\":\"antítese\",\"n_ocorrencias\":\"12\"},{\"tipo_recurso\":\"comparação\",\"n_ocorrencias\":\"11\"},{\"tipo_recurso\":\"trocadilho\",\"n_ocorrencias\":\"11\"},{\"tipo_recurso\":\"anáfora\",\"n_ocorrencias\":\"9\"},{\"tipo_recurso\":\"apóstrofe\",\"n_ocorrencias\":\"8\"},{\"tipo_recurso\":\"personificação\",\"n_ocorrencias\":\"6\"},{\"tipo_recurso\":\"sátira\",\"n_ocorrencias\":\"6\"},{\"tipo_recurso\":\"enumeração\",\"n_ocorrencias\":\"5\"},{\"tipo_recurso\":\"anacronismo\",\"n_ocorrencias\":\"4\"},{\"tipo_recurso\":\"alegoria\",\"n_ocorrencias\":\"2\"},{\"tipo_recurso\":\"eufemismo\",\"n_ocorrencias\":\"2\"},{\"tipo_recurso\":\"provérbio\",\"n_ocorrencias\":\"1\"}],\"validacao\":{\"valido\":true,\"erros\":[],\"avisos\":[\"Rubricas de fala presentes na transcrição mas ausentes de `personagens.csv`: Ambos, Jodid, Judid, Os dois, Todos. Podem ser variantes de grafia ou omissões da análise.\"],\"notas\":[\"`frequencias_recursos.csv` foi recalculada a partir de `recursos_expressivos.csv` (anáfora: declarado 10, real 9; hipérbole: declarado 17, real 18; antítese: declarado 15, real 12; ironia: declarado 20, real 19; enumeração: declarado 6, real 5; trocadilho: declarado 12, real 11; sátira: declarado 8, real 6).\"],\"metricas\":{\"citacoes_testadas\":145,\"citacoes_verificadas\":145,\"citacoes_deslocadas\":0,\"citacoes_nao_encontradas\":0,\"citacoes_sem_localizacao\":0,\"citacoes_verificadas_pct\":100.0,\"n_recursos\":145,\"n_tipos_recurso\":15,\"n_personagens\":35,\"n_relacoes\":63,\"n_vernaculo\":45,\"n_tipos_relacao\":10,\"n_linhas_peca\":1188,\"densidade_recursos_por_100_linhas\":12.21}},\"analise\":{\"personagens\":\"## Nota preliminar: o que é este papel\\n\\nAs linhas L0001–L0018 não pertencem à representação. São dois requerimentos do\\nempresário Henrique da Costa Passos, «Empresário do Teatro da Calçada da Graça»\\n(L0003), e o despacho que lhes responde: «Concedemos licença para o dia de hoje\\nsomente, sendo o papel que se há de representar o mesmo que já em outro tempo\\nteve as licenças necessárias. / Para os mais dias requeira à Real Mesa Censória.\\n/ Lisboa, 27 de Janeiro de 1779» (L0009–L0011). Este paratexto é decisivo para\\nler o que se segue, e por três razões.\\n\\nPrimeira: fixa a datação da *representação* — Janeiro de 1779, véspera do\\nEntrudo (L0003) — mas não a da *composição*. O suplicante alega expressamente\\nque «este é o mesmo papel que com licença do Santo Ofício se costumou sempre\\nrepresentar publicamente nos teatros de Lisboa» (L0003) e que «se acha com\\naprovações anigas do Santo Ofício» (L0016). O texto é, por confissão do próprio\\nempresário, repertório antigo em reposição. *Grau: seguro.*\\n\\nSegunda: explica a forma da peça. Um papel de repertório que se repõe todos os\\nanos acumula passos, e é exactamente isso que se observa: não há intriga única,\\nhá uma sequência de núcleos autónomos, cada um com o seu elenco, o seu metro e o\\nseu registo. Alguns são anunciados como tal — «Passo de Manuel Gonçalves»\\n(L0289), «Passo de Olefernes» (L0315), «Passo dos Pastores» (L0723), «Passo da\\nFreira» (L0848). *Grau: seguro.*\\n\\nTerceira: documenta a fricção censória. A representação foi embargada «pela\\nfalta de licença» (L0003) e foi preciso mandar «examinar aquela obra pelo prior\\nde S. Tomé» (L0016). Ora, a peça contém uma sátira de convento (Passo da\\nFreira), figuras diabólicas cómicas e um monólogo de calão marítimo — matéria\\nque justifica a cautela. A leitura do conjunto ganha em ser feita à luz desta\\nnegociação com o Santo Ofício. *Grau: provável.*\\n\\n## Elenco por passo\\n\\n### I. Vista de Glória (L0023–L0061)\\n\\n**Luzbel** — Antagonista inaugural; abre a peça. Função dramática: instaurar o\\nconflito cosmológico que todos os passos seguintes reencenam. Carga simbólica:\\nsoberba como erro de medida, formulada em linguagem de hierarquia e de trono —\\n«ao sólio subirei no mesmo instante / ocupando da glória o sacro assento / para\\nem tudo ficar seu similante» (L0039–L0041). A ambição é dita como *semelhança*\\nusurpada, o que a põe em espelho invertido com a criação do homem «à nossa\\nimagem e semelhança» (L0092): o que em Adão é dom, em Luzbel é roubo. *Grau da\\nleitura do espelho: provável.*\\n\\n**São Miguel** — Executor da sentença divina. Fala em soneto simétrico ao de\\nLuzbel, o que faz do passo um díptico formal. Carga simbólica: a justiça como\\nresposta imediata e proporcional; nota-se que sentencia sem consultar — «desde\\njá te sepulta no tromento» (L0048). A palavra de Miguel repõe a ordem que a\\npalavra de Luzbel tentou subverter. *Grau: seguro.*\\n\\n### II. Criação, Queda e Fratricídio (L0063–L0278)\\n\\n**Padre Eterno** — A personagem estruturante do primeiro terço. Função dramática\\ntripla: criador (fala performativa, «Desterrem-se as trevas», L0065), legislador\\n(«desta não comerás», L0105) e juiz («Adão, adão , aonde te escondes», L0123).\\nCarga simbólica: a ordem enquanto palavra eficaz — cada fala sua é seguida de\\numa didascália de máquina («Aparece o Sol», L0067; «Aparecem as árvores»,\\nL0083), de modo que a omnipotência se traduz materialmente em tramoia. É a\\npersonagem que menos dialoga e mais determina. *Grau: seguro.*\\n\\n**Adão** — Criatura, transgressor e penitente. Percorre os três estados numa\\nprogressão métrica visível: fala em prosa enquanto está no Paraíso, e passa a\\nverso — décimas e redondilhas — depois da queda (L0148 em diante). O verso\\nentra com a dor. Carga simbólica: o homem como sujeito da culpa e da esperança;\\na sua penitência antecipa a Redenção que a peça só cumprirá em Belém. *Grau da\\ncorrelação prosa/verso: provável.*\\n\\n**Eva** — Interlocutora da Serpente e primeira transgressora. Carga simbólica\\ndupla e desigual: recebe a maldição mais concreta e socialmente mais pesada de\\ntoda a peça — «naçarás filho algum sem empulsos de dores, será sojeita aos\\nperceitos do homem, e debaixo do seu domínio vivirás» (L0132) — enquanto Adão\\nrecebe a do trabalho. A hierarquia doméstica setecentista é aqui declarada como\\nsentença divina. Note-se, porém, que na lamentação Eva fala em pé de igualdade\\ncom Adão e que é dela a pergunta que abre o coro tríplice (L0214). *Grau: seguro.*\\n\\n**Serpente** — Função dramática: tentadora e sofista. Carga simbólica: a palavra\\nque engana pela forma da pergunta — começa por inquirir («Qual é destas árvores\\nque Deus te pôs de perceito», L0110) antes de negar. É o primeiro dos vários\\nenganadores da peça, série que continua no Diabo cómico e culmina, invertida, na\\ndissimulação virtuosa de Judite. *Grau: provável.*\\n\\n**Anjo** — Rubrica que cobre duas entidades distintas: o anjo da expulsão\\n(L0136–L0144) e o anjo anunciador dos pastores (L0725, L0731). Trato-as como uma\\nsó entrada por a transcrição não as distinguir, mas simbolicamente são inversas:\\no primeiro expulsa em oitava («vai que o mundo te dará o desengano», L0144), o\\nsegundo convoca em oitava («ide logo a Belém a ver nascido», L0735). A peça\\nfecha, com a mesma voz e a mesma estrofe, o arco que abriu. *Grau: provável.*\\n\\n**Coro** — Voz colectiva sentenciosa. Intervém uma única vez, com três palavras\\nisoladas — «Morrer.» (L0216), «Sentir.» (L0219), «Chorar.» (L0221) — que Adão e\\nEva recolhem no dístico final: «poi são as pensões da vida: / morrer, sentir e\\nchorar» (L0224–L0225). Carga simbólica: o destino como eco, isto é, como algo\\nque não se argumenta, apenas se repete. *Grau: seguro.*\\n\\n**Abel** — Vítima e modelo de submissão devota: «Em mim nunca dominou vaidade,\\nsou escravo do senhor, e mais não sei» (L0238). Carga simbólica: a obediência\\nque não pergunta, explicitamente contraposta à curiosidade de Caim. *Grau: seguro.*\\n\\n**Caim** — Fratricida. Função dramática: repetir em escala humana o gesto de\\nLuzbel — a comparação invejosa («acaso julgas-te mais saprior qu'eu?», L0237)\\né a mesma pretensão de igualdade. Carga simbólica: o desespero que recusa até o\\namparo, e que por isso se torna presa cómica do Diabo. É a única personagem\\ntrágica a quem a peça retira a dignidade, entregando-a a um entremez. *Grau: provável.*\\n\\n**Diabo** — A primeira grande ruptura de registo da peça, e a mais reveladora.\\nFala em prosa cómica e moderna a uma personagem que acaba de falar em prosa\\nbíblica. Oferece a Caim «uma sala onde tome chá com o meu amigo Poltão» (L0262)\\ne apresenta um criado «que o tomei por valete de chambri» (L0264): o Inferno é\\ndesenhado como casa nobre lisboeta de setecentos, com criadagem, chá e visitas.\\nCarga simbólica: o mal domesticado em mundanidade — mais perigoso por ser\\nconvidativo. *Grau: seguro.*\\n\\n### III. Perceito de Noé (L0280–L0311)\\n\\n**Noé** — Obediente exemplar; o seu passo é o mais breve e o menos dramatizado\\n(o dilúvio ocorre entre duas falas, na elipse de L0296–L0298). Carga simbólica:\\na arca como clausura — «samos mandados clausurar em uma arca» (L0292) — o que\\ntransporta o episódio para o vocabulário conventual português. *Grau: seguro.*\\n\\n**Sem** e **Jafé** — Filhos; função coral, distribuindo o agradecimento por\\nvozes. Cam está ausente, o que é significativo mas pode ser lacuna da cópia.\\n*Grau da ausência intencional: hipotético.*\\n\\n### IV. Passo de Olofernes (L0315–L0721)\\n\\nO passo mais longo e mais elaborado, com lista de personagens explícita\\n(L0317–L0324) e alternância rigorosa entre o registo heróico em verso e o\\nregisto cómico em prosa.\\n\\n**Olofernes** — Tirano. Função dramática: antagonista de escala política, o\\núnico da peça. Carga simbólica: o poder como excesso de linguagem — a sua\\nprimeira fala é uma tirada de vinte e tal versos, e a sua ameaça termina numa\\ntríade («tudo em pó, tudo em cinza e tudo em fogo», L0435) que é pura potência\\nverbal. O que o derruba não é um exército: é uma mulher e um jantar. *Grau: seguro.*\\n\\n**Judite** (rubricas *Judis*, L0319; *Judid*, L0443; *Jodid*, L0512) —\\nProtagonista. Função dramática: agente único da reviravolta. Carga simbólica\\ndensa e tipológica: mulher forte que decapita o tirano, figura tradicionalmente\\nlida como prefiguração de Maria esmagando a serpente — o que explica a sua\\npresença num presépio. A peça sublinha-o ao pôr-lhe na boca a inversão de género\\nno momento do golpe: «não blazones de atrevido quando / uma molher te osurpa os\\nassentos» (L0693–L0694). *Grau da leitura tipológica: provável.*\\n\\n**Sacerdote** — Autoridade religiosa que legitima a acção de Judite e a devolve\\nà liturgia («não cessem os clamores no templo», L0459–L0461). Função dramática:\\nconverter iniciativa individual em causa colectiva. *Grau: seguro.*\\n\\n**Mestre-Sala** — O *gracioso* do passo e uma das personagens mais interessantes\\ndo papel. Função dramática: comentador cómico que acompanha toda a acção séria e\\na desmonta por baixo. Carga simbólica: o criado que vê o que o senhor não vê;\\nsabe que o amo é avaro («já meu amo tira hoje a ferruge ao seu dinheiro»,\\nL0467–L0468), reduz a ameaça de arrasar Betúlia a uma piada de bairro («E que\\nfunção terão os rapazes na Cotovia com tanta pedra?», L0569–L0570) e reduz a\\ndecapitação a um insulto («aquela caganita que lhe levou a cabeça», L0707–L0708).\\nÉ por ele que o sublime bíblico é continuamente rebaixado a Lisboa. *Grau: seguro.*\\n\\n**1.º Capitão** e **2.º Capitão** — Função dramática: coro militar; falam um\\nsoneto a dois, em alternância de quartetos e tercetos (L0368–L0380). Carga\\nsimbólica: a obediência armada como forma métrica — o encaixe perfeito das\\nréplicas é a própria imagem da disciplina. *Grau: provável.*\\n\\n**Volante** — Arauto. Existe para uma só função: levar o ultimato e trazer a\\nrecusa (L0393–L0399). Sublinha, pela brevidade, que a guerra já estava decidida.\\n*Grau: seguro.*\\n\\n**Velha** — Criada de Judite e figura cómica de segunda linha. Duas funções: no\\nplano sério, cúmplice silenciosa que recolhe a cabeça no avental (L0695–L0696);\\nno plano cómico, adversária do Mestre-Sala numa cena de insultos (L0619–L0651).\\nCarga simbólica: a velhice popular como língua solta e corpo desqualificado —\\nrecebe do Mestre-Sala a injúria «negra cristaleira do inferno» (L0654) e\\nresponde com ameaça física. É também a personagem que produz o maior *bathos* da\\npeça, ao saudar Judite como «valerosa Pantalisea» (L0695) e logo lhe mandar pôr\\na cabeça no avental. *Grau: seguro.*\\n\\n**Preto (criado de Olofernes)** — Cozinheiro. Fala na convenção teatral da\\n«língua de preto» («Inda não sá alinhavado», L0663). Função dramática: negar\\nsucessivamente ao Mestre-Sala tudo o que ele pede, numa gradação cómica que\\ntermina no vinho do amo. Carga simbólica: a escassez vista de baixo, e a\\nhierarquia entre criados — o Mestre-Sala manda no Preto exactamente como\\nOlofernes manda no Mestre-Sala. *Grau: provável.*\\n\\n**Soldado** — Descobre o corpo; função de desencadear o desfecho.\\n\\n### V. Passo dos Pastores (L0723–L0808)\\n\\n**Anjo** (ver acima), **Alceto**, **Anfriso** (também *Amfriso*, L0753),\\n**Amador**, **Florindo** — Os quatro pastores têm nomes de tradição arcádica, não\\npopular, o que os separa nitidamente dos rústicos cómicos da peça: não fazem rir.\\nFunção dramática: executar a adoração em décimas, uma por pastor\\n(L0765–L0804). Carga simbólica repartida com clareza — Alceto oferece bens\\n(«Quanto posso e quanto tenho / desde já fica ofrecido», L0771–L0772), Anfriso\\noferece a pobreza («chega este pobre pastor», L0778), Amador oferece o louvor\\n(L0789–L0790), Florindo formula a doutrina («para ter fim todo o mal, / é\\nnascido o nosso bem», L0797–L0798). É o único passo em que ninguém é ridículo.\\n*Grau: seguro.*\\n\\n### VI. Passo de Manuel Gonçalves (L0289, L0814–L0842)\\n\\n**Manuel Gonçalves** — Caso especial. O nome aparece três vezes: como anúncio de\\npasso dentro da sequência de Noé (L0289), como nota do transcritor («PARTE DE\\nMel. GONÇALVES??», L0297) e como assinatura depois do «Fim» dos Pastores\\n(L0814). O monólogo de L0818–L0842 é, quase de certeza, essa «parte»: um solo\\ncómico de pescador lisboeta. A prova interna é metateatral e está no próprio\\ntexto — o falante queixa-se de que os outros folgam «e que eu ande chafurdando\\nna obra da arca» (L0818), isto é, do trabalho que lhe dá a máquina do dilúvio.\\nFunção dramática: entremez de actor, autónomo da intriga. Carga simbólica: a\\nLisboa ribeirinha entra na peça pela boca de quem a trabalha. *Grau: provável.*\\n\\n### VII. Passo da Freira (L0848–L1188)\\n\\n**Chantre** — Clérigo enamorado da prima freira. Função dramática: protagonista\\ndo entremez e alvo principal da sátira. Carga simbólica: o *freirático*, figura\\nsocial bem documentada na Lisboa setecentista — o eclesiástico que faz da grade\\ndo convento salão de galanteio. Fala em soneto quando quer ser levado a sério\\n(L0974–L0984, L1031–L1044), o que o torna duplamente ridículo. *Grau: seguro.*\\n\\n**Freira** — Prima e objecto do galanteio. Função dramática: sustenta a cena,\\npede o canto, distribui as vezes. Carga simbólica: a clausura como espaço de\\nsociabilidade mundana — canta, recebe visitas, compra chocolate. Não é\\ncensurada pelo texto; o riso recai sobre os homens que a cortejam. *Grau: provável.*\\n\\n**Doutor** (Estevão, L0865) — Médico e verdadeiro motor cómico do passo. Função:\\ncomentador satírico universal — troça do Chantre, da Rodeira, da voz da Freira\\ne da própria medicina. Carga simbólica: o saber como impostura verbal. A sua\\nparódia de silogismo escolástico é o núcleo intelectual da sátira: «Tudo o que é\\nasneira é despidido juízo, pois na loucura não se dá acto de descurso Ergo; é\\nvossa mercê um pedaço d'asno» (L0883). *Grau: seguro.*\\n\\n**Rodeira** — A irmã da roda, porteira do convento. Função dramática: mediar o\\nacesso. Carga simbólica: o guarda da clausura que na prática a franqueia.\\nRecebe do Doutor o insulto mais fino da peça (L0900). *Grau: seguro.*\\n\\n**Galego** — Criado do Chantre. Função dramática: portador de más notícias, que\\nrepete três vezes com urgência crescente (L0908, L0934, L0999). Carga simbólica:\\no galego como tipo cómico fixo do teatro português — servil, de fala\\nregionalizada («Sim, benha deprissa», L0918), associado aos ofícios pesados\\n(«aqui não há que esfolar», L1182). *Grau: seguro.*\\n\\n**Preto (vendedor de cacau)** — Vendedor ambulante. Função: entrar com a\\nmercadoria colonial e ficar para a glosa. Carga simbólica: a presença negra\\nurbana em Lisboa, tratada pela convenção cómica da língua e do canto, mas com\\numa consciência explícita de condição — «todo o preto sá cativo» (L1159), verso\\nque, no contexto de uma glosa amorosa, produz um sentido duplo que o texto não\\ndesenvolve mas também não apaga. *Grau da leitura do duplo sentido: provável.*\\n\\n## Mapa de relações\\n\\n**Eixo vertical (hierárquico-divino).** Padre Eterno → São Miguel → Luzbel;\\nPadre Eterno → Adão/Eva/Serpente/Caim/Noé. É a relação dominante do primeiro\\nterço e funciona sempre por *preceito e sanção*, nunca por diálogo: as\\npersonagens divinas ordenam e julgam, não negoceiam. A única fala em que Deus\\nhesita — «Quasi me arrependo de o haver formado» (L0285) — é imediatamente\\nresolvida em decisão.\\n\\n**Eixo fraterno e conjugal.** Adão ↔ Eva, Abel ↔ Caim, Noé → Sem/Jafé. A peça\\nopõe metodicamente dois modelos de par: o que se solidariza na culpa (Adão e Eva\\nlamentam-se em uníssono, L0159–L0160) e o que se destrói pela comparação (Caim\\nmata precisamente porque compara rebanhos, L0233).\\n\\n**Eixo tirânico.** Olofernes → Capitães, Volante, Mestre-Sala: pura verticalidade\\nmilitar, com respostas de obediência formular («Já prontos obedecemos», L0576).\\nA relação Olofernes → Judite começa como galanteio de poder («todo este exército\\nestá ao teu mando», L0584–L0585) e é justamente esse desarmamento que a mata.\\n\\n**Eixo servil e cómico.** É o mais denso da peça e o que produz quase todo o\\nriso: Mestre-Sala ↔ Velha, Mestre-Sala → Preto, Galego → Chantre, Preto ↔ Galego.\\nEstrutura-se por cadeias: cada criado tem abaixo de si outro criado. O Mestre-Sala\\nserve Olofernes e manda no Preto; o Galego serve o Chantre e ameaça o Preto. A\\npeça reproduz assim, no plano cómico, a mesma verticalidade que o plano sério\\nrepresenta como ordem divina — e é aí, na duplicação, que se torna crítica.\\n*Grau: provável.*\\n\\n**Eixo devocional.** Anjo → pastores; Sacerdote ↔ Judite. Relações de convocação\\ne de confirmação, sem conflito. São as únicas relações horizontais e\\nconsensuais do papel.\\n\\n**Eixo amoroso.** Chantre ↔ Freira (paródia do amor cortês transposto para a\\ngrade); Olofernes → Judite (desejo como forma de guerra). Os dois são o mesmo\\nesquema com sinal trocado: no primeiro o galanteio é ridículo e inofensivo, no\\nsegundo é letal — para quem o exerce.\",\"vernaculo_recursos\":\"## Vernáculo, regionalismos e arcaísmos\\n\\nA camada lexical do papel divide-se com nitidez entre os passos bíblicos, cujo\\nvernáculo é sobretudo *gráfico e fonético* (metáteses e vocalismos populares\\nfixados pelo copista), e os passos cómicos, cujo vernáculo é *lexical e social*\\n(calão marítimo, língua de preto, fala galega, referências topográficas\\nlisboetas). A distribuição é ela própria um dado: a peça marca linguisticamente\\na fronteira entre o sagrado e o riso.\\n\\n### 1. Variação gráfica e fonética (passos bíblicos)\\n\\nNão são erros isolados, são um sistema. Predomina a **metátese** de /r/:\\n*perceito* por preceito (L0105, L0140, L0285), *tromento* por tormento (L0048,\\nL0274), *prigo/prigar* por perigo/perigar (L0113, L0304), *cubrantar/cobrantar*\\npor quebrantar (L0127, L0130), *fromará* por formará (L0053), *porpoção* por\\nproporção (L0359, L1037). Junta-se-lhe o vocalismo popular — *molher* (L0129,\\nL0694), *devina* (L0303, L0717), *emensos* (L0276, L0721), *naçarás* (L0132) — e\\nformas latinizantes de época como *idifício* (L0356, L0766) e *thuribulo*.\\nBluteau regista já muitas destas variantes como próprias da «gente vulgar».\\n*Grau: seguro.* Não normalizei nenhuma delas nas citações.\\n\\n### 2. Calão marítimo de Lisboa (monólogo de Manuel Gonçalves)\\n\\nA passagem mais rica do papel do ponto de vista lexicográfico. Reúne, num só\\nperíodo, nomes de pescado — «20 arraias, 18 safios, 30 eroses , 60 caxuxos, e de\\nsardinhas 500» (L0818) —, artes de pesca — *lanço* (L0833), *trismalho*\\n(L0839), *redes* (L0818) —, e todo o vocabulário de bordo aplicado por metáfora\\nao vestuário e ao corpo: *balravento*, *embornais*, *gajeiro*, *ensárcias*,\\n*galério*, *alzibeira* (L0841). Acrescem os topónimos da Lisboa ribeirinha:\\n«praia d'Alfamia» (L0818), «a Penha» (L0818), «as tavernas do mal cozinhado»\\n(L0841). *Grau: seguro para os termos náuticos; provável para «famelga» (moça)\\ne «galério» (chapéu).*\\n\\n### 3. Língua de preto\\n\\nConvenção teatral estabilizada no teatro português desde Gil Vicente, aqui usada\\nem dois passos distintos. Traços: cópula invariável *sá* por «é/está» («Inda não\\nsá alinhavado», L0663; «todo o preto sá cativo», L1159); negação dupla («Já nã\\nhá paio não», L0661); concordância não marcada («um garrafa de marufo», L0674;\\n«essa vozo é um trovão», L1079). Regista-se ainda *malufo/marufo* (L0672,\\nL0678), voz de origem africana para bebida fermentada, e *bangalé* (L1088),\\ndança. *Grau: seguro quanto à convenção; provável quanto à etimologia de\\nmalufo.*\\n\\n### 4. Fala galega\\n\\nMarcada por *b* por *v* («o que eu bi», L0914; «Sim, benha deprissa», L0918),\\npor vocalismo («deprissa») e por léxico do Norte peninsular — *cachopa* por\\nrapariga (L1141). O tipo vem acompanhado da sua caracterização social: o Galego\\né o que carrega e o que esfola (L1182). *Grau: seguro.*\\n\\n### 5. Latim macarrónico e paródia de saber\\n\\nDuas ocorrências, ambas cómicas: o Mestre-Sala finge latim para namorar a Velha\\n— «acessório séquito porém cipa-me cipale» (L0625–L0626), «cá com ego mei mihi»\\n(L0631), a que ela responde «ei sei cá latim!» (L0627) — e o Doutor arremeda a\\nlógica das escolas com um *Ergo* (L0883). Em ambos os casos o latim não\\ncomunica: exibe. *Grau: seguro.*\\n\\n### 6. Realia setecentistas\\n\\n*Bexigas* (varíola, L0254); *valete de chambri* (L0264); *topete alto à\\nZamperina* (L0504), penteado à moda da cantora de ópera Anna Zamperini, activa\\nem Lisboa nos anos 1770 — a datação relativa que este verso permite é o dado\\ncronológico interno mais útil do papel; *pau do Brasil* (L0871); *charola*\\n(L1063); *cacau* e *chicolate* (L1066, L1071); *àque del rei* (L1110, L1186),\\ngrito de socorro. *Grau: seguro, excepto a identificação de Zamperini\\n(provável).*\\n\\n## Recursos expressivos\\n\\n### Armação geral\\n\\nA peça é construída sobre **antíteses** de grande amplitude, que atravessam\\npassos diferentes e se respondem à distância. Três cadeias organizam o conjunto:\\n\\n1. **Alto/baixo.** O «sacro assento» que Luzbel quer ocupar (L0040) e o\\n   «assento» que Miguel lhe destina «no horrendo lugar da escuridade»\\n   (L0052–L0053); depois, invertida, a sentença de Judite: «uma molher te osurpa\\n   os assentos» (L0694). A mesma palavra, três posições.\\n2. **Ruína/salvação.** «arruinado idifício» dito do portal de Belém, e logo «em\\n   ti nasce o prencípio / para a nossa salvação» (L0766–L0768). A queda material\\n   é a condição da elevação espiritual.\\n3. **Água que mata / água que salva.** «O mundo flutua em um lago de tropezas»\\n   (L0285) prepara literalmente o dilúvio; depois do dilúvio, «a bênção chova em\\n   nós da mão divina» (L0307). A mesma imagem, o sinal trocado.\\n\\n*Grau: seguro para 1 e 3; provável para 2.*\\n\\n### Metáfora\\n\\nDomina em número. Distinguem-se três campos: o **jurídico-político** aplicado ao\\ndivino e à condição humana («como réu da culpa me escondi», L0127; «poi são as\\npensões da vida», L0224, em que *pensão* tem o valor coevo de encargo ou tributo\\ndevido), o **agrícola-pastoril**\\n(«Chora regando essa terra», L0162; «ao vosso santo rebenho», L0774) e o\\n**doméstico-mercantil**, que é o mais produtivo nos passos cómicos («já meu amo\\ntira hoje a ferruge ao seu dinheiro», L0467–L0468; «teatro de mercancias»,\\nL0861). A metáfora de época que mais diverge do uso actual é *clausurar* aplicado\\nà arca (L0292): o valor é o da clausura monástica, não o de encerramento\\ngenérico.\\n\\n### Comparação\\n\\nFrequentemente mitológica no registo heróico — «cujos peitos / excedem ao de\\nMartem» (L0326–L0327) — e deliberadamente prosaica no cómico, onde serve o\\n*bathos*: «uma delas era mocetona como um barco» (L0818), «Oh valerosa\\nPantalisea» seguido de «bote, bote aqui neste avental» (L0695–L0696). O contraste\\nentre os dois usos é o mecanismo cómico central do papel.\\n\\n### Ironia e sátira\\n\\nConcentram-se no Passo da Freira e no Mestre-Sala. A ironia é quase sempre de\\ncortesia invertida — o Doutor deseja à Rodeira «dilatados anos só para vir a ser\\ndesengano das idades» (L0900) — e o contra-encómio é levado a soneto inteiro:\\ndepois de o Chantre louvar a voz da prima em catorze versos (L1031–L1044), o\\nDoutor responde com outros catorze que a demolem, «bem pode acompanhar qualquer\\ndefunto» (L1050–L1051). Os dois sonetos formam um díptico encómio/vitupério que\\né a peça mais bem construída de todo o papel do ponto de vista retórico.\\n*Grau: seguro.*\\n\\n### Anacronismo\\n\\nNão é acidente: é procedimento. O Inferno serve chá (L0262), tem *valete de\\nchambre* (L0264) e conhece os ingleses e as bexigas (L0254); Judite entra na\\ntenda assíria com penteado da ópera de Lisboa (L0504); a destruição de Betúlia\\nevoca as pedradas dos rapazes na Cotovia (L0570). O efeito é duplo — faz rir e\\nactualiza o exemplo moral, trazendo a fábula bíblica para a rua do espectador.\\n*Grau: seguro.*\\n\\n### Anáfora e enumeração\\n\\nEstruturam os momentos de maior solenidade e os de maior comicidade, sem\\ndistinção. Solenes: a série criadora «Produza a terra… Produza o mar…\\nProduzam todas as aves… Produzam-se todos os animais» (L0082–L0087); a tríade\\nde Olofernes «tudo em pó, tudo em cinza e tudo em fogo» (L0435). Cómicas: as\\nmaldições em eco do Mestre-Sala, que devolve ao criado cada palavra que ele diz\\n— «Queimado sejas tu» (L0667), «Apodrecidos sejam os teus olhos» (L0669); e a\\nglosa de truísmos do Doutor (L1129–L1132).\\n\\n### Eufemismo\\n\\nDois, ambos sobre a morte e ambos em boca de quem mata: Caim, «com a tua morte\\nporarei fim a tantos cuidados» (L0239), e Judite, «dormindo está, eterno há de\\nser o seu descanso» (L0690). A simetria entre o assassino condenado e a heroína\\nsantificada não é comentada pelo texto, mas está lá. *Grau da leitura: hipotético.*\\n\\n### Trocadilho\\n\\nConcentra-se no Passo da Freira e no monólogo do pescador: *rija/pau do Brasil*\\n(L0871), *romendão/romendo* (L0875), *despigo/despigo* (L0821–L0822),\\n*lanço* de rede e de leilão (L0833), *trismalho* como rede e como\\n«tresmalhar-se» (L0839), e o obsceno *cacau/chicolate* (L1066–L1071). É o\\nrecurso mais denso por linha em todo o papel.\\n\\n### Fórmulas reaproveitadas\\n\\nObservação filológica com consequências: a oitava do Anjo da expulsão e a oitava\\nfinal de Judite partilham o mesmo molde. Compare-se «nem pode merecer mais tempo\\ngraça / que não pode guardar um só perceito» (L0139–L0140) com «nem pode mercer\\nmais tempo graças / quem espera o favor da mão devina» (L0716–L0717). O verso é\\no mesmo, com o segundo hemistíquio trocado. Isto confirma materialmente o que os\\nrequerimentos declaram: estamos perante um papel de compilação, montado a partir\\nde material formulário reutilizável. *Grau: provável.*\",\"limitacoes\":\"- **Paratexto vs. texto dramático.** As linhas L0001–L0018 são requerimentos e\\n  despachos administrativos, não peça. Foram usados para datação, proveniência e\\n  contexto censório, e excluídos das tabelas de personagens, relações e recursos.\\n\\n- **Passagens ilegíveis assinaladas pelo transcritor.** Registam-se com XX ou\\n  XXX e não foram objecto de conjectura: «posta em tremXX / em etrra» (L0415),\\n  «eu XXX mandi-lhe umas espinhas» (L0841), «o meu vistido de XX» (L0841).\\n  Também «Siollo» (L0658), primeira fala do Preto, é de leitura incerta.\\n\\n- **Leituras alternativas do transcritor.** A transcrição regista com barra as\\n  hipóteses concorrentes: «sito/dito» (L0863), «pregoa/prego-a» (L0896),\\n  «parmor/purmor» (L0825), «também/tão bem» (L0799), «caraça/carraça» (L1137),\\n  «sá/sô» (L1157), «lá/já» (L0944), «excer/exercer» (L0422), «a/à Penha»\\n  (L0818), «sacerdote / sacarladote» (L0324), «neguei/ninguém» (L0818). Onde\\n  citei, mantive a barra tal como está no ficheiro. Nenhuma foi resolvida.\\n\\n- **Quebras de palavra.** A transcrição conserva as mudanças de linha do\\n  manuscrito, que partem palavras a meio (por exemplo «a sua mes / ma cabeça»,\\n  L0450–L0451). As localizações indicam por isso intervalos de linha com\\n  frequência.\\n\\n- **Duas personagens com a mesma rubrica.** «Anjo» designa o anjo da expulsão\\n  (L0136) e o anjo dos pastores (L0725); «Preto» designa o cozinheiro de\\n  Olofernes (L0658 e ss.) e o vendedor de cacau do Passo da Freira (L1065 e ss.).\\n  Nas tabelas desdobrei os «Pretos» em duas entradas e mantive «Anjo» como uma\\n  só, por a função ser análoga (mensageiro celeste) enquanto a dos Pretos não é.\\n  A decisão é discutível em ambos os casos.\\n\\n- **Rubricas colectivas.** «Todos», «Ambos», «Os dois», «Dentro» e «Soldados»\\n  aparecem como rubricas de fala mas não são personagens: não foram incluídas em\\n  `personagens.csv`. As falas assim atribuídas foram imputadas ao grupo que fala\\n  no contexto, ou marcadas como «(didascália)» quando isso não era seguro.\\n\\n- **Variação onomástica.** Judite surge como *Judis* (L0319), *Judid* (L0443) e\\n  *Jodid* (L0512); Olofernes como *Olefernes* (L0315), *Olafernes* (L0400),\\n  *Olofornes* (L0381) e *Oslofernes* (L0671); Anfriso como *Amfriso* (L0753).\\n  Nas tabelas uniformizei para a forma mais corrente, conservando a variação nas\\n  citações. O validador assinalará a divergência — é o comportamento desejado.\\n\\n- **Cam ausente do passo de Noé.** Falam apenas Sem e Jafé (L0293, L0294).\\n  Não é possível determinar, só pelo texto, se se trata de opção do compilador,\\n  de lacuna da cópia ou de corte de representação.\\n\\n- **Autoria do monólogo do pescador.** A atribuição a Manuel Gonçalves apoia-se\\n  em três indícios convergentes (L0289, L0297, L0814) e num indício interno\\n  metateatral (L0818), mas o próprio transcritor marcou a passagem com dúvida\\n  («PARTE DE Mel. GONÇALVES??», L0297). Leitura provável, não segura.\\n\\n- **Música perdida.** O papel remete várias vezes para números cantados sem dar\\n  a letra ou o tom: «Canta a Freira» (L1027), «Canta e vai-se» (L0683), «Canta-se\\n  dentro uma cantiga com viola e adufe» (L0816). A dimensão musical do presépio\\n  — que era provavelmente substancial — não é recuperável a partir desta fonte.\\n\\n- **Estado do texto.** Trata-se de transcrição «sem revisões». Algumas\\n  irregularidades métricas e sintácticas podem ser do copista, do transcritor ou\\n  do original, e não foram distinguidas. As leituras semânticas propostas para\\n  passagens visivelmente corruptas (por exemplo o soneto de Luzbel, L0027–L0041,\\n  cuja sintaxe não fecha) são assinaladas como hipotéticas nas tabelas.\\n\\n- A conversão em tabelas não introduziu nenhuma ocorrência que não estivesse já\\n  identificada na Ronda 1, nem omitiu nenhuma das que aí ficaram registadas com\\n  citação e localização.\\n\\n- **Falas colectivas.** As rubricas «Todos», «Ambos» e «Os dois» não são\\n  personagens e não constam de `personagens.csv`. As ocorrências assim\\n  atribuídas foram imputadas à personagem que conduz o grupo naquele passo —\\n  Adão em L0159-L0160 e L0224-L0225, Noé em L0305 e L0307, Alceto em\\n  L0747-L0748 — e o facto está declarado na coluna `interpretacao` de cada uma.\\n  A decisão distorce ligeiramente as contagens por personagem no mapa de calor.\\n\\n- **Duas personagens sob a rubrica «Preto».** Desdobradas em «Preto (criado de\\n  Olofernes)» e «Preto (vendedor de cacau)», por serem papéis distintos em\\n  passos distintos. A rubrica «Anjo», pelo contrário, foi mantida como entrada\\n  única apesar de cobrir o anjo da expulsão e o anjo dos pastores, por a função\\n  ser análoga. Ambas as decisões são discutíveis e afectam o grafo de relações.\\n\\n- **Uniformização onomástica.** Nas tabelas usam-se as formas Judite, Olofernes\\n  e Anfriso; nas citações conservam-se as grafias do manuscrito (Judid, Jodid,\\n  Judis; Olefernes, Olafernes, Olofornes, Oslofernes; Amfriso). O validador\\n  assinalará a divergência entre as rubricas detectadas e o elenco — é o\\n  comportamento pretendido e o aviso deve ser lido como registo da variação, não\\n  como erro.\\n\\n- **Contagem de ocorrências do vernáculo.** Os valores de `n_ocorrencias`\\n  referem-se às ocorrências efectivamente localizadas e citadas, não a uma\\n  concordância exaustiva do termo em toda a peça. Formas de altíssima frequência\\n  como `perceito` e `molher` estão subcontadas por esse motivo.\\n\\n- **Entradas de leitura incerta.** Mantêm-se com grau `provável` as\\n  identificações que dependem de conhecimento externo ao texto: Zamperini\\n  (L0503-L0504), a etimologia africana de `malufo` (L0672), `bangalé` (L1088) e\\n  os sentidos de calão de `frete` (L1180) e `famelga` (L0825).\\n\\n- **Passagens excluídas.** Não foram convertidos em ocorrências os passos\\n  visivelmente corruptos onde a sintaxe não fecha — em especial o soneto de\\n  Luzbel (L0027-L0041) para além dos três lugares citados, e a fala truncada de\\n  Adão em L0103 («já que de mim se pordus»), que o transcritor deixou\\n  interrompida. As passagens com XX e XXX (L0415, L0841) não foram objecto de\\n  conjectura.\"}}\u003c/script>\n\u003cscript>\n(function(){\n\"use strict\";\n/* Os textos do interface do dashboard, nas duas línguas do sítio.\n\n   A regra é a mesma do portal: o que é interface traduz-se, o que é evidência\n   não. Nomes de personagens, citações, tipos de recurso e as interpretações\n   produzidas pela análise permanecem em português — traduzi-los afastaria o\n   leitor da fonte e falsearia o que está nos CSVs.\n\n   Este ficheiro vem antes de todos os outros e não depende de nenhum: define\n   apenas dados e funções declaradas, que ficam disponíveis a quem as chamar. */\n\nlet LINGUA_D = \"en\";\n\nconst DIC_D = {\n  \"titulo.sufixo\": {en:\"analysis\", pt:\"análise\"},\n  \"peca.semTitulo\": {en:\"Untitled play\", pt:\"Peça sem título\"},\n\n  \"botao.tema\":     {en:\"Theme\",  pt:\"Tema\"},\n  \"botao.temaDica\": {en:\"Switch light / dark theme\", pt:\"Alternar tema claro/escuro\"},\n  \"botao.imprimir\": {en:\"Print\",  pt:\"Imprimir\"},\n  \"botao.grafico\":  {en:\"Chart\",  pt:\"Gráfico\"},\n  \"botao.tabela\":   {en:\"Table\",  pt:\"Tabela\"},\n  \"botao.mapa\":     {en:\"Map\",    pt:\"Mapa\"},\n  \"botao.grafo\":    {en:\"Graph\",  pt:\"Grafo\"},\n  \"botao.svgDica\":  {en:\"Download as SVG\", pt:\"Descarregar SVG\"},\n  \"botao.limpar\":   {en:\"Clear\",  pt:\"Limpar\"},\n\n  \"filtro.rotulo\":     {en:\"Filter:\", pt:\"Filtrar:\"},\n  \"filtro.personagens\":{en:\"All characters\",  pt:\"Todas as personagens\"},\n  \"filtro.recursos\":   {en:\"All figures\",     pt:\"Todos os recursos\"},\n  \"filtro.relacoes\":   {en:\"All relations\",   pt:\"Todas as relações\"},\n  \"filtro.graus\":      {en:\"All degrees\",     pt:\"Todos os graus\"},\n  \"filtro.pesquisa\":   {en:\"Search quotation, term…\", pt:\"Pesquisar r personagem\"},\n  \"card.rede\":      {en:\"Network of relations between characters\", pt:\"Rede de relações entre personagens\"},\n  \"card.redeSub\":   {en:\"nodes sized by number of relations; hover an edge to read its type\",\n                     pt:\"nós dimensionados pelo número de relações; passa o cursor sobre uma aresta para ler o tipo\"},\n  \"card.redeAria\":  {en:\"Graph of the relations between characters\",\n                     pt:\"Grafo das relações entre personagens\"},\n  \"card.recursos\":  {en:\"Occurrences of rhetorical figures\", pt:\"Ocorrências de recursos expressivos\"},\n  \"card.recursosSub\":{en:\"the full table, with each quotation checked automatically against the transcription\",\n                     pt:\"tabela integral, com cotejo automático de cada citação com a transcrição\"},\n  \"card.pers\":      {en:\"Characters\", pt:\"Personagens\"},\n  \"card.persSub\":   {en:\"dramatic function and symbolic weight\", pt:\"função dramática e carga simbólica\"},\n  \"card.vernTab\":   {en:\"Vernacular\", pt:\"Vernáculo\"},\n  \"card.vernTabSub\":{en:\"period meaning and degree of certainty\", pt:\"significado de época e grau de certeza\"},\n  \"card.prosa\":     {en:\"The analysis in prose\", pt:\"Análise em prosa\"},\n  \"card.prosaSub\":  {en:\"the full text produced in the first round\", pt:\"texto integral produzido na primeira ronda\"},\n  \"card.limites\":   {en:\"Limits and validation\", pt:\"Limitações e validação\"},\n  \"card.limitesSub\":{en:\"gaps flagged by the analysis, and the automatic checks\",\n                     pt:\"lacunas assinaladas pela análise e verificações automáticas\"},\n\n  \"tile.recursos\":  {en:\"Occurrences of rhetorical figures\", pt:\"Ocorrências de recursos expressivos\"},\n  \"tile.densidade\": {en:\"{n} per 100 lines\", pt:\"{n} por 100 linhas\"},\n  \"tile.tipos\":     {en:\"Types of figure\",   pt:\"Tipos de recurso\"},\n  \"tile.personagens\":{en:\"Characters\",       pt:\"Personagens\"},\n  \"tile.relacoes\":  {en:\"Relations mapped\",  pt:\"Relações mapeadas\"},\n  \"tile.nTipos\":    {en:\"{n} types\",         pt:\"{n} tipos\"},\n  \"tile.vernaculo\": {en:\"Vernacular entries\",pt:\"Entradas de vernáculo\"},\n  \"tile.citacoes\":  {en:\"Quotations checked\",pt:\"Citações verificadas\"},\n  \"tile.semCotejo\": {en:\"check not run\",     pt:\"cotejo não executado\"},\n  \"tile.cotejoBom\": {en:\"quotations confirmed in the original\", pt:\"citações confirmadas no original\"},\n  \"tile.cotejoMeio\":{en:\"review the flagged quotations\",        pt:\"rever as citações assinaladas\"},\n  \"tile.cotejoMau\": {en:\"manual review required\",               pt:\"revisão manual necessária\"},\n\n  \"col.tipoRecurso\":{en:\"Type of figure\",  pt:\"Tipo de recurso\"},\n  \"col.ocorrencias\":{en:\"Occurrences\",     pt:\"Ocorrências\"},\n  \"col.expressao\":  {en:\"Expression\",      pt:\"Expressão\"},\n  \"col.personagem\": {en:\"Character\",       pt:\"Personagem\"},\n  \"col.origem\":     {en:\"From\",            pt:\"Origem\"},\n  \"col.destino\":    {en:\"To\",              pt:\"Destino\"},\n  \"col.tipo\":       {en:\"Type\",            pt:\"Tipo\"},\n  \"col.interpretacao\":{en:\"Interpretation\",pt:\"Interpretação\"},\n  \"col.id\":         {en:\"Id\",              pt:\"Id\"},\n  \"col.recurso\":    {en:\"Figure\",          pt:\"Recurso\"},\n  \"col.local\":      {en:\"Line\",            pt:\"Local\"},\n  \"col.citacao\":    {en:\"Quotation\",       pt:\"Citação\"},\n  \"col.cotejo\":     {en:\"Check\",           pt:\"Cotejo\"},\n  \"col.funcao\":     {en:\"Dramatic function\", pt:\"Função dramática\"},\n  \"col.simbologia\": {en:\"Symbolic weight\", pt:\"Carga simbólica\"},\n  \"col.significado\":{en:\"Period meaning\",  pt:\"Significado de época\"},\n  \"col.certeza\":    {en:\"Certainty\",       pt:\"Certeza\"},\n  \"col.n\":          {en:\"No.\",             pt:\"N.º\"},\n\n  \"cotejo.verificada\":     {en:\"confirmed\", pt:\"verificada\"},\n  \"cotejo.verificadaDica\": {en:\"quotation found in the transcription, at the stated line\",\n                            pt:\"citação localizada na transcrição, na posição indicada\"},\n  \"cotejo.deslocada\":      {en:\"displaced\", pt:\"deslocada\"},\n  \"cotejo.deslocadaDica\":  {en:\"quotation exists in the text, but not where it was said to be\",\n                            pt:\"citação existe no texto, mas fora da localização declarada\"},\n  \"cotejo.naoEncontrada\":  {en:\"not found\", pt:\"não encontrada\"},\n  \"cotejo.naoEncontradaDica\":{en:\"quotation not found in the transcription — review by hand\",\n                            pt:\"citação não encontrada na transcrição — rever manualmente\"},\n  \"cotejo.semLocal\":       {en:\"no line given\", pt:\"sem localização\"},\n  \"cotejo.semLocalDica\":   {en:\"no usable line marker\", pt:\"sem marcador de linha utilizável\"},\n\n  \"vazio.tabela\": {en:\"No records for the active filters.\", pt:\"Sem registos para os filtros activos.\"},\n  \"vazio.grafico\":{en:\"No data for the active filters.\",    pt:\"Sem dados para os filtros activos.\"},\n  \"rede.dica\":    {en:\"pick a type to highlight it in the graph\",\n                   pt:\"escolhe um tipo para o destacar no grafo\"},\n  \"vazio.rede\":   {en:\"Not enough relations for the active filters.\",\n                   pt:\"Sem relações suficientes para os filtros activos.\"},\n  \"vazio.prosa\":  {en:\"No prose recorded.\", pt:\"Sem prosa registada.\"},\n  \"vazio.limites\":{en:\"The analysis flagged no limits.\", pt:\"Nenhuma limitação assinalada pela análise.\"},\n\n  \"prosa.personagens\": {en:\"Characters, symbolism and relations\", pt:\"Personagens, simbologia e relações\"},\n  \"prosa.vernaculo\":   {en:\"Vernacular and rhetorical figures\",   pt:\"Vernáculo e recursos expressivos\"},\n  \"val.erros\":  {en:\"Validation errors\",     pt:\"Erros de validação\"},\n  \"val.avisos\": {en:\"Warnings\",              pt:\"Avisos\"},\n  \"val.notas\":  {en:\
