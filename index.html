"Normalisations applied\",pt:\"Normalizações aplicadas\"},\n\n  \"meta.proveniencia\":{en:\"Provenance\",   pt:\"Proveniência\"},\n  \"meta.transcricao\": {en:\"Transcription\",pt:\"Transcrição\"},\n  \"meta.linhas\":      {en:\"Lines\",        pt:\"Linhas\"},\n  \"meta.modelo\":      {en:\"Model\",        pt:\"Modelo\"},\n  \"meta.analise\":     {en:\"Analysed\",     pt:\"Análise\"},\n\n  \"tip.ocorrencia\":  {en:\"occurrence\",  pt:\"ocorrência\"},\n  \"tip.ocorrencias\": {en:\"occurrences\", pt:\"ocorrências\"},\n  \"tip.relacao\":     {en:\"relation\",    pt:\"relação\"},\n  \"tip.relacoes\":    {en:\"relations\",   pt:\"relações\"},\n\n  \"rodape\": {en:\"Built by \u003cb>presepios\u003c/b> from {f}. Tables and charts derive exclusively from the validated CSVs; quotations were checked automatically against the transcription. Every interpretative reading requires confirmation by a specialist.\",\n             pt:\"Gerado por \u003cb>presepios\u003c/b> a partir de {f}. As tabelas e os gráficos derivam exclusivamente dos CSVs validados; as citações foram cotejadas automaticamente com a transcrição. Toda a leitura interpretativa carece de confirmação por especialista.\"}\n};\n\n/* td(\"chave\", {n: 3}) → o texto na língua corrente, com as marcas substituídas */\nfunction td(chave, subs){\n  const entrada = DIC_D[chave];\n  let s = entrada ? (entrada[LINGUA_D] || entrada.en || \"\") : chave;\n  if (subs) for (const k in subs) s = s.split(\"{\" + k + \"}\").join(subs[k]);\n  return s;\n}\n\n/* Aplica a língua ao que está marcado no HTML. O que é desenhado por\n   JavaScript volta a ser desenhado a seguir, por `render()`. */\nfunction aplicarIdiomaDashboard(){\n  document.documentElement.lang = LINGUA_D === \"pt\" ? \"pt-PT\" : \"en\";\n  const cada = (attr, aplicar) =>\n    Array.from(document.querySelectorAll(\"[\" + attr + \"]\"))\n         .forEach(e => aplicar(e, td(e.getAttribute(attr))));\n  cada(\"data-t\",       (e, v) => { e.textContent = v; });\n  cada(\"data-t-title\", (e, v) => { e.title = v; });\n  cada(\"data-t-aria\",  (e, v) => { e.setAttribute(\"aria-label\", v); });\n  cada(\"data-t-ph\",    (e, v) => { e.placeholder = v; });\n  Array.from(document.querySelectorAll(\".lingua button\")).forEach(b =>\n    b.setAttribute(\"aria-pressed\", String(b.dataset.lingua === LINGUA_D)));\n}\n\n/* A análise pode estar enquadrada no sítio; nesse caso é o sítio que manda a\n   língua, para as duas páginas nunca discordarem. Fora dele, o botão do\n   cabeçalho decide. */\nfunction ouvirLinguaDoSitio(){\n  if (window.parent !== window){\n    // enquadrada: o selector do sítio é o único, para não haver dois a\n    // discordar sobre a língua da mesma página\n    const grupo = document.querySelector(\".lingua\");\n    if (grupo) grupo.hidden = true;\n  }\n  window.addEventListener(\"message\", ev => {\n    const m = ev.data;\n    if (!m || m.tipo !== \"lingua\" || (m.lingua !== \"en\" && m.lingua !== \"pt\")) return;\n    if (m.lingua === LINGUA_D) return;\n    LINGUA_D = m.lingua;\n    aplicarIdiomaDashboard();\n    cabecalho(); tiles(); prosa(); render();\n  });\n}\n\n/* Arranque dos dados e utilitários partilhados. */\n\nconst D = JSON.parse(document.getElementById(\"dados\").textContent);\nconst $ = s => document.querySelector(s);\nconst $$ = s => Array.from(document.querySelectorAll(s));\nconst esc = s => String(s==null?\"\":s).replace(/[&\u003c>\"']/g, c =>\n  ({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst NS = \"http://www.w3.org/2000/svg\";\nconst el = (n, a) => { const e = document.createElementNS(NS, n);\n  for (const k in (a||{})) e.setAttribute(k, a[k]); return e; };\nconst cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n\n/* Valores vindos do catálogo podem ser texto simples ou {en, pt}. */\nconst dtxt = v => v == null ? \"\"\n  : (typeof v === \"object\" ? (v[LINGUA_D] || v.en || v.pt || \"\") : String(v));\n\n/* ------------------------------------------------------------------ estado */\nconst F = {personagem:\"\", tipo:\"\", relacao:\"\", certeza:\"\", texto:\"\"};\nlet selNo = null;\n\n/* Estado dos filtros e selecção dos registos visíveis. */\n\n/* --------------------------------------------------------------- filtragem */\nfunction passaTexto(campos){\n  if (!F.texto) return true;\n  const q = F.texto.toLowerCase();\n  return campos.some(c => String(c||\"\").toLowerCase().includes(q));\n}\nfunction recursosFiltrados(){\n  return D.recursos.filter(r =>\n    (!F.personagem || r.personagem === F.personagem) &&\n    (!F.tipo || r.tipo_recurso === F.tipo) &&\n    passaTexto([r.citacao, r.interpretacao, r.personagem, r.tipo_recurso, r.localizacao]));\n}\nfunction relacoesFiltradas(){\n  return D.relacoes.filter(r =>\n    (!F.relacao || r.tipo_relacao === F.relacao) &&\n    (!F.personagem || r.origem === F.personagem || r.destino === F.personagem) &&\n    passaTexto([r.origem, r.destino, r.tipo_relacao, r.descricao]));\n}\nfunction vernaculoFiltrado(){\n  return D.vernaculo.filter(v =>\n    (!F.certeza || v.grau_certeza === F.certeza) &&\n    passaTexto([v.expressao, v.significado_epoca, v.localizacao]));\n}\nfunction personagensFiltradas(){\n  return D.personagens.filter(p =>\n    (!F.personagem || p.personagem === F.personagem) &&\n    passaTexto([p.personagem, p.funcao_dramatica, p.simbologia]));\n}\n\n/* Camada de passagem do cursor, comum a todos os gráficos. */\n\n/* ---------------------------------------------------------------- tooltip */\nconst tip = $(\"#tip\");\nfunction mostrarTip(ev, html){\n  tip.innerHTML = html; tip.style.opacity = 1;\n  const r = tip.getBoundingClientRect();\n  let x = ev.clientX + 14, y = ev.clientY + 14;\n  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;\n  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;\n  tip.style.left = x + \"px\"; tip.style.top = y + \"px\";\n}\nfunction esconderTip(){ tip.style.opacity = 0; }\nfunction ligarTip(node, html){\n  node.addEventListener(\"mousemove\", e => mostrarTip(e, html));\n  node.addEventListener(\"mouseleave\", esconderTip);\n  node.addEventListener(\"focus\", e => {\n    const b = node.getBoundingClientRect();\n    mostrarTip({clientX:b.left+b.width/2, clientY:b.top+b.height/2}, html);\n  });\n  node.addEventListener(\"blur\", esconderTip);\n}\n\n/* Gráfico de barras horizontais e escala de eixo. */\n\n/* ------------------------------------------------------- barras horizontais\n   Marca: ≤24px de espessura, extremidade arredondada a 4px do lado do valor,\n   assente numa única linha de base; rótulo do valor na ponta.              */\nfunction barras(svgSel, dados, opts){\n  opts = opts || {};\n  const svg = $(svgSel);\n  svg.textContent = \"\";\n  if (!dados.length){\n    svg.setAttribute(\"viewBox\", \"0 0 600 60\");\n    const t = el(\"text\", {x:12, y:34, class:\"lbl-mark\"});\n    t.textContent = td(\"vazio.grafico\");\n    svg.appendChild(t); return;\n  }\n  const W = 600, ML = opts.margemEsq || 150, MR = 54, MT = 8, MB = 26;\n  const passo = 30, esp = Math.min(24, passo - 10);\n  const H = MT + dados.length * passo + MB;\n  svg.setAttribute(\"viewBox\", `0 0 ${W} ${H}`);\n  svg.style.maxHeight = (H * 1.25) + \"px\";\n  const max = Math.max.apply(null, dados.map(d => d.valor)) || 1;\n  const x = v => ML + (v / max) * (W - ML - MR);\n\n  // grelha: hairline sólida, recessiva\n  const ticks = escalaBonita(max, 4);\n  ticks.forEach(t => {\n    svg.appendChild(el(\"line\", {x1:x(t), x2:x(t), y1:MT, y2:MT + dados.length*passo, class:\"gridline\"}));\n    const tx = el(\"text\", {x:x(t), y:H - 8, class:\"tick\", \"text-anchor\":\"middle\"});\n    tx.textContent = t; svg.appendChild(tx);\n  });\n  svg.appendChild(el(\"line\", {x1:ML, x2:ML, y1:MT, y2:MT + dados.length*passo, class:\"axisline\"}));\n\n  dados.forEach((d, i) => {\n    const y = MT + i*passo + (passo - esp)/2;\n    const larg = Math.max(2, x(d.valor) - ML);\n    const g = el(\"g\", {tabindex:\"0\", role:\"listitem\"});\n    // extremidade do valor arredondada (4px), base quadrada\n    const r = Math.min(4, larg);\n    g.appendChild(el(\"path\", {\n      d:`M${ML},${y} H${ML+larg-r} a${r},${r} 0 0 1 ${r},${r} V${y+esp-r} a${r},${r} 0 0 1 ${-r},${r} H${ML} Z`,\n      fill: opts.cor || cssv(\"--series-1\")\n    }));\n    const lab = el(\"text\", {x:ML-10, y:y+esp/2+4, class:\"lbl-mark\", \"text-anchor\":\"end\"});\n    lab.textContent = truncar(d.rotulo, opts.maxRotulo || 22);\n    g.appendChild(lab);\n    const val = el(\"text\", {x:ML+larg+8, y:y+esp/2+4, class:\"val-mark\"});\n    val.textContent = d.valor; g.appendChild(val);\n    ligarTip(g, `\u003cb>${esc(d.rotulo)}\u003c/b>${d.valor} ${td(d.valor===1?\"tip.ocorrencia\":\"tip.ocorrencias\")}` +\n      (d.extra ? `\u003cdiv class=\"q\">${esc(d.extra)}\u003c/div>` : \"\"));\n    if (opts.aoClicar) { g.style.cursor = \"pointer\"; g.addEventListener(\"click\", () => opts.aoClicar(d)); }\n    svg.appendChild(g);\n  });\n}\nfunction escalaBonita(max, n){\n  // contagens são inteiras: nunca produzir marcas fraccionárias (0,5 / 1,5 …)\n  const bruto = Math.max(1, max / n), mag = Math.pow(10, Math.floor(Math.log10(bruto)));\n  let passo = [1,2,2.5,5,10].map(m => m*mag).find(p => p >= bruto) || mag*10;\n  passo = Math.max(1, Math.round(passo));\n  const out = []; for (let v = 0; v \u003c= max + 1e-9; v += passo) out.push(v);\n  return out;\n}\nfunction truncar(s, n){ s = String(s||\"\"); return s.length > n ? s.slice(0, n-1) + \"…\" : s; }\n\n/* Mapa de calor personagem x tipo de recurso. */\n\n/* ------------------------------------------------------------------ heatmap\n   Escala sequencial de um só matiz, clara→escura (invertida em tema escuro);\n   2px de folga da cor da superfície entre células.                          */\nconst RAMPA = () => [0,1,2,3,4,5,6].map(i => cssv(\"--seq-\"+i));\nfunction luminancia(hex){\n  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());\n  if (!m) return 1;\n  const n = parseInt(m[1], 16);\n  const c = [(n>>16)&255, (n>>8)&255, n&255].map(v => {\n    v /= 255; return v \u003c= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);\n  });\n  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];\n}\nfunction heatmap(){\n  const svg = $(\"#svg-heat\"); svg.textContent = \"\";\n  const recs = recursosFiltrados();\n  const pers = [...new Set(recs.map(r => r.personagem).filter(Boolean))]\n    .sort((a,b) => recs.filter(r=>r.personagem===b).length - recs.filter(r=>r.personagem===a).length)\n    .slice(0, 22);\n  const tipos = [...new Set(recs.map(r => r.tipo_recurso).filter(Boolean))]\n    .sort((a,b) => recs.filter(r=>r.tipo_recurso===b).length - recs.filter(r=>r.tipo_recurso===a).length)\n    .slice(0, 18);\n  $(\"#escala-heat\").innerHTML = \"\";\n  if (!pers.length || !tipos.length){\n    svg.setAttribute(\"viewBox\",\"0 0 600 60\");\n    const t = el(\"text\",{x:12,y:34,class:\"lbl-mark\"});\n    t.textContent = td(\"vazio.grafico\"); svg.appendChild(t); return;\n  }\n  const ML = 150, MT = 78, cel = Math.max(26, Math.min(46, Math.floor(700/tipos.length)));\n  const W = ML + tipos.length*cel + 16, H = MT + pers.length*cel + 10;\n  svg.setAttribute(\"viewBox\", `0 0 ${W} ${H}`);\n  svg.style.maxHeight = (H*1.15) + \"px\";\n  const conta = (p,t) => recs.filter(r => r.personagem===p && r.tipo_recurso===t).length;\n  let max = 0; pers.forEach(p => tipos.forEach(t => { max = Math.max(max, conta(p,t)); }));\n  const rampa = RAMPA();\n  const cor = v => v === 0 ? \"transparent\" : rampa[Math.min(rampa.length-1,\n      Math.floor((v-1)/Math.max(1,max) * (rampa.length-1) + 0.5))];\n\n  tipos.forEach((t,j) => {\n    const x = ML + j*cel + cel/2;\n    const tx = el(\"text\", {x:x, y:MT-10, class:\"tick\", \"text-anchor\":\"start\",\n                           transform:`rotate(-42 ${x} ${MT-10})`});\n    tx.textContent = truncar(t, 16); svg.appendChild(tx);\n  });\n  pers.forEach((p,i) => {\n    const y = MT + i*cel;\n    const lab = el(\"text\", {x:ML-10, y:y+cel/2+4, class:\"lbl-mark\", \"text-anchor\":\"end\"});\n    lab.textContent = truncar(p, 20); svg.appendChild(lab);\n    tipos.forEach((t,j) => {\n      const v = conta(p,t), x = ML + j*cel;\n      const g = el(\"g\", {tabindex: v ? \"0\" : \"-1\"});\n      g.appendChild(el(\"rect\", {x:x+1, y:y+1, width:cel-2, height:cel-2, rx:3,\n        fill: cor(v), stroke: v ? \"none\" : cssv(\"--grid\"), \"stroke-width\":1}));\n      if (v && cel >= 28){\n        // cor do rótulo escolhida pela luminância do próprio preenchimento\n        const t2 = el(\"text\", {x:x+cel/2, y:y+cel/2+4, \"text-anchor\":\"middle\",\n          \"font-size\":\"11.5\", \"font-weight\":\"600\",\n          fill: luminancia(cor(v)) \u003c 0.5 ? \"#ffffff\" : \"#0b0b0b\"});\n        t2.textContent = v; g.appendChild(t2);\n      }\n      if (v) ligarTip(g, `\u003cb>${esc(p)} · ${esc(t)}\u003c/b>${v} ${td(v===1?\"tip.ocorrencia\":\"tip.ocorrencias\")}`);\n      svg.appendChild(g);\n    });\n  });\n  // legenda de escala\n  const passos = rampa.map(c => `\u003ci style=\"background:${c}\">\u003c/i>`).join(\"\");\n  $(\"#escala-heat\").innerHTML =\n    `\u003cspan>menos\u003c/span>\u003cspan class=\"steps\">${passos}\u003c/span>\u003cspan>mais (máx. ${max})\u003c/span>`;\n}\n\n/* Grafo de relações: componentes, disposição e desenho. */\n\n/* --------------------------------------------------------------------- rede\n   Layout determinístico (semente fixa): a mesma peça produz sempre o mesmo\n   grafo, condição para o usar como figura reproduzível.                     */\nfunction prng(semente){ let s = semente >>> 0;\n  return () => { s = (s*1664525 + 1013904223) >>> 0; return s / 4294967296; }; }\n\nfunction rede(){\n  const svg = $(\"#svg-rede\"); svg.textContent = \"\";\n  const arestas = relacoesFiltradas().filter(r => r.origem && r.destino && r.origem !== r.destino);\n  const nomes = [...new Set(arestas.flatMap(r => [r.origem, r.destino]))];\n  $(\"#leg-rede\").innerHTML = \"\";\n  if (nomes.length \u003c 2){\n    svg.setAttribute(\"viewBox\",\"0 0 600 60\");\n    const t = el(\"text\",{x:12,y:34,class:\"lbl-mark\"});\n    t.textContent = td(\"vazio.rede\"); svg.appendChild(t); return;\n  }\n  const W = 820;\n  let H = 400;                       // altura definida pela disposição, adiante\n  const grau = {}; nomes.forEach(n => grau[n] = 0);\n  arestas.forEach(a => { grau[a.origem]++; grau[a.destino]++; });\n  const rnd = prng(20260818);\n  const nos = nomes.map(n => ({id:n, x:0, y:0, grau:grau[n]}));\n  const idx = {}; nos.forEach((n,i) => idx[n.id] = i);\n\n  const PADX = 96, PADY = 46, ITS = 420;\n  const peso = {};   // arestas paralelas contam uma vez para a força\n  arestas.forEach(e => { const c = e.origem \u003c e.destino ? e.origem+\"|\"+e.destino : e.destino+\"|\"+e.origem;\n    peso[c] = (peso[c]||0)+1; });\n\n  // Uma peça por passos produz um grafo com vários componentes desligados —\n  // as personagens do Passo da Freira não têm relação com as do de Noé. Uma\n  // simulação global empurra-os para as margens e degenera; por isso cada\n  // componente é disposto por si e os componentes são depois arrumados lado a\n  // lado. O agrupamento visual passa a corresponder à estrutura da peça.\n  const adj = {}; nomes.forEach(n => adj[n] = []);\n  arestas.forEach(a => { adj[a.origem].push(a.destino); adj[a.destino].push(a.origem); });\n  const compDe = {}, comps = [];\n  nomes.forEach(n => {\n    if (compDe[n] !== undefined) return;\n    const id = comps.length, fila = [n], membros = [];\n    compDe[n] = id;\n    while (fila.length){\n      const u = fila.pop(); membros.push(u);\n      adj[u].forEach(v => { if (compDe[v] === undefined){ compDe[v] = id; fila.push(v); } });\n    }\n    comps.push(membros);\n  });\n  comps.sort((a,b) => b.length - a.length);\n\n  // Fruchterman–Reingold por componente, com comprimento de aresta ideal = 1\n  const caixas = comps.map(membros => {\n    const sub = membros.map(id => nos[idx[id]]);\n    const raio = Math.sqrt(sub.length) * 0.6;\n    sub.forEach((n,i) => {\n      const ang = (i/sub.length)*Math.PI*2 + rnd()*0.2;\n      n.x = Math.cos(ang)*raio; n.y = Math.sin(ang)*raio;\n    });\n    const dentro = new Set(membros);\n    const pares = Object.keys(peso).map(c => c.split(\"|\"))\n                        .filter(([o,d]) => dentro.has(o) && dentro.has(d));\n    if (sub.length > 1){\n      let t = Math.sqrt(sub.length) * 0.35;\n      for (let it = 0; it \u003c ITS; it++){\n        sub.forEach(a => { a.dx = 0; a.dy = 0; });\n        for (let i=0;i\u003csub.length;i++) for (let j=i+1;j\u003csub.length;j++){\n          const a=sub[i], b=sub[j];\n          let dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy)||0.01;\n          const f = 1/(d*d);                      // repulsão k²/d, com k=1\n          dx*=f; dy*=f; a.dx+=dx; a.dy+=dy; b.dx-=dx; b.dy-=dy;\n        }\n        pares.forEach(([o,de]) => {\n          const a=nos[idx[o]], b=nos[idx[de]];\n          let dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy)||0.01;\n          dx=dx/d*d*d; dy=dy/d*d*d;               // atracção d²/k\n          a.dx-=dx; a.dy-=dy; b.dx+=dx; b.dy+=dy;\n        });\n        sub.forEach(n => {\n          const m = Math.hypot(n.dx, n.dy) || 1;\n          n.x += n.dx/m * Math.min(m, t);\n          n.y += n.dy/m * Math.min(m, t);\n        });\n        t *= 0.992;\n      }\n    }\n    const xs = sub.map(n=>n.x), ys = sub.map(n=>n.y);\n    const x0 = Math.min(...xs), y0 = Math.min(...ys);\n    sub.forEach(n => { n.x -= x0; n.y -= y0; });   // origem na própria caixa\n    return {membros,\n            larg: Math.max(...xs) - x0 + 1.4,\n            alt:  Math.max(...ys) - y0 + 1.4};\n  });\n\n  // arrumação em prateleiras, do maior componente para o menor\n  const alvo = Math.sqrt(caixas.reduce((s,c) => s + c.larg*c.alt, 0)) * 1.7;\n  let cx = 0, cy = 0, alturaLinha = 0;\n  caixas.forEach(c => {\n    if (cx > 0 && cx + c.larg > alvo){ cx = 0; cy += alturaLinha + 1.0; alturaLinha = 0; }\n    c.membros.forEach(id => { const n = nos[idx[id]]; n.x += cx; n.y += cy; });\n    cx += c.larg + 1.0;\n    alturaLinha = Math.max(alturaLinha, c.alt);\n  });\n\n  // A altura do cartão sai da disposição, e não do número de nós: assim o\n  // grafo ocupa o espaço que tem e não sobra faixa vazia por baixo.\n  (function ajustar(){\n    const xs = nos.map(n => n.x), ys = nos.map(n => n.y);\n    const x0 = Math.min(...xs), x1 = Math.max(...xs);\n    const y0 = Math.min(...ys), y1 = Math.max(...ys);\n    const largura = Math.max(0.5, x1-x0), altura = Math.max(0.5, y1-y0);\n    const e = (W - 2*PADX) / largura;\n    H = Math.max(300, Math.min(820, Math.round(altura*e) + 2*PADY));\n    svg.setAttribute(\"viewBox\", `0 0 ${W} ${H}`);\n    svg.style.maxHeight = (H*1.05) + \"px\";\n    const ef = Math.min(e, (H - 2*PADY)/altura);\n    nos.forEach(n => {\n      n.x = W/2 + (n.x - (x0+x1)/2) * ef;\n      n.y = H/2 + (n.y - (y0+y1)/2) * ef;\n    });\n  })();\n\n  const gArestas = el(\"g\", {}), gNos = el(\"g\", {});\n  const destacado = a => F.relacao && a.tipo_relacao === F.relacao;\n  arestas.forEach(a => {\n    const s = nos[idx[a.origem]], d = nos[idx[a.destino]];\n    if (!s || !d) return;\n    const linha = el(\"line\", {x1:s.x, y1:s.y, x2:d.x, y2:d.y,\n      stroke: destacado(a) ? cssv(\"--series-1\") : cssv(\"--axis\"),\n      \"stroke-width\": destacado(a) ? 2 : 1.25, \"stroke-linecap\":\"round\"});\n    const alvo = el(\"line\", {x1:s.x, y1:s.y, x2:d.x, y2:d.y,\n      stroke:\"transparent\", \"stroke-width\":14, tabindex:\"0\"});\n    ligarTip(alvo, `\u003cb>${esc(a.origem)} → ${esc(a.destino)}\u003c/b>` +\n      `\u003cdiv>${esc(a.tipo_relacao)}\u003c/div>` +\n      (a.descricao ? `\u003cdiv class=\"q\">${esc(a.descricao)}\u003c/div>` : \"\"));\n    gArestas.appendChild(linha); gArestas.appendChild(alvo);\n  });\n  const rmax = Math.max.apply(null, nos.map(n => n.grau)) || 1;\n  // Coloca cada rótulo acima ou abaixo do nó, o que colidir menos com os já\n  // colocados; as personagens com mais relações escolhem primeiro.\n  const posRotulo = {}, colocados = [];\n  [...nos].sort((a,b) => b.grau - a.grau).forEach(n => {\n    const r = 6 + 10*Math.sqrt(n.grau/rmax);\n    const meia = (truncar(n.id,16).length * 6.0 + 4) / 2;\n    let melhor = n.y - r - 6, menor = Infinity;\n    [n.y - r - 6, n.y + r + 14].forEach(y => {\n      const c = {x0:n.x-meia, x1:n.x+meia, y0:y-10, y1:y+3};\n      let area = 0;\n      colocados.forEach(p => {\n        const ox = Math.min(c.x1,p.x1) - Math.max(c.x0,p.x0);\n        const oy = Math.min(c.y1,p.y1) - Math.max(c.y0,p.y0);\n        if (ox > 0 && oy > 0) area += ox*oy;\n      });\n      if (area \u003c menor){ menor = area; melhor = y; }\n    });\n    colocados.push({x0:n.x-meia, x1:n.x+meia, y0:melhor-10, y1:melhor+3});\n    posRotulo[n.id] = melhor;\n  });\n  nos.forEach(n => {\n    const r = 6 + 10 * Math.sqrt(n.grau / rmax);\n    const sel = selNo === n.id || F.personagem === n.id;\n    const g = el(\"g\", {tabindex:\"0\", role:\"listitem\"});\n    g.appendChild(el(\"circle\", {cx:n.x, cy:n.y, r:r,\n      fill: sel ? cssv(\"--series-2\") : cssv(\"--series-1\"),\n      stroke: cssv(\"--surface-1\"), \"stroke-width\":2}));\n    // o mesmo princípio do anel de superfície, aplicado ao rótulo: um contorno\n    // da cor do fundo mantém o nome legível quando cruza arestas ou vizinhos\n    const t = el(\"text\", {x:n.x, y:posRotulo[n.id], \"text-anchor\":\"middle\", class:\"lbl-mark\",\n      \"paint-order\":\"stroke\", stroke:cssv(\"--surface-1\"), \"stroke-width\":\"3.5\",\n      \"stroke-linejoin\":\"round\"});\n    t.textContent = truncar(n.id, 16); g.appendChild(t);\n    ligarTip(g, `\u003cb>${esc(n.id)}\u003c/b>${n.grau} ${td(n.grau===1?\"tip.relacao\":\"tip.relacoes\")}` +\n      `\u003cdiv class=\"q\">clique para filtrar por esta personagem\u003c/div>`);\n    g.style.cursor = \"pointer\";\n    g.addEventListener(\"click\", () => {\n      $(\"#f-personagem\").value = (F.personagem === n.id) ? \"\" : n.id;\n      lerFiltros(); render();\n    });\n    gNos.appendChild(g);\n  });\n  svg.appendChild(gArestas); svg.appendChild(gNos);\n\n  // O tipo de relação não é codificado por cor (todas as arestas são hairlines\n  // neutras): estes são botões de filtro que destacam o tipo escolhido.\n  const tipos = {};\n  arestas.forEach(a => tipos[a.tipo_relacao] = (tipos[a.tipo_relacao]||0)+1);\n  const leg = $(\"#leg-rede\");\n  leg.innerHTML = \"\";\n  Object.entries(tipos).sort((a,b) => b[1]-a[1]).forEach(([t,n]) => {\n    const b = document.createElement(\"button\");\n    b.className = \"chip\"; b.type = \"button\";\n    b.setAttribute(\"aria-pressed\", String(F.relacao === t));\n    b.textContent = `${t} · ${n}`;\n    b.addEventListener(\"click\", () => {\n      $(\"#f-relacao\").value = (F.relacao === t) ? \"\" : t; lerFiltros(); render();\n    });\n    leg.appendChild(b);\n  });\n  const nota = document.createElement(\"span\");\n  nota.className = \"key muted\";\n  nota.textContent = td(\"rede.dica\");\n  leg.appendChild(nota);\n}\n\n/* Tabelas ordenáveis e marca de cotejo das citações. */\n\n/* ------------------------------------------------------------------ tabelas */\nfunction tabela(alvo, colunas, linhas, opts){\n  opts = opts || {};\n  const cab = colunas.map(c => `\u003cth data-k=\"${c.k}\">${esc(c.t)}\u003c/th>`).join(\"\");\n  const corpo = linhas.map(l => \"\u003ctr>\" + colunas.map(c => {\n    const v = c.render ? c.render(l) : esc(l[c.k]);\n    return `\u003ctd class=\"${c.cls||\"\"}\">${v}\u003c/td>`;\n  }).join(\"\") + \"\u003c/tr>\").join(\"\");\n  $(alvo).innerHTML = linhas.length\n    ? `\u003cdiv class=\"tbl-wrap\">\u003ctable>\u003cthead>\u003ctr>${cab}\u003c/tr>\u003c/thead>\u003ctbody>${corpo}\u003c/tbody>\u003c/table>\u003c/div>`\n    : `\u003cp class=\"muted\" style=\"font-size:13px\">${esc(td(\"vazio.tabela\"))}\u003c/p>`;\n  // ordenação por clique no cabeçalho\n  $$(alvo + \" th\").forEach(th => th.addEventListener(\"click\", () => {\n    const k = th.dataset.k;\n    opts.estado = opts.estado || {};\n    const asc = opts.estado.k === k ? !opts.estado.asc : true;\n    opts.estado = {k, asc};\n    linhas.sort((a,b) => {\n      const va = a[k], vb = b[k];\n      const na = parseFloat(va), nb = parseFloat(vb);\n      // ordena sempre com as regras do português: os valores são portugueses,\n      // seja qual for a língua em que o interface está a ser lido\n      const cmp = (!isNaN(na) && !isNaN(nb)) ? na-nb : String(va||\"\").localeCompare(String(vb||\"\"), \"pt\");\n      return asc ? cmp : -cmp;\n    });\n    tabela(alvo, colunas, linhas, opts);\n  }));\n}\n\n/* O resultado do cotejo é escrito nos CSVs em português — é a chave, e não\n   muda. O que se traduz é a etiqueta que o leitor vê, e nunca só a cor: cada\n   estado leva sempre símbolo e palavra. */\nconst SIMBOLO_VERIF = {\n  \"verificada\":      [\"●\", \"--good\",       \"cotejo.verificada\"],\n  \"deslocada\":       [\"◐\", \"--warning\",    \"cotejo.deslocada\"],\n  \"não encontrada\":  [\"✕\", \"--critical\",   \"cotejo.naoEncontrada\"],\n  \"sem localização\": [\"○\", \"--text-muted\", \"cotejo.semLocal\"]\n};\nfunction marcaVerificacao(v){\n  const s = SIMBOLO_VERIF[v]; if (!s) return \"\";\n  return `\u003cspan class=\"badge\" title=\"${esc(td(s[2] + \"Dica\"))}\">` +\n         `\u003cspan style=\"color:${cssv(s[1])}\">${s[0]}\u003c/span>${esc(td(s[2]))}\u003c/span>`;\n}\n\n/* Redesenho de tudo o que depende dos filtros. */\n\n/* -------------------------------------------------------------------- render */\nfunction render(){\n  const recs = recursosFiltrados();\n  const vern = vernaculoFiltrado();\n  const rels = relacoesFiltradas();\n\n  // contador do filtro\n  $(\"#contador\").textContent =\n    td(\"filtro.contador\", {r: recs.length, l: rels.length, v: vern.length});\n\n  // barras de frequência\n  const freq = {};\n  recs.forEach(r => { if (r.tipo_recurso) freq[r.tipo_recurso] = (freq[r.tipo_recurso]||0)+1; });\n  const dadosFreq = Object.entries(freq).sort((a,b) => b[1]-a[1])\n    .map(([t,n]) => ({rotulo:t, valor:n}));\n  barras(\"#svg-freq\", dadosFreq, {aoClicar: d => {\n    $(\"#f-tipo\").value = (F.tipo === d.rotulo) ? \"\" : d.rotulo; lerFiltros(); render();\n  }});\n  tabela(\"#tbl-freq\", [{k:\"tipo_recurso\",t:td(\"col.tipoRecurso\")},\n                       {k:\"n_ocorrencias\",t:td(\"col.ocorrencias\"),cls:\"num\"}],\n    dadosFreq.map(d => ({tipo_recurso:d.rotulo, n_ocorrencias:d.valor})));\n\n  // barras de vernáculo\n  const dadosVern = vern.map(v => ({rotulo:v.expressao, valor:+v.n_ocorrencias||1, extra:v.significado_epoca}))\n    .sort((a,b) => b.valor-a.valor).slice(0,15);\n  barras(\"#svg-vern\", dadosVern, {margemEsq:180, maxRotulo:26});\n  tabela(\"#tbl-vern\", [{k:\"expressao\",t:td(\"col.expressao\")},\n                       {k:\"n_ocorrencias\",t:td(\"col.ocorrencias\"),cls:\"num\"}],\n    dadosVern.map(d => ({expressao:d.rotulo, n_ocorrencias:d.valor})));\n\n  heatmap();\n  // tabela-gémea do mapa de calor\n  const parPers = {};\n  recs.forEach(r => { const k = (r.personagem||\"—\") + \"\\u0001\" + (r.tipo_recurso||\"—\");\n    parPers[k] = (parPers[k]||0)+1; });\n  tabela(\"#tbl-heat\",\n    [{k:\"personagem\",t:td(\"col.personagem\")}, {k:\"tipo_recurso\",t:td(\"col.tipoRecurso\")},\n     {k:\"n\",t:td(\"col.ocorrencias\"),cls:\"num\"}],\n    Object.entries(parPers).map(([k,n]) => {\n      const [p,t] = k.split(\"\\u0001\"); return {personagem:p, tipo_recurso:t, n:n};\n    }).sort((a,b) => b.n-a.n));\n\n  rede();\n  tabela(\"#tbl-rede\",\n    [{k:\"origem\",t:td(\"col.origem\")}, {k:\"destino\",t:td(\"col.destino\")},\n     {k:\"tipo_relacao\",t:td(\"col.tipo\")}, {k:\"descricao\",t:td(\"col.interpretacao\")}],\n    rels.slice());\n\n  tabela(\"#tbl-recursos\", [\n    {k:\"id\", t:td(\"col.id\")},\n    {k:\"tipo_recurso\", t:td(\"col.recurso\")},\n    {k:\"personagem\", t:td(\"col.personagem\")},\n    {k:\"localizacao\", t:td(\"col.local\"), cls:\"loc\"},\n    {k:\"citacao\", t:td(\"col.citacao\"), render: r => `\u003cspan class=\"cit\">${esc(r.citacao)}\u003c/span>`},\n    {k:\"interpretacao\", t:td(\"col.interpretacao\")},\n    {k:\"verificacao\", t:td(\"col.cotejo\"), render: r => marcaVerificacao(r.verificacao)}\n  ], recs.slice());\n\n  tabela(\"#tbl-pers\", [\n    {k:\"personagem\", t:td(\"col.personagem\")},\n    {k:\"funcao_dramatica\", t:td(\"col.funcao\")},\n    {k:\"simbologia\", t:td(\"col.simbologia\")}\n  ], personagensFiltradas().slice());\n\n  tabela(\"#tbl-vernaculo\", [\n    {k:\"expressao\", t:td(\"col.expressao\")},\n    {k:\"significado_epoca\", t:td(\"col.significado\")},\n    {k:\"grau_certeza\", t:td(\"col.certeza\")},\n    {k:\"localizacao\", t:td(\"col.local\"), cls:\"loc\"},\n    {k:\"n_ocorrencias\", t:td(\"col.n\"), cls:\"num\"}\n  ], vern.slice());\n}\n\n/* Cartões de topo, prosa da análise e relatório de validação. */\n\n/* -------------------------------------------------------------------- topo */\nfunction tiles(){\n  const m = D.metricas || {}, v = D.validacao && D.validacao.metricas || {};\n  const pct = v.citacoes_verificadas_pct;\n  let estado = [\"--text-muted\", \"○\", \"tile.semCotejo\"];\n  if (typeof pct === \"number\")\n    estado = pct >= 95 ? [\"--good\",\"●\",\"tile.cotejoBom\"]\n           : pct >= 80 ? [\"--warning\",\"◐\",\"tile.cotejoMeio\"]\n                       : [\"--critical\",\"✕\",\"tile.cotejoMau\"];\n  const densidade = m.densidade_recursos_por_100_linhas;\n  const cards = [\n    {cls:\"hero\", lbl:td(\"tile.recursos\"), val:m.n_recursos||0,\n     note:(densidade!=null ? td(\"tile.densidade\", {n:densidade}) : \"\")},\n    {lbl:td(\"tile.tipos\"), val:m.n_tipos_recurso||0},\n    {lbl:td(\"tile.personagens\"), val:m.n_personagens||0},\n    {lbl:td(\"tile.relacoes\"), val:m.n_relacoes||0, note:td(\"tile.nTipos\", {n:m.n_tipos_relacao||0})},\n    {lbl:td(\"tile.vernaculo\"), val:m.n_vernaculo||0},\n    {lbl:td(\"tile.citacoes\"), val:(typeof pct===\"number\" ? pct+\"%\" : \"—\"),\n     note:`\u003cspan class=\"badge\">\u003cspan style=\"color:${cssv(estado[0])}\">${estado[1]}\u003c/span>` +\n          `${esc(td(estado[2]))}\u003c/span>`}\n  ];\n  $(\"#tiles\").innerHTML = cards.map(c =>\n    `\u003cdiv class=\"tile ${c.cls||\"\"}\">\u003cdiv class=\"lbl\">${c.lbl}\u003c/div>` +\n    `\u003cdiv class=\"val\">${c.val}\u003c/div>${c.note?`\u003cdiv class=\"note\">${c.note}\u003c/div>`:\"\"}\u003c/div>`).join(\"\");\n}\n\nfunction markdownLeve(txt){\n  if (!txt) return \"\";\n  // A análise vem com mudança de linha fixa; junta-se cada parágrafo numa só\n  // linha para o texto refluir com a largura da coluna em vez de herdar as\n  // quebras do ficheiro.\n  const linhas = esc(txt).split(\"\\n\");\n  let out = \"\", lista = false, buf = [];\n  const despejar = () => { if (buf.length){ out += `\u003cp>${inline(buf.join(\" \"))}\u003c/p>`; buf = []; } };\n  for (let l of linhas){\n    const h = l.match(/^(#{1,6})\\s+(.*)$/);\n    const li = l.match(/^\\s*[-*•]\\s+(.*)$/);\n    if (li){\n      despejar();\n      if (!lista){ out += \"\u003cul>\"; lista = true; }\n      out += \"\u003cli>\" + inline(li[1]) + \"\u003c/li>\"; continue;\n    }\n    if (lista && l.trim() && /^\\s{2,}\\S/.test(l)){        // continuação do item\n      out = out.replace(/\u003c\\/li>$/, \" \" + inline(l.trim()) + \"\u003c/li>\"); continue;\n    }\n    if (lista){ out += \"\u003c/ul>\"; lista = false; }\n    if (h){ despejar(); out += `\u003ch4>${inline(h[2])}\u003c/h4>`; continue; }\n    if (!l.trim()){ despejar(); continue; }\n    buf.push(l.trim());\n  }\n  despejar();\n  if (lista) out += \"\u003c/ul>\";\n  return out;\n  function inline(s){\n    return s.replace(/\\*\\*([^*]+)\\*\\*/g, \"\u003cstrong>$1\u003c/strong>\")\n            .replace(/(^|[\\s(])\\*([^*\\n]+)\\*/g, \"$1\u003cem>$2\u003c/em>\")\n            .replace(/`([^`]+)`/g, \"\u003ccode>$1\u003c/code>\");\n  }\n}\n\nfunction prosa(){\n  const a = D.analise || {};\n  const blocos = [\n    [td(\"prosa.personagens\"), a.personagens],\n    [td(\"prosa.vernaculo\"), a.vernaculo_recursos]\n  ].filter(b => b[1]);\n  $(\"#prosa\").innerHTML = blocos.map((b,i) =>\n    `\u003cdetails ${i===0?\"open\":\"\"}>\u003csummary>${esc(b[0])}\u003c/summary>` +\n    `\u003cdiv class=\"prosa\">${markdownLeve(b[1])}\u003c/div>\u003c/details>`).join(\"\")\n    || `\u003cp class=\"muted\">${esc(td(\"vazio.prosa\"))}\u003c/p>`;\n\n  $(\"#limitacoes\").innerHTML = markdownLeve(a.limitacoes) ||\n    `\u003cp class=\"muted\">${esc(td(\"vazio.limites\"))}\u003c/p>`;\n\n  const val = D.validacao || {};\n  const bloco = (t, arr, marca) => (arr && arr.length)\n    ? `\u003cdetails>\u003csummary>${esc(t)} (${arr.length})\u003c/summary>\u003cul class=\"aviso-list\">` +\n      arr.map(x => `\u003cli>${marca} ${esc(x)}\u003c/li>`).join(\"\") + \"\u003c/ul>\u003c/details>\" : \"\";\n  $(\"#validacao\").innerHTML =\n    bloco(td(\"val.erros\"), val.erros, \"✗\") +\n    bloco(td(\"val.avisos\"), val.avisos, \"!\") +\n    bloco(td(\"val.notas\"), val.notas, \"·\");\n}\n\n/* Controlos: filtros, tema, impressão e exportações. */\n\n/* ------------------------------------------------------------------ chrome */\nfunction preencherFiltros(){\n  const add = (sel, vals) => {\n    const s = $(sel);\n    vals.filter(Boolean).sort((a,b) => String(a).localeCompare(String(b), \"pt\"))\n        .forEach(v => { const o = document.createElement(\"option\"); o.value = v; o.textContent = v; s.appendChild(o); });\n  };\n  add(\"#f-personagem\", [...new Set(D.personagens.map(p => p.personagem))]);\n  add(\"#f-tipo\", [...new Set(D.recursos.map(r => r.tipo_recurso))]);\n  add(\"#f-relacao\", [...new Set(D.relacoes.map(r => r.tipo_relacao))]);\n  add(\"#f-certeza\", [...new Set(D.vernaculo.map(v => v.grau_certeza))]);\n}\nfunction lerFiltros(){\n  F.personagem = $(\"#f-personagem\").value;\n  F.tipo = $(\"#f-tipo\").value;\n  F.relacao = $(\"#f-relacao\").value;\n  F.certeza = $(\"#f-certeza\").value;\n  F.texto = $(\"#f-texto\").value.trim();\n}\nfunction descarregar(nome, conteudo, tipo){\n  const b = new Blob([conteudo], {type: tipo});\n  const u = URL.createObjectURL(b);\n  const a = document.createElement(\"a\");\n  a.href = u; a.download = nome; document.body.appendChild(a); a.click();\n  a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);\n}\nfunction paraCSV(linhas, colunas){\n  const q = v => { v = String(v==null?\"\":v); return /[\",\\n;]/.test(v) ? '\"'+v.replace(/\"/g,'\"\"')+'\"' : v; };\n  return \"﻿\" + [colunas.join(\",\")].concat(\n    linhas.map(l => colunas.map(c => q(l[c])).join(\",\"))).join(\"\\n\");\n}\n\nfunction ligarChrome(){\n  $$(\".card header .acts button[data-view]\").forEach(b => b.addEventListener(\"click\", () => {\n    const card = b.closest(\".card\");\n    card.querySelectorAll(\"button[data-view]\").forEach(x =>\n      x.setAttribute(\"aria-pressed\", String(x === b)));\n    card.querySelector(\".view-chart\").classList.toggle(\"hidden\", b.dataset.view !== \"chart\");\n    card.querySelector(\".view-table\").classList.toggle(\"hidden\", b.dataset.view !== \"table\");\n  }));\n  $$(\"button[data-svg]\").forEach(b => b.addEventListener(\"click\", () => {\n    const svg = $(\"#svg-\" + b.dataset.svg).cloneNode(true);\n    svg.setAttribute(\"xmlns\", NS);\n    svg.setAttribute(\"style\", `background:${cssv(\"--surface-1\")};font-family:${cssv(\"--sans\")}`);\n    // fixa as cores dos textos (as variáveis CSS não sobrevivem à exportação)\n    svg.querySelectorAll(\"text\").forEach(t => {\n      const c = t.getAttribute(\"class\")||\"\";\n      t.setAttribute(\"fill\", t.getAttribute(\"fill\") ||\n        (c.includes(\"tick\") ? cssv(\"--text-muted\") : cssv(\"--text-secondary\")));\n      t.setAttribute(\"font-size\", c.includes(\"tick\") ? \"11\" : \"11.5\");\n    });\n    svg.querySelectorAll(\".gridline\").forEach(l => l.setAttribute(\"stroke\", cssv(\"--grid\")));\n    svg.querySelectorAll(\".axisline\").forEach(l => l.setAttribute(\"stroke\", cssv(\"--axis\")));\n    descarregar(`${D.meta.slug||\"peca\"}-${b.dataset.svg}.svg`,\n      new XMLSerializer().serializeToString(svg), \"image/svg+xml\");\n  }));\n  const mapaCSV = {\n    recursos: [D.recursos, [\"id\",\"tipo_recurso\",\"citacao\",\"localizacao\",\"personagem\",\"interpretacao\",\"verificacao\"]],\n    personagens: [D.personagens, [\"personagem\",\"funcao_dramatica\",\"simbologia\"]],\n    vernaculo: [D.vernaculo, [\"expressao\",\"significado_epoca\",\"grau_certeza\",\"localizacao\",\"n_ocorrencias\"]]\n  };\n  $$(\"button[data-csv]\").forEach(b => b.addEventListener(\"click\", () => {\n    const [linhas, cols] = mapaCSV[b.dataset.csv];\n    descarregar(`${D.meta.slug||\"peca\"}-${b.dataset.csv}.csv`, paraCSV(linhas, cols), \"text/csv\");\n  }));\n  [\"#f-personagem\",\"#f-tipo\",\"#f-relacao\",\"#f-certeza\"].forEach(s =>\n    $(s).addEventListener(\"change\", () => { lerFiltros(); render(); }));\n  let t; $(\"#f-texto\").addEventListener(\"input\", () => {\n    clearTimeout(t); t = setTimeout(() => { lerFiltros(); render(); }, 180); });\n  $(\"#limpar\").addEventListener(\"click\", () => {\n    [\"#f-personagem\",\"#f-tipo\",\"#f-relacao\",\"#f-certeza\"].forEach(s => $(s).value = \"\");\n    $(\"#f-texto\").value = \"\"; selNo = null; lerFiltros(); render();\n  });\n  $(\"#tema\").addEventListener(\"click\", () => {\n    const actual = document.documentElement.getAttribute(\"data-theme\");\n    const escuroSO = matchMedia(\"(prefers-color-scheme: dark)\").matches;\n    const proximo = actual ? (actual === \"dark\" ? \"light\" : \"dark\") : (escuroSO ? \"light\" : \"dark\");\n    document.documentElement.setAttribute(\"data-theme\", proximo);\n    render();\n  });\n  $(\"#imprimir\").addEventListener(\"click\", () => window.print());\n\n  $$(\".lingua button\").forEach(b => b.addEventListener(\"click\", () => {\n    if (b.dataset.lingua === LINGUA_D) return;\n    LINGUA_D = b.dataset.lingua;\n    aplicarIdiomaDashboard();\n    cabecalho(); tiles(); prosa(); render();\n  }));\n}\n\n/* Título, metadados da peça e rodapé. */\n\nfunction cabecalho(){\n  const m = D.meta || {};\n  const titulo = m.titulo || td(\"peca.semTitulo\");\n  document.title = `${titulo} — ${td(\"titulo.sufixo\")}`;\n  $(\"#titulo\").textContent = titulo;\n  // género e datação podem vir nas duas línguas, se o catálogo as declarar\n  $(\"#subtitulo\").textContent = [dtxt(m.genero), dtxt(m.datacao)].filter(Boolean).join(\" · \");\n  const campos = [\n    [\"meta.proveniencia\", dtxt(m.proveniencia)], [\"meta.transcricao\", m.ficheiro],\n    [\"meta.linhas\", m.n_linhas], [\"meta.modelo\", m.modelo], [\"meta.analise\", m.data_execucao]\n  ].filter(c => c[1]);\n  $(\"#meta\").innerHTML = campos.map(c =>\n    `\u003cspan>\u003cb>${esc(td(c[0]))}:\u003c/b> ${esc(c[1])}\u003c/span>`).join(\"\");\n  $(\"#rodape\").innerHTML = td(\"rodape\", {f: esc(m.ficheiro || \"—\")});\n}\n\n/* Ordem de arranque. Tem de ser o último ficheiro. */\n\naplicarIdiomaDashboard(); ouvirLinguaDoSitio();\ncabecalho(); tiles(); preencherFiltros(); ligarChrome(); prosa(); lerFiltros(); render();\nmatchMedia(\"(prefers-color-scheme: dark)\").addEventListener(\"change\", render);\n\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","data":"2026-08-25 13:47","modelo":"","ficheiro":"presepio_graca.txt","n_linhas":1188,"metricas":{"citacoes_testadas":145,"citacoes_verificadas":145,"citacoes_deslocadas":0,"citacoes_nao_encontradas":0,"citacoes_sem_localizacao":0,"citacoes_verificadas_pct":100.0,"n_recursos":145,"n_tipos_recurso":15,"n_personagens":35,"n_relacoes":63,"n_vernaculo":45,"n_tipos_relacao":10,"n_linhas_peca":1188,"densidade_recursos_por_100_linhas":12.21},"validacao":{"valido":true,"n_erros":0,"n_avisos":1,"metricas":{"citacoes_testadas":145,"citacoes_verificadas":145,"citacoes_deslocadas":0,"citacoes_nao_encontradas":0,"citacoes_sem_localizacao":0,"citacoes_verificadas_pct":100.0,"n_recursos":145,"n_tipos_recurso":15,"n_personagens":35,"n_relacoes":63,"n_vernaculo":45,"n_tipos_relacao":10,"n_linhas_peca":1188,"densidade_recursos_por_100_linhas":12.21}},"ficheiros":[{"nome":"recursos_expressivos.csv","rotulo":"Ocorrências de recursos expressivos","url":"presepio-da-graca/recursos_expressivos.csv","bytes":"36929","conteudo":"﻿id,tipo_recurso,citacao,localizacao,personagem,interpretacao\nR001,anáfora,\"Eu não sou a quem a devidade in tempore formou, aos mais unidos, eu não sou o maior dos escolhidos\",L0027-L0029,Luzbel,A soberba formula-se por negação repetida: Luzbel define-se recusando o lugar que lhe foi dado. A anáfora instala desde o primeiro verso o tema da comparação com o alto que atravessa toda a peça.\nR002,hipérbole,ao sólio subirei no mesmo instante ocupando da glória o sacro assento,L0039-L0040,Luzbel,\"A instantaneidade («no mesmo instante») mede a desmedida: a usurpação é imaginada sem processo nem mediação, o que a torna teologicamente absurda antes de ser punida.\"\nR003,comparação,para em tudo ficar seu similante,L0041,Luzbel,\"Semelhança pretendida por conquista. Ecoa por antecipação a semelhança concedida a Adão em L0092, invertendo-lhe o sinal: o que é dom na criatura é roubo no anjo.\"\nR004,apóstrofe,Suspende o temerário pensameNto,L0045,São Miguel,\"O soneto de resposta abre com imperativo directo, sem exórdio. A justiça divina é encenada como interrupção, não como argumento.\"\nR005,metáfora,desde já te sepulta no tromento,L0048,São Miguel,Sepultura aplicada a um ser incorpóreo: a pena espiritual é dita em vocabulário funerário para se tornar representável em cena.\nR006,antítese,e no horrendo lugar da escuridade fromará em prepétuo o teu assento,L0052-L0053,São Miguel,Contraponto exacto ao «sacro assento» de L0040. A mesma palavra ocupa os dois extremos do eixo alto/baixo que organiza o auto.\nR007,personificação,e as entranhas da terra feia e escura sepulte para sempre esse maldito,L0060-L0061,São Miguel,A terra ganha entranhas e vontade punitiva. Prepara a terra hostil de Caim (L0248) e a terra regada de lágrimas de Adão (L0162).\nR008,metáfora,Desterrem-se as trevas que em sombras revestem a orbe,L0065,Padre Eterno,Criação dita em vocabulário jurídico-político: o desterro é pena de degredo. A ordem do mundo é imaginada como acto de soberania régia.\nR009,anáfora,Produza a terra todas as plantas e árvores... Produza o mar a competente criação de toda a diversidade de peixes... Produzam-se todos os animais segundo a ordem natural,L0082-L0087,Padre Eterno,\"A repetição do verbo escande a sequência criadora e serve de deixa às mutações de cenário anunciadas nas didascálias, articulando retórica e tramoia.\"\nR010,comparação,façamos o homem à nossa imagem e semelhança,L0092,Padre Eterno,\"Fórmula bíblica conservada intacta; funciona como termo de comparação estruturante a que Luzbel (L0041) e, mais tarde, a soberba de Olofernes se opõem.\"\nR011,metáfora,Na tua face deposito uma espiritual essência da vida,L0097,Padre Eterno,\"O sopro divino é dito como depósito — termo de guarda e de confiança, que implica devolução e prepara a lógica do preceito.\"\nR012,comparação,façamos um adjutório semelhante a ele,L0100,Padre Eterno,Eva é introduzida por semelhança e subordinação simultâneas; o termo «adjutório» fixa desde a criação a hierarquia que a sentença de L0132 tornará explícita.\nR013,alegoria,esta é a Árvore da ciência onde donde oculto o conhicimento do bem e do mal,L0105,Padre Eterno,O saber moral é figurado como fruto guardado. A alegoria dá corpo cénico a uma proibição abstracta e torna-a representável num único objecto.\nR014,ironia,De nenhum modo comendo dela podereis prigar na vida,L0113,Serpente,\"A tentação opera por negação enfática do que é verdadeiro. É a primeira das falas enganosas da peça, série que continua no Diabo cómico e se inverte na dissimulação virtuosa de Judite.\"\nR015,personificação,não sei o que me vaticina o coração,L0119,Adão,\"O coração profetiza: o pressentimento é externalizado num órgão que fala. Adão adivinha a culpa antes de a cometer, o que agrava a transgressão.\"\nR016,metáfora,como réu da culpa me escondi,L0127,Adão,\"Vocabulário forense aplicado à consciência. A queda é imediatamente traduzida em processo judicial, registo que domina toda a intervenção do Padre Eterno.\"\nR017,enumeração,\"naçarás filho algum sem empulsos de dores, será sojeita aos perceitos do homem, e debaixo do seu domínio vivirás\",L0132,Padre Eterno,\"Três encargos acumulados sobre Eva: dor, sujeição e domínio. A hierarquia doméstica setecentista é aqui enunciada como sentença divina, e é a passagem de maior densidade social do primeiro terço.\"\nR018,hipérbole,sarás a mais desgraçada entre todas as feras,L0132,Padre Eterno,\"Superlativo absoluto que fixa a serpente no fundo da escala dos viventes, completando por baixo a hierarquia que a criação estabelecera por cima.\"\nR019,metáfora,em copioso suor do teu rosto ganharás o pão té que te convertas em terra,L0135,Padre Eterno,\"O trabalho é dito em imagem circular: o homem vem da terra, alimenta-se dela e volta a ela. A metáfora agrícola torna-se, no lamento seguinte, a do pranto que rega.\"\nR020,personificação,sintirás as paixões que o mundo ilaça,L0141,Anjo,O mundo enlaça como caçador. A expulsão não é apenas espacial: entrega o homem a um agente activo e hostil.\nR021,personificação,vai que o mundo te dará o desengano,L0144,Anjo,O mundo torna-se preceptor moral. A oitava fecha o passo com uma sentença de sabor barroco — o desengano como forma de conhecimento.\nR022,metáfora,desfaze-te em puro pranto para lavar teu defeito,L0148,Adão,\"O choro como água baptismal antecipada. A penitência é figurada em operação de limpeza, isotopia que percorre toda a lamentação.\"\nR023,hipérbole,se não lançar pelos olhos lágrimas de cento a cento,L0151-L0152,Eva,A contagem das lágrimas transforma a dor em quantidade. O exagero numérico é o registo próprio da lamentação cantada deste passo.\nR024,hipérbole,Enquanto tivermos vida seja o nosso pranto eterno,L0159-L0160,Adão,\"Fala conjunta de Adão e Eva («Ambos»). A eternidade do pranto mede-se pela duração da vida: a hipérbole é, na verdade, uma definição da condição humana pós-lapsária.\"\nR025,metáfora,\"Chora regando essa terra Adão, com lágrimas puras\",L0162-L0163,Adão,\"O pranto converte-se em rega e a penitência em lavoura, ligando directamente a pena do trabalho (L0135) à pena da dor. É a metáfora mais bem integrada do passo.\"\nR026,antítese,pois pusestes fim ao bem por dares prencípio ao mal,L0169-L0170,Adão,\"Quiasmo perfeito entre fim/princípio e bem/mal. A auto-acusação assume forma de sentença moral memorizável, própria da glosa cantada.\"\nR027,apóstrofe,Sofre terra o golpe irado pois sendo a que me formaste fostes a mesma que brotastes fruto para o meu pecado,L0178-L0181,Adão,\"Adão interpela a terra como cúmplice: matéria da sua origem e do seu crime. A apóstrofe desloca parcialmente a culpa para a criação, movimento que o texto não corrige.\"\nR028,antítese,pois tantos séculos de graça por um bocado a perdi,L0193-L0194,Adão,\"Desproporção entre séculos e bocado: a antítese quantifica a queda e é, das formulações do passo, a que melhor condensa a doutrina.\"\nR029,antítese,que de Deus a imensa graça é maior que o teu pecado,L0204-L0205,Adão,\"Contra-antítese consoladora que responde à anterior. As duas juntas desenham o arco teológico completo — culpa desmedida, misericórdia maior — que a peça só cumprirá em Belém.\"\nR030,enumeração,\"poi são as pensões da vida: morrer, sentir e chorar\",L0224-L0225,Adão,\"Fala conjunta de Adão e Eva. «Pensão» tem aqui o valor coevo de encargo ou tributo devido, não o moderno de rendimento: a vida é dita como dívida a pagar em três prestações.\"\nR031,anáfora,Que podemos conseguir depois de pecado ter? Coro: Morrer.,L0214-L0216,Coro,\"O Coro responde com uma palavra a cada pergunta (Morrer / Sentir / Chorar). O destino é encenado como eco: não se argumenta, repete-se — e as três respostas são depois recolhidas no dístico final.\"\nR032,antítese,\"tu fertilizas os campos com grandes rabanhos, o meu gado cada vez mais se deminuem, e o teu se aumenta\",L0233,Caim,\"A inveja nasce de uma comparação contabilística. A antítese entre aumentar e diminuir é o motor do fratricídio e reencena, em escala doméstica, a comparação soberba de Luzbel.\"\nR033,ironia,acaso julgas-te mais saprior qu'eu?,L0237,Caim,Pergunta retórica que atribui ao irmão a soberba de que o próprio Caim está possuído. A projecção é o mecanismo psicológico que o texto expõe sem o nomear.\nR034,metáfora,\"sou escravo do senhor, e mais não sei\",L0238,Abel,\"A obediência define-se por servidão voluntária e por recusa de saber. Abel é o contrário exacto da Serpente, que prometia conhecimento (L0113).\"\nR035,eufemismo,com a tua morte porarei fim a tantos cuidados,L0239,Caim,\"O homicídio é dito como alívio administrativo. O eufemismo tem gémeo exacto na boca de Judite (L0689-L0690), simetria que a peça não comenta.\"\nR036,personificação,\"serva-te de castigo a mesma terra, que andando por ela fugitivo nem ela mesma te empare nem eu jamais te secorra\",L0248,Padre Eterno,\"A terra passa de mãe a carcereira. Completa a série iniciada em L0060 e prepara a imagem seguinte, em que Caim pede à mesma terra que se abra.\"\nR037,hipérbole,Ainda a terra não se abre em diferentes bocas para somergir este desesperado,L0253,Caim,A terra ganha bocas: o desespero pede a punição que lhe foi negada. A hipérbole marca a passagem do registo trágico ao entremez que se lhe segue.\nR038,comparação,\"Eu entendo que vossa mercê é como os engleses, que em lhe dando bexigas querem-se enterrar vivos\",L0254,Diabo,\"Comparação anacrónica que muda o registo da peça de um golpe: o desespero bíblico é reclassificado como melancolia inglesa, tópico corrente na Europa setecentista.\"\nR039,ironia,\"Engana-se, que eu cantei bem nos meus tempos\",L0256,Diabo,O Diabo responde à repulsa com vaidade de cantor. A auto-ironia humaniza-o e é precisamente o que o torna eficaz como tentador.\nR040,provérbio,não tenha medo que o diabo não é tão feio como o pintam,L0258,Diabo,O Diabo cita o provérbio que existe sobre si próprio. O efeito metalinguístico é o achado cómico do passo e desactiva a iconografia do medo que a cena acabara de montar.\nR041,anacronismo,Venha comigo que lhe quero dar uma sala onde tome chá com o meu amigo Poltão,L0262,Diabo,\"O Inferno como sala de visitas com chá servido. Plutão, deformado em Poltão, torna-se anfitrião mundano: o mal apresenta-se por convite de sociabilidade, não por ameaça.\"\nR042,anacronismo,o tomei por valete de chambri que costuma servir aos hóspades,L0264,Diabo,\"A corte infernal organiza-se como casa nobre lisboeta, com criadagem hierarquizada. O galicismo cru marca a moda cortesã da segunda metade de setecentos.\"\nR043,antítese,\"o céu me falta, a terra não me ampara\",L0272,Caim,Suspensão entre dois recursos negados. A oitava de Caim fecha o passo com a formulação mais concisa do desamparo em toda a peça.\nR044,apóstrofe,chovam já desses céus emensos raios,L0276,Caim,\"Invocação do castigo como desafio. A chuva de raios contrasta, por antecipação, com a chuva de bênção que fechará o passo de Noé (L0307).\"\nR045,metáfora,O mundo flutua em um lago de tropezas,L0285,Padre Eterno,Metáfora aquática que anuncia literalmente o dilúvio: o pecado é já água antes de a água ser castigo. É a prolepse mais elegante do papel.\nR046,apóstrofe,Oh quem podera satisfazer aos pecados de todos para que ficássemos salvos de tanta ruína,L0286,Noé,\"Desejo formulado como pergunta impossível. No plano da compilação, é uma prefiguração explícita da Redenção que o Passo dos Pastores virá celebrar.\"\nR047,metáfora,samos mandados clausurar em uma arca,L0292,Noé,\"«Clausurar» tem aqui o valor de clausura monástica, não o moderno de encerramento genérico: a arca é lida como convento, e a salvação como recolhimento regrado.\"\nR048,metáfora,Receba a terra o ósculo de paz,L0305,Noé,\"Fala colectiva («Todos»). O gesto litúrgico da paz é transferido para a terra emersa, transformando o fim do dilúvio em cerimónia de reconciliação.\"\nR049,metáfora,Já que ficamos livres da ruína a bênção chova em nós da mão divina,L0307,Noé,Fala colectiva. A mesma imagem — chuva — que fora instrumento de destruição torna-se veículo de graça. A inversão fecha o passo com economia notável.\nR050,comparação,\"Capitães valerosos cujos peitos excedem ao de Martem, heróim invicto\",L0326-L0327,Olofernes,\"O termo de comparação é mitológico e pagão, adequado ao tirano assírio. Contrasta deliberadamente com as comparações domésticas dos passos cómicos.\"\nR051,metáfora,esforçai o valor bramindo a lança,L0328,Olofernes,O bramido pertence ao animal e é transferido para a arma. A guerra é figurada como som antes de ser acção — coerente com um tirano que vence sobretudo por discurso.\nR052,hipérbole,morram todos e não fiquem nenhum vivos,L0344,Olofernes,Pleonasmo hiperbólico que expõe a desmedida pela própria redundância sintáctica. O excesso da ordem está no excesso da frase.\nR053,antítese,esquecida a paixão para a piedade té se rompam os sagrados idifícios,L0355-L0356,Olofernes,A paixão é convocada para a destruição e esquecida para a clemência. A antítese define o tirano por aquilo que decide não sentir.\nR054,metáfora,Com a espada morram o braço armado o coração vestido de bravura,L0368-L0369,1.º Capitão,O coração veste-se como um corpo. O soneto a dois vozes dos capitães faz da obediência militar uma forma métrica: o encaixe das réplicas é a imagem da disciplina.\nR055,hipérbole,rotas as pedras se veja destruída não se deixe vivente algum com vida,L0405-L0406,Olofernes,Destruição total declarada em dois planos — mineral e vivo. A acumulação prepara a tríade final de L0435.\nR056,hipérbole,\"tudo estrago será, nem sepultura aos mortos lhe darei em parte digna\",L0424-L0425,Olofernes,\"A negação de sepultura é, na tradição clássica, o extremo da desumanidade. O tirano define-se por ultrapassar o limite que separa a guerra do sacrilégio.\"\nR057,anáfora,\"tudo em pó, tudo em cinza e tudo em fogo\",L0435,Olofernes,\"Tríade em gradação que fecha a ária de Olofernes. É pura potência verbal — e a peça encarrega-se de a desmentir, fazendo-o cair por uma mulher e um jantar.\"\nR058,personificação,\"a sua mesma cabeça será testemunha disto, pois separada do corpo hei de trazê-la comigo\",L0449-L0452,Judite,\"A cabeça decepada é convocada como testemunha judicial. Judite anuncia o desfecho com precisão forense, e o troféu vale como prova.\"\nR059,metáfora,oh ânimo revestido de uma pura fé,L0456-L0457,Sacerdote,A fé é armadura. A metáfora bélica aplicada à virtude autoriza religiosamente a violência de Judite e converte iniciativa individual em causa colectiva.\nR060,metáfora,já meu amo tira hoje a ferruge ao seu dinheiro,L0467-L0469,Mestre-Sala,A avareza é dita pela oxidação da moeda parada. É a primeira fala do criado e fixa de imediato a sua função: ver o senhor por dentro.\nR061,metáfora,o Mestre-Sala também há de ter a sua função de lambedela,L0471-L0472,Mestre-Sala,O banquete do amo desdobra-se num banquete de criados. A metáfora do lamber marca a posição na cadeia alimentar da casa — e da peça.\nR062,anacronismo,vi uma dama destas de topete alto à Zamperina,L0503-L0504,Mestre-Sala,Judite entra na tenda assíria com o penteado da cantora de ópera em voga em Lisboa. É o anacronismo mais preciso do papel e o seu melhor indício de datação relativa.\nR063,trocadilho,\"Minha menina, poteis intrare\",L0508,Mestre-Sala,Latim de fantasia com terminação italianizante. O criado exibe língua que não domina — procedimento que se repetirá com a Velha (L0625) e com o Doutor (L0883).\nR064,metáfora,por desventura da estrela foi de minha vida o berço,L0519-L0520,Judite,\"Astrologia como retórica de queixa. Judite constrói uma biografia falsa em romance cantado, e a metáfora fatalista é o que a torna verosímil ao ouvido do tirano.\"\nR065,hipérbole,não ficará pedra sobre pedra desta enfeliz cidade de Betúlia,L0566-L0568,Olofernes,A promessa de arrasamento é feita como galanteio: a destruição de uma cidade oferecida a uma mulher como prova de afecto. A hipérbole tem aqui função erótica.\nR066,anacronismo,E que função terão os rapazes na Cotovia com tanta pedra?,L0569-L0570,Mestre-Sala,O aparte reduz o arrasamento de Betúlia a matéria-prima para as pedradas dos rapazes de um bairro lisboeta. É o mecanismo central do papel: rebaixar o bíblico à rua do espectador.\nR067,ironia,Cuidado nisso.,L0573,Mestre-Sala,Duas palavras respondem a uma ameaça de genocídio. O laconismo do criado desactiva a retórica do amo com mais eficácia do que qualquer réplica longa.\nR068,metáfora,a tua fromusura me tem arrebatado de tal sorte que já não sei parte de mim,L0586-L0588,Olofernes,O tirano descreve-se como território conquistado. A metáfora inverte a relação de poder antes de a acção o fazer: quem cerca cidades é cercado.\nR069,ironia,Foram-se os gulosos mas foram bem convidados,L0613-L0614,Mestre-Sala,O criado avalia o banquete pela perspectiva do que sobra. A ironia sobre a gula dos senhores é também constatação de fome própria.\nR070,trocadilho,Vossa mercê não sabe que acessório séquito porém cipa-me cipale,L0625-L0626,Mestre-Sala,Latim macarrónico usado como arma de galanteio. Não comunica: exibe — e a Velha desmascara-o na fala seguinte.\nR071,ironia,ei sei cá latim!,L0627,Velha,A ignorância declarada derrota a erudição fingida. A resposta é o momento em que a peça toma partido pelo saber popular contra a exibição letrada.\nR072,anáfora,\"não repara nestas cãs, não vê esta prespicácia\",L0635-L0637,Velha,A dupla negação invoca a autoridade da idade. A Velha reivindica respeito com os mesmos argumentos com que a peça a torna ridícula.\nR073,anáfora,Farei com que mais não fale farei com que mais não diga e lhe arrancarei esses olhos,L0648-L0650,Velha,\"Gradação de ameaças que sobe da palavra ao corpo. A anáfora dá à fúria da velha uma forma retórica quase litúrgica, o que aumenta o efeito cómico.\"\nR074,metáfora,vai-te negra cristaleira do inferno,L0654,Mestre-Sala,A injúria identifica a velha com o ofício de aplicar clisteres. O corpo feminino envelhecido é reduzido a função escatológica — o registo mais violento do papel.\nR075,hipérbole,Traze-me para aqui um bom alguidar de sopas com seiscentas rodas de paio,L0659-L0660,Mestre-Sala,O número redondo e absurdo mede a fome. A hipérbole alimentar é o contraponto exacto da hipérbole destrutiva de Olofernes (L0435).\nR076,trocadilho,Quem te alinhavara o corpo co uma faca,L0664-L0665,Mestre-Sala,\"O criado devolve ao cozinheiro a palavra que este acabara de usar para o cozido («alinhavado», L0663), transferindo-a da costura para o golpe. A ameaça nasce do léxico do outro.\"\nR077,anáfora,\"Queimado sejas tu, venha a olha... Apodrecidos sejam os teus olhos\",L0667-L0669,Mestre-Sala,Cada resposta do Preto é convertida em maldição pela repetição do particípio. O diálogo funciona como máquina: o que falta à cozinha volta como praga.\nR078,ironia,\"Nos copa de meu senhor Oslofernes há muntas cosas, há pão, há vinho\",L0671-L0672,Preto (criado de Olofernes),\"Depois de negar tudo, o cozinheiro aponta a despensa do amo. A fala expõe, sem o dizer, que a escassez dos criados coexiste com a abundância do senhor.\"\nR079,eufemismo,\"dormindo está, eterno há de ser o seu descanso\",L0689-L0690,Judite,\"O sono desliza para a morte no espaço de uma vírgula. O eufemismo é idêntico em função ao de Caim (L0239), com valoração moral oposta.\"\nR080,apóstrofe,morre ó mostro da tirania não blazones de atrevido quando uma molher te osurpa os assentos,L0692-L0694,Judite,O golpe é acompanhado de sentença. «Assentos» retoma pela terceira vez a palavra que Luzbel quis ocupar (L0040) e que São Miguel lhe negou (L0053): a inversão hierárquica fecha aqui o seu ciclo.\nR081,comparação,\"Oh valerosa Pantalisea, bote, bote aqui neste avental que eu levo lá para dentro\",L0695-L0696,Velha,Judite é saudada como Pentesileia e no mesmo fôlego convidada a pôr a cabeça num avental. A queda do registo épico para o doméstico é o mais eficaz bathos do papel.\nR082,ironia,Quem havia de ser senão aquela caganita que lhe levou a cabeça,L0707-L0708,Mestre-Sala,\"O tiranicídio é reportado em linguagem de insulto de rua. O criado retira à heroína a solenidade que o texto sério lhe atribui, e a peça deixa as duas leituras coexistir.\"\nR083,hipérbole,aqui tens a cabeça mais ferina,L0719,Judite,\"Superlativo que transforma o despojo em prova pública. A oitava final devolve o passo ao registo elevado, apagando o entremez que acabara de decorrer.\"\nR084,apóstrofe,\"Descuidados pastores, ter sentido, despertai desse sono tão profundo\",L0733-L0734,Anjo,\"O anúncio começa por repreensão. O sono dos pastores é o mesmo descuido moral de que a peça vem tratando desde Adão, e o despertar vale por conversão.\"\nR085,anáfora,\"Já o Céu glória em si está possuindo, já os homens tem paz, gosto jocundo\",L0737-L0738,Anjo,A dupla anáfora do «já» marca a mudança de tempo teológico: o que era espera passa a estado presente. É a articulação que justifica todos os passos anteriores.\nR086,antítese,ou será favor do Céu ou é sonho do sentido,L0747-L0748,Alceto,\"Fala colectiva dos pastores. A alternativa entre revelação e ilusão é resolvida pela verificação («pois eu os olhos abrindo», L0750), procedimento que dá ao milagre o estatuto de facto testemunhado.\"\nR087,metáfora,vi encaminhar-se ao Céu um celeste paranifo,L0751-L0752,Alceto,\"«Paraninfo» — o que conduz a noiva — aplica ao anjo vocabulário de núpcias, alusão à união entre o divino e o humano que o Natal celebra.\"\nR088,antítese,\"Tens do céu estimação, arruinado idifício, pois em ti nasce o prencípio para a nossa salvação\",L0765-L0768,Alceto,\"A ruína material é a condição da elevação espiritual. Esta antítese é a formulação central da teologia do presépio e responde, ponto por ponto, à ruína de Betúlia.\"\nR089,anáfora,Quanto posso e quanto tenho desde já fica ofrecido,L0771-L0772,Alceto,\"A oferta define-se por totalidade, não por quantidade. A anáfora mede a dádiva pela capacidade e não pelo valor — doutrina que Anfriso completará oferecendo a pobreza.\"\nR090,metáfora,só por ser ademetido ao vosso santo rebenho,L0773-L0774,Alceto,O pastor pede para ser ovelha. A inversão de papéis dentro da própria metáfora pastoril é o modo como o passo articula ofício real e figura religiosa.\nR091,apóstrofe,\"Oh, ditosas porfecias de alto mistério profundo\",L0785-L0786,Amador,\"A invocação dirige-se às profecias e não a Deus: o que se celebra é o cumprimento de um texto, o que faz do presépio a última cena de uma escritura.\"\nR092,antítese,\"para ter fim todo o mal, é nascido o nosso bem\",L0797-L0798,Florindo,\"Fecho doutrinal da adoração, com paralelismo perfeito entre mal e bem. Encerra a série de antíteses aberta em L0169 pela auto-acusação de Adão.\"\nR093,hipérbole,Todas as horas e dias seja o louvor de contínuo,L0789-L0790,Amador,A totalidade temporal do louvor responde à totalidade da oferta (L0771). Os quatro pastores repartem entre si os modos possíveis de dar.\nR094,apóstrofe,\"Ah tempos, tempos, como estais virsificados dos antigos tempos!\",L0818,Manuel Gonçalves,\"Tópico do elogio do tempo antigo, transposto para a boca de um pescador. A queixa geracional abre o monólogo e legitima a evocação nostálgica que se segue.\"\nR095,ironia,Qui seja possibli que estes labutem nos destranques e que eu ande chafurdando na obra da arca,L0818,Manuel Gonçalves,\"Fala metateatral: o actor queixa-se do serviço que lhe dá a máquina do dilúvio. É a prova interna mais forte de que este monólogo é a «parte» anunciada em L0289, dentro do passo de Noé.\"\nR096,comparação,uma delas era mocetona como um barco,L0818,Manuel Gonçalves,\"O corpo feminino medido em tonelagem. A comparação instala o campo náutico que organizará todo o monólogo, do vestuário à correspondência amorosa.\"\nR097,metáfora,\"era um camezote de Holanda, de vela de navios, com punhos e bofes de casa de traquete\",L0818,Manuel Gonçalves,A camisa é descrita peça a peça como aparelho de navio. O luxo é dito no único vocabulário técnico que o falante possui — o que é simultaneamente cómico e socialmente exacto.\nR098,enumeração,\"pondem-se-á 3 casões, 20 arraias, 18 safios, 30 eroses , 60 caxuxos, e de sardinhas 500\",L0818,Manuel Gonçalves,\"Inventário de pescado com quantidades crescentes. A enumeração serve de prova de amor e é, ao mesmo tempo, o documento lexical mais rico do papel sobre a pesca da costa.\"\nR099,trocadilho,te rimeto esse despigo pois ainda me não despigo,L0821-L0822,Manuel Gonçalves,Paronomásia entre o despojo de pescado e o despicar-se amoroso. A décima do pescador constrói-se inteira sobre este tipo de duplo sentido técnico-afectivo.\nR100,metáfora,pois vai com o sangue na guelra,L0829,Manuel Gonçalves,\"A frescura do peixe garante a frescura do amor. A metáfora funde por completo o campo do ofício e o do sentimento, sem resto.\"\nR101,trocadilho,\"pois na compra do carinho, ninguém me tira do lanço\",L0832-L0833,Manuel Gonçalves,«Lanço» é ao mesmo tempo o lance da rede e o lance do leilão. O afecto é dito como transacção em que o falante não se deixa cobrir.\nR102,trocadilho,só contigo mi trismalho,L0839,Manuel Gonçalves,O trasmalho é a rede de três malhas e «tresmalhar-se» é perder-se. O verso condensa em três palavras a arte e o desnorte amoroso.\nR103,alegoria,\"Fichi a carta e miti a chavi n'alzibeira, embarquei-a no paquete, largou este o passo todo, foi bolinando por i fora, chegou à porta da moça, pouse a capa, fez sinal à fortaleza\",L0841,Manuel Gonçalves,\"A entrega da carta é narrada como viagem completa de embarcação, com manobra, aproximação e sinal à fortaleza. É a alegoria mais desenvolvida do papel e transforma um recado numa campanha naval.\"\nR104,metáfora,\"cingi a farrusca a balravento, mandi abri os embornais nos sapatos, pus o galério no topi, virei o gajeiro para a parte esquerda\",L0841,Manuel Gonçalves,\"O corpo vestido é aparelhado como navio, do calçado ao chapéu. O léxico náutico converte-se aqui em código de elegância popular.\"\nR105,hipérbole,só os bofes afogados podiam encher todas as tavernas do mal cozinhado,L0841,Manuel Gonçalves,Os folhos da camisa dariam para abastecer as casas de comida da Ribeira. A hipérbole mede o traje pela geografia comercial de Lisboa.\nR106,ironia,\"mas isperi, com quem falo eu\",L0841,Manuel Gonçalves,Interrupção metateatral que devolve o falante à consciência do público. Fecha o monólogo com a mesma quebra de ilusão com que ele começara (L0818).\nR107,metáfora,vamos entrando na palesta de Cupido,L0861,Chantre,A portaria do convento é declarada palestra — lugar de combate e de exercício. O galanteio é enquadrado desde a primeira fala como desporto regrado.\nR108,antítese,\"que sendo esta portaria aula de amorosos certames, se veja agora teatro de mercancias\",L0861,Chantre,Contraste entre o passado cortês e o presente comercial da mesma grade. A palavra «teatro» acrescenta uma camada metateatral à sátira do freiratismo.\nR109,metáfora,os frios corações de afectos perseverantes vinham buscar calor no moratório aos raios de tantos sóis que garnecem esta clausura,L0861,Chantre,\"As freiras são sóis e a clausura é braseiro. A metáfora petrarquista é aplicada com toda a seriedade a um espaço religioso, e é dessa impropriedade que nasce a sátira.\"\nR110,metáfora,\"Se a enfirmidade de amor precisa de junta, aqui está um doutor\",L0867,Doutor,O amor como doença que requer junta médica. A isotopia clínica atravessará todo o passo e permite ao Doutor tratar sentimentos como sintomas.\nR111,metáfora,ainda não está enferma a nossa conrespondência,L0869,Chantre,O Chantre aceita a metáfora do outro e continua-a. A amizade é diagnosticada como se fosse corpo — sinal de que os dois falam a mesma língua paródica.\nR112,trocadilho,\"Função rija? De que é, de pau do Brasil?\",L0871,Doutor,\"O adjectivo «rija» é desviado do sentido de solene para o de dura, e daí para a madeira colonial. O equívoco obsceno funciona por deslize material.\"\nR113,trocadilho,Por que mandaste vir algum romendão? Ora estimo pois também quero o meu romendo,L0875,Doutor,Jogo entre o músico remendão e o remendo. A resposta rebaixa o concerto anunciado a trabalho de costura.\nR114,sátira,\"Tudo o que é asneira é despidido juízo, pois na loucura não se dá acto de descurso Ergo; é vossa mercê um pedaço d'asno\",L0883,Doutor,\"Silogismo escolástico completo, com «Ergo» incluído, ao serviço de um insulto. É o núcleo intelectual do entremez: a lógica das escolas exibida como maquinaria vazia.\"\nR115,hipérbole,\"Quem, por destino dos astros, vem comprir o fado desta portaria\",L0889-L0890,Chantre,Resposta a uma porteira formulada em estilo de tragédia. O desajuste entre a grandeza do enunciado e a banalidade da situação é o método cómico do passo.\nR116,metáfora,É forte lobisomi,L0892,Doutor,\"Aparte que classifica o companheiro como criatura nocturna. O Doutor comenta à parte tudo o que o Chantre diz a sério, mantendo o público do seu lado.\"\nR117,ironia,\"Se a saúde tem notícia dela, pregoa/prego-a no mar\",L0896,Doutor,\"A saúde da freira é dada por perdida numa fórmula de escárnio marítimo. A barra é do transcritor e assinala leitura dupla, não uma escolha do texto.\"\nR118,ironia,estimarei que vossa senhoria conte dilatados anos só para vir a ser desengano das idades,L0900,Doutor,O voto de vida longa converte-se em insulto pela finalidade que lhe é dada. É a construção irónica mais fina do papel: a cortesia usada como veículo exacto da ofensa.\nR119,ironia,\"Não, minha senhora, mas está já muito alquebrada\",L0904,Doutor,\"A negação atenuante agrava o insulto anterior. O par pergunta/resposta mostra que a vítima entende, o que aumenta a crueldade cómica.\"\nR120,hipérbole,Isso é uma traquinada de cacos que vinha da botica,L0922,Galego,O criado reporta a medicação como estrondo de louça. A deformação popular do vocabulário médico caracteriza-o socialmente e ridiculariza a farmacopeia.\nR121,ironia,\"Ó galego, teu amo quer pôr agora loje de sabão!\",L0924,Doutor,\"Do relato dos frascos deduz-se um negócio de sabão. O Doutor troça do criado e, por tabela, do amo que o emprega.\"\nR122,ironia,\"Vai, que eu cá a irei temperando\",L0932,Doutor,\"O verbo oscila entre acalmar e afinar, com evidente insinuação. O médico oferece-se para cuidar da prima na ausência do primo.\"\nR123,hipérbole,\"quem ama, os minutos lhe parece itirnidade\",L0952,Freira,\"Tópico petrarquista do tempo dilatado, dito com toda a seriedade dentro de uma cena cómica. A Freira é a única personagem do passo que não faz troça de ninguém.\"\nR124,sátira,\"Ah, que a freira quer ter cachorrinho de fralda a toda a hora\",L0954,Doutor,\"O primo é reduzido a animal de regaço. A imagem satiriza de um golpe o freiratismo, a ociosidade conventual e a masculinidade do Chantre.\"\nR125,sátira,seriam poucos todos os gorgomilos para poblicar a glória que tenho de ver a vossa senhoria,L0958,Doutor,\"Paródia do estilo cultista levada ao limite do inteligível. O excesso de ornamento denuncia-se a si próprio, e o cumprimento não chega a significar nada.\"\nR126,comparação,Seu primo parece-me um bonecro,L0962,Doutor,O Chantre é comparado a um boneco. A redução a objecto articulado prepara o soneto ridículo que ele próprio vai declamar.\nR127,enumeração,\"Durmo pouco, ando sempre com mil pressas, visto às vezes as meias às avessas, não sei o que vou ler no bribiário\",L0975-L0977,Chantre,Catálogo de sintomas amorosos rebaixado do sofrimento cortês para o desmazelo doméstico. A meia às avessas substitui as insónias de Petrarca.\nR128,sátira,fui marrar outro dia com um almário,L0981-L0982,Chantre,O soneto amoroso termina com uma cabeçada num armário. O bathos final desmonta os treze versos anteriores e é a assinatura cómica do passo.\nR129,sátira,\"Tenho um primo Joaquim que é um galante sujeito, comprei onte à tarde um leito para esta noute dormir\",L0992-L0995,Doutor,\"Décima de disparates encadeados sem nexo, em resposta ao soneto do Chantre. A paródia opera pela ausência total de pertinência — a forma poética mantém-se, o sentido evapora-se.\"\nR130,hipérbole,\"depois de vos ouvir, prima adorada, já não tem mais que ouvir o meu desejo\",L1043-L1044,Chantre,Encerramento do encómio: ouvir a prima esgota o desejo de ouvir. A hipérbole é sincera dentro da ficção e ridícula fora dela.\nR131,ironia,\"que essa voz, pelo grosso e pelo fino, bem pode acompanhar qualquer defunto\",L1050-L1051,Doutor,\"Primeiro verso do contra-encómio. O soneto do Doutor responde ao do Chantre verso a verso, formando um díptico louvor/vitupério que é a construção retórica mais elaborada do papel.\"\nR132,comparação,esse eco substimado parece de rapaz inda de escola quando vai a fazer o seu recado,L1057-L1059,Doutor,\"A voz da freira é comparada à de um moço de recados. A comparação retira-lhe simultaneamente idade, sexo e dignidade.\"\nR133,ironia,há de cantar os passos da charola,L1063,Doutor,O destino artístico prometido é o das procissões da Quaresma. A referência local dá ao insulto uma precisão que o público reconheceria de imediato.\nR134,trocadilho,\"Cacau tem ela, que lhe dá o Chantre\",L1068,Doutor,Aparte obsceno construído sobre a mercadoria colonial que acaba de entrar em cena. É o ponto em que a sátira ao clero se torna mais crua.\nR135,hipérbole,Essa vozo é um trovão,L1079,Preto (vendedor de cacau),\"O elogio hiperbólico do vendedor é sincero e, por isso mesmo, mais devastador do que a ironia do Doutor. A voz que todos criticaram é aqui fenómeno meteorológico.\"\nR136,comparação,pode ir a uma função com os pretinhos de Guiné,L1083-L1084,Preto (vendedor de cacau),\"O louvor situa a freira numa festa negra de Lisboa. A comparação atravessa a fronteira social do convento e é, no papel, a única que o faz por elogio.\"\nR137,metáfora,\"Ai, que o sebo vai-se derretendo\",L1090,Doutor,Aparte que traduz o enlevo geral em gordura a derreter. A metáfora corpórea desfaz o clima de galanteio no exacto momento em que ele culmina.\nR138,comparação,O senhor doutor parece que gritava àque del rei,L1110,Preto (vendedor de cacau),\"O canto do médico é comparado ao grito de socorro. A comparação vinga, sem intenção aparente, todas as troças que o Doutor distribuiu.\"\nR139,ironia,\"Se ele curasse os doentes cantando, morriam todos\",L1112,Galego,\"O criado remata o escárnio ao médico. É significativo que a sentença mais dura contra o Doutor venha do galego, a personagem de menor estatuto da cena.\"\nR140,antítese,quem não vive duvidoso não ama os finos desvelos,L1120-L1121,Chantre,\"Glosa do mote «Quem tem amores, tem zelos». A antítese entre dúvida e amor é doutrina cortês tratada com seriedade, num contexto que a esvazia.\"\nR141,enumeração,\"Casado tem mulher, quem bem paga tem dinheiro, vende vinho o taverneiro, quem tem fome quer comer\",L1129-L1132,Doutor,Glosa feita inteira de truísmos. A forma poética cumpre-se com rigor enquanto o conteúdo se recusa: é paródia da glosa como exercício obrigatório de sociedade.\nR142,ironia,\"era preta dos outro laia, parenta dos Vasconcelos\",L1155-L1156,Preto (vendedor de cacau),Atribui-se à mulher negra parentesco com uma casa nobre portuguesa. O verso brinca com a genealogia e com os apelidos impostos pela escravatura — leitura que o texto abre e não desenvolve.\nR143,sátira,que o mesmo é ter freira que cobrar a cabeça,L1166,Doutor,\"Sentença final sobre o freiratismo, com jogo entre a cabeça que se cobra e a que se perde. Fecha o passo devolvendo-lhe o motivo da decapitação que o passo de Judite tratara a sério.\"\nR144,trocadilho,\"vá-se embora, que aqui não há frete\",L1180,Preto (vendedor de cacau),«Frete» é carreto e é proveito. A altercação final entre os dois criados estrangeirados faz-se toda sobre os ofícios a que cada um é socialmente atribuído.\nR145,trocadilho,vá-se embora que aqui não há que esfolar,L1182,Galego,\"Resposta simétrica, com o ofício de esfolar atribuído ao adversário. A peça acaba, significativamente, num conflito entre subalternos e não entre senhores.\"\n"},{"nome":"recursos_expressivos_verificado.csv","rotulo":"Ocorrências com o resultado do cotejo","url":"presepio-da-graca/recursos_expressivos_verificado.csv","bytes":"39736","conteudo":"﻿id,tipo_recurso,citacao,localizacao,personagem,interpretacao,linha_inicio,linha_fim,citacao_verificada\nR001,anáfora,\"Eu não sou a quem a devidade in tempore formou, aos mais unidos, eu não sou o maior dos escolhidos\",L0027-L0029,Luzbel,A soberba formula-se por negação repetida: Luzbel define-se recusando o lugar que lhe foi dado. A anáfora instala desde o primeiro verso o tema da comparação com o alto que atravessa toda a peça.,27,29,verificada\nR002,hipérbole,ao sólio subirei no mesmo instante ocupando da glória o sacro assento,L0039-L0040,Luzbel,\"A instantaneidade («no mesmo instante») mede a desmedida: a usurpação é imaginada sem processo nem mediação, o que a torna teologicamente absurda antes de ser punida.\",39,40,verificada\nR003,comparação,para em tudo ficar seu similante,L0041,Luzbel,\"Semelhança pretendida por conquista. Ecoa por antecipação a semelhança concedida a Adão em L0092, invertendo-lhe o sinal: o que é dom na criatura é roubo no anjo.\",41,41,verificada\nR004,apóstrofe,Suspende o temerário pensameNto,L0045,São Miguel,\"O soneto de resposta abre com imperativo directo, sem exórdio. A justiça divina é encenada como interrupção, não como argumento.\",45,45,verificada\nR005,metáfora,desde já te sepulta no tromento,L0048,São Miguel,Sepultura aplicada a um ser incorpóreo: a pena espiritual é dita em vocabulário funerário para se tornar representável em cena.,48,48,verificada\nR006,antítese,e no horrendo lugar da escuridade fromará em prepétuo o teu assento,L0052-L0053,São Miguel,Contraponto exacto ao «sacro assento» de L0040. A mesma palavra ocupa os dois extremos do eixo alto/baixo que organiza o auto.,52,53,verificada\nR007,personificação,e as entranhas da terra feia e escura sepulte para sempre esse maldito,L0060-L0061,São Miguel,A terra ganha entranhas e vontade punitiva. Prepara a terra hostil de Caim (L0248) e a terra regada de lágrimas de Adão (L0162).,60,61,verificada\nR008,metáfora,Desterrem-se as trevas que em sombras revestem a orbe,L0065,Padre Eterno,Criação dita em vocabulário jurídico-político: o desterro é pena de degredo. A ordem do mundo é imaginada como acto de soberania régia.,65,65,verificada\nR009,anáfora,Produza a terra todas as plantas e árvores... Produza o mar a competente criação de toda a diversidade de peixes... Produzam-se todos os animais segundo a ordem natural,L0082-L0087,Padre Eterno,\"A repetição do verbo escande a sequência criadora e serve de deixa às mutações de cenário anunciadas nas didascálias, articulando retórica e tramoia.\",82,87,verificada\nR010,comparação,façamos o homem à nossa imagem e semelhança,L0092,Padre Eterno,\"Fórmula bíblica conservada intacta; funciona como termo de comparação estruturante a que Luzbel (L0041) e, mais tarde, a soberba de Olofernes se opõem.\",92,92,verificada\nR011,metáfora,Na tua face deposito uma espiritual essência da vida,L0097,Padre Eterno,\"O sopro divino é dito como depósito — termo de guarda e de confiança, que implica devolução e prepara a lógica do preceito.\",97,97,verificada\nR012,comparação,façamos um adjutório semelhante a ele,L0100,Padre Eterno,Eva é introduzida por semelhança e subordinação simultâneas; o termo «adjutório» fixa desde a criação a hierarquia que a sentença de L0132 tornará explícita.,100,100,verificada\nR013,alegoria,esta é a Árvore da ciência onde donde oculto o conhicimento do bem e do mal,L0105,Padre Eterno,O saber moral é figurado como fruto guardado. A alegoria dá corpo cénico a uma proibição abstracta e torna-a representável num único objecto.,105,105,verificada\nR014,ironia,De nenhum modo comendo dela podereis prigar na vida,L0113,
