<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Eighteenth-century Portuguese nativity plays, analysed with generative AI and with every quotation checked against the manuscript.">
<title>Eighteenth-century nativity plays</title>
  <style>
/* Paleta e variáveis partilhadas pelo portal e pelo dashboard.

   IDENTIDADE E DADOS SÃO DUAS COISAS DIFERENTES, e é essa a decisão que
   estrutura este ficheiro.

   A paleta de identidade — papel quente, ocre, oliveira, castanho e um azul
   pálido — dá ao sítio o seu carácter: fundos, cabeçalhos, acentos, navegação.
   São tons próximos de propósito, e é daí que lhes vem a serenidade.

   Essa proximidade, porém, torna-os inúteis para distinguir séries num gráfico:
   medido com o validador, o ocre e a oliveira ficam a ΔE 1.8 sob deuteranopia e
   a 4.0 mesmo com visão de cor completa — indistinguíveis. As cores de série
   (`--series-*`) são por isso derivadas da mesma família mas afastadas em matiz
   e luminosidade até passarem em todas as verificações: banda de luminosidade,
   piso de croma, separação sob daltonismo, piso de visão normal e contraste
   contra a superfície. Cinco lugares nos dois temas; a partir daí, agrupa-se em
   «outros» ou reparte-se por gráficos pequenos.

   Os valores estão definidos três vezes: na raiz para o tema claro, sob a media
   query para quem tem o sistema em escuro, e sob [data-theme] para o botão de
   tema poder ganhar nos dois sentidos. Tudo o resto se refere a estas variáveis
   por papel, nunca por hexadecimal. */

:root{
  color-scheme: light;

  /* --- identidade ------------------------------------------------------- */
  --marca-azul:     #afcef1;   /* azul pálido: lavagens, realces, estados */
  --marca-salvia:   #adaf95;
  --marca-ocre:     #ae7c34;
  --marca-oliveira: #9b8847;
  --marca-castanho: #845e3d;

  /* --- superfícies e tinta ---------------------------------------------- */
  --plane:          #faf6ef;   /* o papel */
  --surface-1:      #fffdf9;   /* cartões */
  --surface-2:      #f4ece0;   /* faixas e realces suaves */
  --text-primary:   #2a211a;
  --text-secondary: #5a4c40;
  --text-muted:     #7d6c59;
  --grid:           #e8dfd2;
  --axis:           #cbbda9;
  --hairline:       rgba(42,33,26,0.12);

  /* --- acento ----------------------------------------------------------- */
  --accent:         #845e3d;   /* botões, navegação activa, ligações */
  --accent-forte:   #6a4a2f;   /* estado premido */
  --accent-sobre:   #ffffff;   /* texto sobre o acento */
  --accent-lavado:  rgba(132,94,61,0.09);

  /* --- séries de dados (validadas) -------------------------------------- */
  --series-1:#1668a8;   /* azul      */
  --series-2:#c07818;   /* ocre      */
  --series-3:#2f8f6b;   /* verde     */
  --series-4:#7a4bb5;   /* violeta   */
  --series-5:#a83f2a;   /* terracota */

  /* --- rampa sequencial: um só matiz, claro→escuro ---------------------- */
  --seq-0:#f1dcc2; --seq-1:#e1ba89; --seq-2:#d09747; --seq-3:#bf7300;
  --seq-4:#b06500; --seq-5:#9d5900; --seq-6:#794100;

  /* --- estado (reservado; nunca usado como série) ------------------------ */
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;

  /* --- forma e tipo ------------------------------------------------------ */
  --radius: 10px;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
}

@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:          #14110e;
    --surface-1:      #1c1815;
    --surface-2:      #241f1a;
    --text-primary:   #f6f0e7;
    --text-secondary: #cbbda9;
    --text-muted:     #94856f;
    --grid:           #2e2721;
    --axis:           #3d342c;
    --hairline:       rgba(246,240,231,0.13);

    --accent:         #c79a6a;
    --accent-forte:   #d9ae80;
    --accent-sobre:   #1c1815;
    --accent-lavado:  rgba(199,154,106,0.13);

    --series-1:#3f8fd4; --series-2:#c2851f; --series-3:#2f9e72;
    --series-4:#8f7ce0; --series-5:#cf6a4f;

    --seq-0:#794100; --seq-1:#9d5900; --seq-2:#b06500; --seq-3:#bf7300;
    --seq-4:#d09747; --seq-5:#e1ba89; --seq-6:#f1dcc2;
  }
}

:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:          #14110e;
  --surface-1:      #1c1815;
  --surface-2:      #241f1a;
  --text-primary:   #f6f0e7;
  --text-secondary: #cbbda9;
  --text-muted:     #94856f;
  --grid:           #2e2721;
  --axis:           #3d342c;
  --hairline:       rgba(246,240,231,0.13);

  --accent:         #c79a6a;
  --accent-forte:   #d9ae80;
  --accent-sobre:   #1c1815;
  --accent-lavado:  rgba(199,154,106,0.13);

  --series-1:#3f8fd4; --series-2:#c2851f; --series-3:#2f9e72;
  --series-4:#8f7ce0; --series-5:#cf6a4f;

  --seq-0:#794100; --seq-1:#9d5900; --seq-2:#b06500; --seq-3:#bf7300;
  --seq-4:#d09747; --seq-5:#e1ba89; --seq-6:#f1dcc2;
}

/* Folha de estilo do sítio. A paleta vive em tokens.css, inlinado antes desta.

   Duas famílias tipográficas com papéis distintos: uma serifada para títulos e
   texto de leitura, que dá ao sítio o tom editorial de um projecto de
   humanidades; e a sans do sistema para interface, números e tudo o que é dado.
   Nenhuma das duas é descarregada — são fontes que qualquer sistema já tem, o
   que mantém a página inteira a funcionar offline. */

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--plane); color:var(--text-primary);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1060px; margin:0 auto; padding:0 24px}
.hidden{display:none !important}
/* `hidden` tem de vencer o `display` das regras que se seguem — sem isto, um
   botão escondido continua a aparecer, porque `.botao` diz `inline-flex`. */
[hidden]{display:none !important}
.muted{color:var(--text-muted)}
a{color:var(--accent); text-underline-offset:2px}

h1,h2,h3{font-family:var(--serif); font-weight:600; letter-spacing:-0.01em; margin:0}
h1{font-size:clamp(30px,4.2vw,46px); line-height:1.12}
h2{font-size:clamp(21px,2.4vw,27px); line-height:1.2; margin-bottom:8px}
h3{font-size:19px; line-height:1.25}
p{margin:0 0 12px}

.sobretitulo{
  font-family:var(--sans); font-size:12px; font-weight:700;
  letter-spacing:.13em; text-transform:uppercase; color:var(--accent);
  margin:0 0 14px;
}
.chamada{font-size:clamp(17px,1.9vw,20px); line-height:1.5; color:var(--text-secondary); max-width:60ch; margin:0}
.intro{color:var(--text-secondary); max-width:66ch; margin:0 0 22px}

/* ═══════════  botões  ═══════════ */
.botao, button{
  font:inherit; font-size:14.5px; font-family:var(--sans);
  color:var(--text-primary); background:var(--surface-1);
  border:1px solid var(--hairline); border-radius:8px;
  padding:10px 18px; cursor:pointer; text-decoration:none;
  display:inline-flex; align-items:center; gap:8px; min-height:42px;
  transition:border-color .12s, background .12s;
}
.botao:hover, button:hover{border-color:var(--axis)}
.botao.primario{
  background:var(--accent); border-color:var(--accent); color:var(--accent-sobre);
  font-weight:600;
}
.botao.primario:hover{background:var(--accent-forte); border-color:var(--accent-forte)}
.botao.ghost{background:transparent}
.icone{padding:9px 11px; min-height:38px}

/* ═══════════  barra de navegação  ═══════════ */
.topo{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:22px;
  padding:12px 24px;
  background:color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--hairline);
}
.marca{display:flex; align-items:center; gap:11px; text-decoration:none; color:var(--text-primary)}
/* O sinal da marca é a paleta inteira em 22 pixels: o céu, a oliveira, o ocre e
   o castanho da encadernação, nas faixas em que aparecem no resto do sítio. */
.marca-sinal{
  width:22px; height:22px; border-radius:5px; flex:0 0 auto;
  background:linear-gradient(155deg,
    var(--marca-azul) 0 26%, var(--marca-salvia) 26% 46%,
    var(--marca-ocre) 46% 70%, var(--marca-castanho) 70% 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);
}
.marca-nome{font-family:var(--serif); font-size:17.5px; font-weight:600; white-space:nowrap}

.nav{display:flex; gap:2px; flex:1}
.nav a{
  font-size:14.5px; color:var(--text-secondary); text-decoration:none;
  padding:8px 13px; border-radius:7px; white-space:nowrap;
}
.nav a:hover{background:var(--accent-lavado); color:var(--text-primary)}
.nav a.activo{color:var(--accent); background:var(--accent-lavado); font-weight:600}

.controlos{display:flex; align-items:center; gap:8px}
.lingua{display:flex; border:1px solid var(--hairline); border-radius:8px; overflow:hidden}
.lingua button{
  border:0; border-radius:0; min-height:34px; padding:6px 11px;
  font-size:12.5px; font-weight:700; letter-spacing:.04em;
  background:transparent; color:var(--text-muted);
}
.lingua button[aria-pressed="true"]{background:var(--accent); color:var(--accent-sobre)}
.so-estreito{display:none}

/* ═══════════  entrada  ═══════════ */
/* Dois lavados sobre o papel: o azul do céu no canto onde não há texto, o ocre
   por baixo do título. São a paleta da marca no seu lugar próprio — fundo —, e
   por isso podem ser suaves sem terem de passar em nenhum teste de contraste. */
.heroi{
  position:relative; overflow:hidden;
  background:
    radial-gradient(90% 120% at 88% -10%,
      color-mix(in srgb, var(--marca-azul) 42%, transparent) 0%, transparent 62%),
    radial-gradient(120% 140% at 12% 0%, var(--accent-lavado) 0%, transparent 58%),
    linear-gradient(180deg, var(--surface-2) 0%, var(--plane) 100%);
  border-bottom:1px solid var(--hairline);
  padding:64px 0 58px; margin-bottom:44px;
}
.heroi-corpo{max-width:1060px; position:relative}
.heroi h1{max-width:17ch; margin-bottom:18px}
.heroi .chamada, .heroi-texto{max-width:56ch}
.heroi-texto{margin:22px 0 0; max-width:64ch; color:var(--text-secondary); font-size:16.5px}
.heroi-accoes{display:flex; gap:12px; flex-wrap:wrap; margin-top:30px}

/* ═══════════  números  ═══════════ */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:8px}
.tile{
  background:var(--surface-1); border:1px solid var(--hairline);
  border-radius:var(--radius); padding:17px 18px;
}
.tile .lbl{font-size:12.5px; color:var(--text-secondary); line-height:1.35}
.tile .val{font-family:var(--sans); font-size:29px; font-weight:600; letter-spacing:-0.02em; margin-top:5px; line-height:1.1}
.tile .nota{font-size:12px; color:var(--text-muted); margin-top:5px}
.tile.heroi-tile{grid-column:span 2; border-color:color-mix(in srgb, var(--accent) 26%, transparent)}
.tile.heroi-tile .val{font-size:52px; line-height:1.02}

/* ═══════════  blocos e portas  ═══════════ */
.bloco{margin-top:58px}
.bloco.primeiro{margin-top:0}
.bloco.realce{
  background:var(--surface-1); border:1px solid var(--hairline);
  border-radius:14px; padding:30px 32px;
}
.bloco.realce .botao{margin-top:6px}
/* O cabeçalho de secção fecha-se com um fio que vai do ocre ao azul e se
   apaga — a mesma paleta a marcar a divisão, em vez de uma linha cinzenta. */
.cabeca{padding:46px 0 30px; margin-bottom:34px; position:relative}
.cabeca::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:2px;
  background:linear-gradient(90deg,
    var(--marca-ocre) 0%, var(--marca-azul) 34%, var(--grid) 72%, transparent 100%);
  opacity:.8;
}
.cabeca h1{margin-bottom:14px}
.intro.larga{max-width:74ch}

.portas{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px}
.porta{
  position:relative; display:block; text-decoration:none; color:inherit;
  background:var(--surface-1); border:1px solid var(--hairline);
  border-radius:14px; padding:26px 26px 46px;
  transition:border-color .15s, transform .15s;
}
.porta:hover{border-color:var(--accent); transform:translateY(-2px)}
.porta-n{
  font-family:var(--serif); font-size:13px; font-weight:700; color:var(--accent);
  display:block; margin-bottom:12px; letter-spacing:.06em;
}
.porta h3{margin-bottom:8px}
.porta p{color:var(--text-secondary); font-size:14.5px; margin:0}
.porta-seta{position:absolute; right:26px; bottom:22px; color:var(--accent); font-size:19px}

/* ═══════════  peças  ═══════════ */
.pecas{display:grid; gap:18px}
.peca{
  background:var(--surface-1); border:1px solid var(--hairline);
  border-radius:14px; padding:26px 28px;
}
.peca.anunciada{background:transparent; border-style:dashed}
.peca-topo{display:flex; justify-content:space-between; align-items:flex-start; gap:18px}
.peca-topo > div{flex:1; min-width:0}
.peca h3{font-size:22px; margin-bottom:5px}
.peca .genero{font-size:13.5px; color:var(--text-secondary); margin:0}
.peca .proveniencia{font-size:14px; color:var(--text-muted); margin:14px 0 0; max-width:66ch}
.peca .nota{font-size:14.5px; color:var(--text-secondary); margin:14px 0 0; max-width:66ch}

.numeros{display:flex; flex-wrap:wrap; gap:8px 26px; margin:20px 0 0}
.numeros div{display:flex; flex-direction:column}
.numeros b{font-family:var(--sans); font-size:20px; font-weight:600; letter-spacing:-0.01em}
.numeros span{font-size:12px; color:var(--text-muted)}

.accoes{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:22px}
.accoes .quando{font-size:13px; color:var(--text-muted)}

.selo{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; white-space:nowrap}
.selo .marca{font-size:13px}

details{margin-top:18px; border-top:1px solid var(--grid); padding-top:14px}
summary{cursor:pointer; font-size:13.5px; color:var(--text-secondary); font-weight:600; list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "; color:var(--text-muted)}
details[open] summary::before{content:"▾ "}
.versoes{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:2px}
.versoes li{display:flex; justify-content:space-between; gap:12px; padding:8px 10px; border-radius:7px; font-size:13.5px}
.versoes li:hover{background:var(--accent-lavado)}
.versoes .modelo{color:var(--text-muted); font-size:12.5px}

/* ═══════════  listas de conteúdo  ═══════════ */
.passos{margin:0; padding-left:24px; max-width:70ch; counter-reset:none}
.passos li{margin-bottom:14px; color:var(--text-secondary)}
.passos b{color:var(--text-primary)}
.passos.grandes li{margin-bottom:22px; font-size:16.5px}
.limites{margin:0; padding-left:22px; max-width:70ch}
.limites li{margin-bottom:12px; color:var(--text-secondary)}
.limites b{color:var(--text-primary)}

.definicoes, .ficha{display:grid; gap:0; margin:0}
.definicoes > div, .ficha > div{
  display:grid; grid-template-columns:minmax(140px,220px) 1fr; gap:20px;
  padding:16px 0; border-top:1px solid var(--grid);
}
.definicoes dt, .ficha dt{font-weight:600; color:var(--text-primary); margin:0}
.definicoes dd, .ficha dd{margin:0; color:var(--text-secondary)}

.aviso-lingua{
  background:color-mix(in srgb, var(--marca-azul) 30%, var(--surface-1));
  border:1px solid color-mix(in srgb, var(--marca-azul) 55%, transparent);
  border-radius:10px; padding:15px 18px; font-size:14.5px;
  color:var(--text-secondary); margin:0 0 28px; max-width:72ch;
}

/* ═══════════  tabelas e descargas  ═══════════ */
.tabela-esquema{overflow-x:auto; border:1px solid var(--hairline); border-radius:10px}
.tabela-esquema table{border-collapse:collapse; width:100%; font-size:14px; min-width:640px}
.tabela-esquema th,.tabela-esquema td{text-align:left; padding:12px 16px; border-bottom:1px solid var(--grid); vertical-align:top}
.tabela-esquema th{background:var(--surface-2); font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-secondary)}
.tabela-esquema tr:last-child td{border-bottom:0}
.tabela-esquema .colunas{font-family:var(--sans); font-size:12.5px; color:var(--text-muted)}
code{font-size:.92em; background:var(--surface-2); padding:2px 6px; border-radius:5px}

.descargas{display:grid; gap:22px}
.descarga{background:var(--surface-1); border:1px solid var(--hairline); border-radius:14px; padding:22px 26px}
.descarga h3{font-size:18px; margin-bottom:2px}
.descarga .muted{font-size:13px; margin:0 0 14px}
.dados{list-style:none; margin:0; padding:0; display:grid; gap:1px}
.dados li{display:flex; justify-content:space-between; gap:14px; padding:9px 10px; border-radius:7px; font-size:14px}
.dados li:hover{background:var(--accent-lavado)}
.dados .tam{color:var(--text-muted); font-size:12.5px; font-variant-numeric:tabular-nums}

.citar{
  background:var(--surface-2); border:1px solid var(--hairline); border-radius:10px;
  padding:16px 18px; font-size:13.5px; line-height:1.6; white-space:pre-wrap;
  overflow-x:auto; margin:0; color:var(--text-secondary);
}

.vazio{
  border:1px dashed var(--axis); border-radius:12px;
  padding:28px; color:var(--text-secondary); font-size:14.5px;
}
.vazio code{display:block; margin-top:14px; white-space:pre; overflow-x:auto; font-size:12.5px}

/* ═══════════  Tableau  ═══════════ */
.vista{margin:0 0 30px}
.vista figcaption{margin-bottom:14px}
.vista figcaption p{color:var(--text-secondary); font-size:14.5px; margin:6px 0 0; max-width:66ch}
.vista-quadro{
  position:relative; min-height:var(--altura,720px);
  background:var(--surface-1); border:1px solid var(--hairline);
  border-radius:12px; overflow:hidden;
}
.vista-quadro tableau-viz{display:block; width:100%; min-height:var(--altura,720px)}
.tableau-espera{
  position:absolute; inset:0; display:flex; flex-direction:column; gap:8px;
  align-items:center; justify-content:center; text-align:center; padding:30px;
  color:var(--text-muted); font-size:14px; margin:0;
}

/* ═══════════  o quadro da análise  ═══════════ */
.barra-analise{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  background:var(--surface-1); border-bottom:1px solid var(--hairline);
  padding:10px 18px;
}
.barra-analise .voltar{font-weight:600}
.barra-analise .lingua{flex:0 0 auto}
.barra-meta{display:flex; flex-direction:column; line-height:1.3; min-width:0; flex:1}
.barra-meta b{font-family:var(--serif); font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.barra-meta span{font-size:12.5px}
.visualizador{position:relative; background:var(--plane)}
.visualizador iframe{width:100%; height:100%; border:0; display:block; background:var(--plane)}
.recurso{
  position:absolute; left:50%; top:40%; transform:translateX(-50%);
  margin:0; max-width:36ch; text-align:center; font-size:14px;
  color:var(--text-muted); z-index:-1;
}
/* Enquanto uma análise está enquadrada, a página é uma coluna: barra em cima,
   quadro a ocupar o resto — assim a altura não depende de a barra caber numa
   linha, que em ecrãs estreitos não cabe. */
body.enquadrando{overflow:hidden; height:100vh; display:flex; flex-direction:column}
body.enquadrando .topo{display:none}
body.enquadrando .barra-analise{position:static; flex:0 0 auto}
body.enquadrando .visualizador{flex:1 1 auto; min-height:0}

/* ═══════════  rodapé  ═══════════ */
.rodape{margin-top:80px; border-top:1px solid var(--grid); background:var(--surface-2)}
.rodape-corpo{padding:32px 24px; font-size:13.5px; color:var(--text-secondary)}
.rodape-corpo p{max-width:78ch; margin:0 0 6px}

.pagina{padding-bottom:20px}
#pg-home{padding-bottom:0}

/* ═══════════  ecrãs estreitos  ═══════════ */
@media (max-width:860px){
  .topo{flex-wrap:wrap; gap:12px}
  .so-estreito{display:inline-flex}
  .nav{

/* ═══════════  o processo metodológico  ═══════════
   Uma página de leitura longa, não um painel. Duas colunas em ecrã largo — o
   índice fica à vista enquanto se lê — e uma só coluna abaixo dos 900px, onde
   o índice passa a ser um bloco recolhido no topo. */

/* a fita das sete etapas */
.fita{
  display:flex; align-items:stretch; flex-wrap:wrap; gap:6px;
  margin:0 0 46px; padding:16px 18px;
  background:var(--surface-1); border:1px solid var(--hairline); border-radius:14px;
}
.fita .etapa{
  flex:1 1 96px; min-width:96px;
  display:flex; flex-direction:column; gap:2px;
  padding:10px 12px; border-radius:9px;
  text-decoration:none; color:var(--text-secondary);
  border:1px solid transparent; transition:background .12s, border-color .12s;
}
.fita .etapa:hover{background:var(--accent-lavado); color:var(--text-primary)}
.fita .etapa-n{
  font-family:var(--serif); font-size:11.5px; font-weight:700;
  color:var(--marca-ocre); letter-spacing:.08em;
}
.fita .etapa-t{font-size:14px; font-weight:600; color:var(--text-primary); line-height:1.25}
.fita .etapa-nota{font-size:11px; color:var(--text-muted); font-style:italic}
.fita .porta-cotejo{
  background:var(--accent-lavado);
  border-color:color-mix(in srgb, var(--accent) 32%, transparent);
}
.fita .porta-cotejo .etapa-n{color:var(--accent)}
.fita .etapa-seta{
  align-self:center; color:var(--axis); font-size:14px; flex:0 0 auto;
}

/* a grelha da secção */
.metodo{display:grid; grid-template-columns:210px 1fr; gap:52px; align-items:start}

.metodo-indice{position:sticky; top:78px}
.metodo-indice .indice-titulo{
  font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--text-muted); margin:0 0 12px;
}
.metodo-indice ol{
  list-style:none; margin:0; padding:0 0 0 14px;
  border-left:2px solid var(--grid); counter-reset:fase;
}
.metodo-indice li{counter-increment:fase; margin-bottom:9px}
.metodo-indice a{
  display:block; font-size:13px; line-height:1.35;
  color:var(--text-secondary); text-decoration:none;
}
.metodo-indice a::before{
  content:counter(fase, decimal-leading-zero) " ";
  color:var(--text-muted); font-variant-numeric:tabular-nums; font-size:11.5px;
}
.metodo-indice a:hover{color:var(--accent)}

/* cada fase */
.metodo-corpo{max-width:72ch}
.metodo-fase{
  padding:0 0 44px; margin-bottom:44px; border-bottom:1px solid var(--grid);
  scroll-margin-top:86px;   /* a barra do topo é fixa e taparia o título */
}
.metodo-fase:last-child{border-bottom:0; margin-bottom:0}
.metodo-fase > header{margin-bottom:20px}
.metodo-fase .fase-n{
  font-family:var(--serif); font-size:12.5px; font-weight:700; letter-spacing:.14em;
  color:var(--marca-ocre); display:block; margin-bottom:8px;
}
.metodo-fase h2{margin-bottom:8px}
.metodo-fase .fase-resumo{
  font-size:16px; color:var(--text-secondary); font-family:var(--serif);
  font-style:italic; margin:0; max-width:62ch;
}
.metodo-fase p{font-size:16px; line-height:1.68; margin:0 0 15px}
.metodo-fase code{font-size:.88em}

/* a fase do cotejo é a única assinalada: é a que pode reprovar as anteriores */
.metodo-fase.chave > header{
  border-left:3px solid var(--accent); padding-left:18px; margin-left:-21px;
}

.metodo-lista{margin:26px 0 6px}
.metodo-lista h3{font-size:16px; margin-bottom:2px}
.metodo-lista .definicoes > div{grid-template-columns:minmax(150px,230px) 1fr; padding:14px 0}
.metodo-lista dd{font-size:15px; line-height:1.6}

.contraste{margin:28px 0 8px}
.contraste h3{font-size:16px; margin-bottom:14px}
.contraste-par{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.contraste .lado{
  background:var(--surface-1); border:1px solid var(--hairline);
  border-radius:12px; padding:18px 20px;
}
.contraste .lado h4{
  margin:0 0 8px; font-family:var(--sans); font-size:12px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
}
.contraste .lado p{font-size:14.5px; line-height:1.6; margin:0; color:var(--text-secondary)}
.contraste .sim{border-left:3px solid var(--good)}
.contraste .sim h4{color:var(--good)}
.contraste .nao{border-left:3px solid var(--serious)}
.contraste .nao h4{color:var(--serious)}

.metodo-nota{
  margin:24px 0 8px; padding:16px 20px; border-radius:12px;
  background:color-mix(in srgb, var(--marca-azul) 26%, var(--surface-1));
  border:1px solid color-mix(in srgb, var(--marca-azul) 50%, transparent);
  font-size:14.5px; line-height:1.6; color:var(--text-secondary);
}
.metodo-nota b{color:var(--text-primary)}

.metodo-ligacao{margin:20px 0 0; font-size:14.5px}
.metodo-ligacao a{font-weight:600; text-decoration:none}
.metodo-ligacao a:hover{text-decoration:underline}

@media (max-width:900px){
  .metodo{grid-template-columns:1fr; gap:30px}
  .metodo-indice{
    position:static; background:var(--surface-1); border:1px solid var(--hairline);
    border-radius:12px; padding:16px 18px;
  }
  .metodo-indice ol{
    border-left:0; padding:0; columns:2; column-gap:24px;
  }
  .metodo-fase.chave > header{margin-left:0}
  .contraste-par{grid-template-columns:1fr}
}
@media (max-width:560px){
  .metodo-indice ol{columns:1}
  .fita{padding:12px}
  .fita .etapa-seta{display:none}
}
@media print{
  .fita,.metodo-indice{display:none !important}
  .metodo{grid-template-columns:1fr}
  .metodo-fase{break-inside:avoid}
}

<script id="dados" type="application/json">{"projecto":{"titulo":{"en":"Eighteenth-century nativity plays","pt":"Presépios teatrais setecentistas"},"subtitulo":{"en":"Nativity plays performed in Évora and Lisbon, with every quotation checked against the original manuscript.","pt":"Análise de autos de Natal representados em Évora e em Lisboa, com cada citação verificada contra o manuscrito original."},"descricao":{"en":"Eighteenth-century nativity plays are Christmas autos built from self-contained episodes, alternating biblical scenes in verse with comic interludes in prose. They survive in manuscript copies of unstable spelling and have rarely been studied in full. This project systematises them play by play — characters, relations, vernacular and rhetorical figures — and publishes the data behind every reading.","pt":"Os presépios teatrais do século XVIII são autos de Natal compostos por passos autónomos, que alternam o registo bíblico em verso com entremezes cómicos em prosa. Sobreviveram em cópias manuscritas de grafia instável, e raramente foram estudados na sua totalidade. Este projecto sistematiza-os peça a peça — personagens, relações, vernáculo e recursos expressivos — e publica os dados que sustentam cada leitura."},"instituicao":"","autoria":"","repositorio":"","contacto":"","como_citar":"","licenca":"GPL-3.0-or-later"},"tableau":[{"url":"https://public.tableau.com/views/Comparao_Gemini_1_2/Planilha1","pagina":"https://public.tableau.com/app/profile/jo.o.pedro.oliveira/viz/Comparao_Gemini_1_2/Planilha1","titulo":{"en":"Comparison between model runs","pt":"Comparação entre execuções do modelo"},"descricao":{"en":"The same play analysed more than once. Where two runs agree and where they diverge is the project's central question made visible.","pt":"A mesma peça analisada mais do que uma vez. Onde duas execuções concordam e onde divergem é a pergunta central do projecto tornada visível."},"altura":720}],"pecas":[{"titulo":"Presépio da Graça","slug":"presepio-da-graca","datacao":{"en":"1779 — licences of 27 January 1779; text from an earlier repertory","pt":"1779 — licenças de 27 de Janeiro de 1779; texto de repertório anterior"},"proveniencia":{"en":"Petitions to the Holy Office and to the Real Mesa Censória with the play annexed; Teatro da Calçada da Graça, Lisbon, under the impresario Henrique da Costa Passos. Transcribed without emendation, keeping the line breaks of the manuscript.","pt":"Requerimentos ao Santo Ofício e à Real Mesa Censória com o papel anexo; Teatro da Calçada da Graça, Lisboa, empresário Henrique da Costa Passos. Transcrição sem revisões, com quebras de linha do manuscrito conservadas."},"genero":{"en":"nativity play — a Christmas auto in episodes, with comic interludes","pt":"presépio teatral — auto de Natal por passos, com entremezes intercalados"},"nota":"","estado":"analisada","analises":[{"pasta":"presepio-da-graca","dashboard":"presepio-da-graca/presepio-da-graca-dashboard.html","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Presépio da Graça\u003c/title>\n  \u003cstyle>\n/* Paleta e variáveis partilhadas pelo portal e pelo dashboard.\n\n   IDENTIDADE E DADOS SÃO DUAS COISAS DIFERENTES, e é essa a decisão que\n   estrutura este ficheiro.\n\n   A paleta de identidade — papel quente, ocre, oliveira, castanho e um azul\n   pálido — dá ao sítio o seu carácter: fundos, cabeçalhos, acentos, navegação.\n   São tons próximos de propósito, e é daí que lhes vem a serenidade.\n\n   Essa proximidade, porém, torna-os inúteis para distinguir séries num gráfico:\n   medido com o validador, o ocre e a oliveira ficam a ΔE 1.8 sob deuteranopia e\n   a 4.0 mesmo com visão de cor completa — indistinguíveis. As cores de série\n   (`--series-*`) são por isso derivadas da mesma família mas afastadas em matiz\n   e luminosidade até passarem em todas as verificações: banda de luminosidade,\n   piso de croma, separação sob daltonismo, piso de visão normal e contraste\n   contra a superfície. Cinco lugares nos dois temas; a partir daí, agrupa-se em\n   «outros» ou reparte-se por gráficos pequenos.\n\n   Os valores estão definidos três vezes: na raiz para o tema claro, sob a media\n   query para quem tem o sistema em escuro, e sob [data-theme] para o botão de\n   tema poder ganhar nos dois sentidos. Tudo o resto se refere a estas variáveis\n   por papel, nunca por hexadecimal. */\n\n:root{\n  color-scheme: light;\n\n  /* --- identidade ------------------------------------------------------- */\n  --marca-azul:     #afcef1;   /* azul pálido: lavagens, realces, estados */\n  --marca-salvia:   #adaf95;\n  --marca-ocre:     #ae7c34;\n  --marca-oliveira: #9b8847;\n  --marca-castanho: #845e3d;\n\n  /* --- superfícies e tinta ---------------------------------------------- */\n  --plane:          #faf6ef;   /* o papel */\n  --surface-1:      #fffdf9;   /* cartões */\n  --surface-2:      #f4ece0;   /* faixas e realces suaves */\n  --text-primary:   #2a211a;\n  --text-secondary: #5a4c40;\n  --text-muted:     #7d6c59;\n  --grid:           #e8dfd2;\n  --axis:           #cbbda9;\n  --hairline:       rgba(42,33,26,0.12);\n\n  /* --- acento ----------------------------------------------------------- */\n  --accent:         #845e3d;   /* botões, navegação activa, ligações */\n  --accent-forte:   #6a4a2f;   /* estado premido */\n  --accent-sobre:   #ffffff;   /* texto sobre o acento */\n  --accent-lavado:  rgba(132,94,61,0.09);\n\n  /* --- séries de dados (validadas) -------------------------------------- */\n  --series-1:#1668a8;   /* azul      */\n  --series-2:#c07818;   /* ocre      */\n  --series-3:#2f8f6b;   /* verde     */\n  --series-4:#7a4bb5;   /* violeta   */\n  --series-5:#a83f2a;   /* terracota */\n\n  /* --- rampa sequencial: um só matiz, claro→escuro ---------------------- */\n  --seq-0:#f1dcc2; --seq-1:#e1ba89; --seq-2:#d09747; --seq-3:#bf7300;\n  --seq-4:#b06500; --seq-5:#9d5900; --seq-6:#794100;\n\n  /* --- estado (reservado; nunca usado como série) ------------------------ */\n  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;\n\n  /* --- forma e tipo ------------------------------------------------------ */\n  --radius: 10px;\n  --sans: system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --serif: Georgia, \"Iowan Old Style\", \"Palatino Linotype\", Palatino, \"Times New Roman\", serif;\n}\n\n@media (prefers-color-scheme: dark){\n  :root:where(:not([data-theme=\"light\"])){\n    color-scheme: dark;\n    --plane:          #14110e;\n    --surface-1:      #1c1815;\n    --surface-2:      #241f1a;\n    --text-primary:   #f6f0e7;\n    --text-secondary: #cbbda9;\n    --text-muted:     #94856f;\n    --grid:           #2e2721;\n    --axis:           #3d342c;\n    --hairline:       rgba(246,240,231,0.13);\n\n    --accent:         #c79a6a;\n    --accent-forte:   #d9ae80;\n    --accent-sobre:   #1c1815;\n    --accent-lavado:  rgba(199,154,106,0.13);\n\n    --series-1:#3f8fd4; --series-2:#c2851f; --series-3:#2f9e72;\n    --series-4:#8f7ce0; --series-5:#cf6a4f;\n\n    --seq-0:#794100; --seq-1:#9d5900; --seq-2:#b06500; --seq-3:#bf7300;\n    --seq-4:#d09747; --seq-5:#e1ba89; --seq-6:#f1dcc2;\n  }\n}\n\n:root[data-theme=\"dark\"]{\n  color-scheme: dark;\n  --plane:          #14110e;\n  --surface-1:      #1c1815;\n  --surface-2:      #241f1a;\n  --text-primary:   #f6f0e7;\n  --text-secondary: #cbbda9;\n  --text-muted:     #94856f;\n  --grid:           #2e2721;\n  --axis:           #3d342c;\n  --hairline:       rgba(246,240,231,0.13);\n\n  --accent:         #c79a6a;\n  --accent-forte:   #d9ae80;\n  --accent-sobre:   #1c1815;\n  --accent-lavado:  rgba(199,154,106,0.13);\n\n  --series-1:#3f8fd4; --series-2:#c2851f; --series-3:#2f9e72;\n  --series-4:#8f7ce0; --series-5:#cf6a4f;\n\n  --seq-0:#794100; --seq-1:#9d5900; --seq-2:#b06500; --seq-3:#bf7300;\n  --seq-4:#d09747; --seq-5:#e1ba89; --seq-6:#f1dcc2;\n}\n\n/* Folha de estilo do dashboard. As variáveis de cor vivem em tokens.css, que\n   é inlinado antes desta. */\n\n*{box-sizing:border-box}\nbody{\n  margin:0; background:var(--plane); color:var(--text-primary);\n  font-family:var(--sans); font-size:15px; line-height:1.55;\n  -webkit-font-smoothing:antialiased;\n}\n.wrap{max-width:1180px; margin:0 auto; padding:28px 20px 80px}\n/* Os títulos são serifados como no resto do sítio — a análise não é uma\n   aplicação à parte, é uma página do mesmo projecto. Números, rótulos de\n   gráfico e tabelas ficam na sans, que os alinha melhor. */\nh1{font-family:var(--serif); font-size:30px; line-height:1.2; margin:0 0 6px;\n   font-weight:600; letter-spacing:-0.01em}\nh2{font-family:var(--serif); font-size:19px; margin:0 0 2px; font-weight:600; letter-spacing:-0.005em}\nh3{font-size:13px; margin:0 0 14px; font-weight:500; color:var(--text-secondary)}\np{margin:0 0 10px}\na{color:var(--accent)}\n.sub{color:var(--text-secondary); font-size:13.5px; margin:0}\n.muted{color:var(--text-muted)}\n\n/* ---------- cabeçalho ---------- */\nheader.top{display:flex; gap:18px; align-items:flex-start; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap}\n.meta-list{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; color:var(--text-secondary); margin-top:8px}\n.meta-list b{font-weight:600; color:var(--text-primary)}\nbutton, select, input[type=search]{\n  font:inherit; font-size:13px; color:var(--text-primary); background:var(--surface-1);\n  border:1px solid var(--hairline); border-radius:8px; padding:7px 11px; cursor:pointer;\n  min-height:34px;\n}\ninput[type=search]{cursor:text; min-width:190px}\nbutton:hover, select:hover{border-color:var(--axis)}\nbutton.ghost{background:transparent}\nbutton[aria-pressed=\"true\"]{background:var(--accent); border-color:var(--accent); color:var(--accent-sobre)}\n\n/* selector de língua, gémeo do que o sítio tem no cabeçalho */\n.acts-topo{display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap}\n.lingua{display:flex; border:1px solid var(--hairline); border-radius:8px; overflow:hidden; height:34px}\n.lingua button{\n  border:0; border-radius:0; min-height:32px; padding:5px 10px;\n  font-size:12px; font-weight:700; letter-spacing:.04em;\n  background:transparent; color:var(--text-muted);\n}\n.lingua button[aria-pressed=\"true\"]{background:var(--accent); color:var(--accent-sobre)}\n\n/* ---------- cartões ---------- */\n.grid{display:grid; gap:16px}\n.card{\n  background:var(--surface-1); border:1px solid var(--hairline);\n  border-radius:var(--radius); padding:18px 18px 16px;\n}\n.card header{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px}\n.card header .acts{display:flex; gap:6px; flex-shrink:0}\n.card header .acts button{padding:5px 9px; min-height:0; font-size:12px}\n\n/* ---------- tiles ---------- */\n.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px}\n.tile{background:var(--surface-1); border:1px solid var(--hairline); border-radius:var(--radius); padding:14px 16px}\n.tile .lbl{font-size:12.5px; color:var(--text-secondary)}\n.tile .val{font-size:27px; font-weight:600; letter-spacing:-0.02em; margin-top:2px}\n.tile.hero .val{font-size:52px; line-height:1.05; margin-top:4px}\n.tile .note{font-size:12px; color:var(--text-muted); margin-top:2px}\n.badge{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600}\n.badge .dot{width:9px; height:9px; border-radius:50%; display:inline-block}\n\n/* ---------- filtros ---------- */\n.filters{\n  display:flex; flex-wrap:wrap; gap:8px; align-items:center;\n  background:var(--surface-1); border:1px solid var(--hairline);\n  border-radius:var(--radius); padding:10px 12px; margin-bottom:16px;\n}\n.filters .lbl{font-size:12px; color:var(--text-muted); margin-right:2px}\n.filters .spacer{flex:1}\n.chip{\n  display:inline-flex; align-items:center; gap:6px; font-size:12px;\n  border:1px solid var(--hairline); border-radius:999px; padding:4px 10px; background:transparent;\n}\n\n/* ---------- gráficos ---------- */\nsvg{display:block; width:100%; height:auto; overflow:visible}\n.tick{fill:var(--text-muted); font-size:11px}\n.lbl-mark{fill:var(--text-secondary); font-size:11.5px}\n.val-mark{fill:var(--text-secondary); font-size:11.5px; font-weight:600}\n.gridline{stroke:var(--grid); stroke-width:1}\n.axisline{stroke:var(--axis); stroke-width:1}\n.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--text-secondary); margin-top:12px}\n.legend .key{display:inline-flex; align-items:center; gap:6px}\n.legend .swatch{width:11px; height:11px; border-radius:3px; display:inline-block}\n.scale{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-muted); margin-top:10px}\n.scale .steps{display:flex}\n.scale .steps i{width:22px; height:10px; display:block}\n\n/* ---------- tabelas ---------- */\n.tbl-wrap{overflow:auto; max-height:460px; border:1px solid var(--hairline); border-radius:8px}\ntable{border-collapse:collapse; width:100%; font-size:13px}\nth,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--grid); vertical-align:top}\nth{position:sticky; top:0; background:var(--surface-1); font-weight:600; font-size:12px;\n   color:var(--text-secondary); z-index:1; white-space:nowrap; cursor:pointer}\nth:after{content:\"\"; }\ntbody tr:hover{background:var(--accent-lavado)}\ntd.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}\ntd.loc{white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--text-secondary)}\n.cit{font-style:italic}\n.hidden{display:none !important}\n[hidden]{display:none !important}\n\n/* ---------- tooltip ---------- */\n#tip{\n  position:fixed; pointer-events:none; z-index:50; max-width:330px;\n  background:var(--surface-1); color:var(--text-primary);\n  border:1px solid var(--hairline); border-radius:8px; padding:9px 11px;\n  font-size:12.5px; line-height:1.45; box-shadow:0 6px 22px rgba(0,0,0,.16);\n  opacity:0; transition:opacity .1s;\n}\n#tip b{display:block; margin-bottom:3px}\n#tip .q{font-style:italic; color:var(--text-secondary)}\n\n/* ---------- prosa ---------- */\n.prosa{font-size:14.5px; max-width:74ch}\n.prosa h1,.prosa h2,.prosa h3,.prosa h4{margin:18px 0 8px; font-size:15px}\n.prosa ul{padding-left:20px; margin:0 0 12px}\n.prosa code{background:var(--plane); padding:1px 5px; border-radius:4px; font-size:12.5px}\ndetails{border-top:1px solid var(--grid); padding:12px 0}\ndetails summary{cursor:pointer; font-weight:600; font-size:14px}\n.aviso-list{margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--text-secondary)}\nfooter{margin-top:34px; padding-top:16px; border-top:1px solid var(--grid);\n       font-size:12px; color:var(--text-muted)}\n@media print{\n  body{background:#fff}\n  .filters,.card header .acts,.acts-topo,button{display:none !important}\n  .card{break-inside:avoid}\n}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n\n\u003cheader class=\"top\">\n  \u003cdiv>\n    \u003ch1 id=\"titulo\">\u003c/h1>\n    \u003cp class=\"sub\" id=\"subtitulo\">\u003c/p>\n    \u003cdiv class=\"meta-list\" id=\"meta\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"acts-topo\">\n    \u003cdiv class=\"lingua\" role=\"group\" aria-label=\"Language\">\n      \u003cbutton type=\"button\" data-lingua=\"en\">EN\u003c/button>\n      \u003cbutton type=\"button\" data-lingua=\"pt\">PT\u003c/button>\n    \u003c/div>\n    \u003cbutton id=\"tema\" class=\"ghost\" data-t-title=\"botao.temaDica\" data-t=\"botao.tema\">\u003c/button>\n    \u003cbutton id=\"imprimir\" class=\"ghost\" data-t=\"botao.imprimir\">\u003c/button>\n  \u003c/div>\n\u003c/header>\n\n\u003csection class=\"tiles\" id=\"tiles\">\u003c/section>\n\n\u003cdiv class=\"filters\" role=\"group\" data-t-aria=\"filtro.grupo\">\n  \u003cspan class=\"lbl\" data-t=\"filtro.rotulo\">\u003c/span>\n  \u003cselect id=\"f-personagem\" data-t-aria=\"filtro.arPersonagem\">\n    \u003coption value=\"\" data-t=\"filtro.personagens\">\u003c/option>\u003c/select>\n  \u003cselect id=\"f-tipo\" data-t-aria=\"filtro.arTipo\">\n    \u003coption value=\"\" data-t=\"filtro.recursos\">\u003c/option>\u003c/select>\n  \u003cselect id=\"f-relacao\" data-t-aria=\"filtro.arRelacao\">\n    \u003coption value=\"\" data-t=\"filtro.relacoes\">\u003c/option>\u003c/select>\n  \u003cselect id=\"f-certeza\" data-t-aria=\"filtro.arCerteza\">\n    \u003coption value=\"\" data-t=\"filtro.graus\">\u003c/option>\u003c/select>\n  \u003cinput type=\"search\" id=\"f-texto\" data-t-ph=\"filtro.pesquisa\" data-t-aria=\"filtro.arTexto\">\n  \u003cspan class=\"spacer\">\u003c/span>\n  \u003cspan class=\"chip\" id=\"contador\">\u003c/span>\n  \u003cbutton id=\"limpar\" class=\"ghost\" data-t=\"botao.limpar\">\u003c/button>\n\u003c/div>\n\n\u003csection class=\"grid\" style=\"grid-template-columns:repeat(auto-fit,minmax(430px,1fr))\">\n  \u003cdiv class=\"card\" id=\"card-freq\">\n    \u003cheader>\n      \u003cdiv>\u003ch2 data-t=\"card.freq\">\u003c/h2>\u003ch3 data-t=\"card.freqSub\">\u003c/h3>\u003c/div>\n      \u003cdiv class=\"acts\">\n        \u003cbutton data-view=\"chart\" aria-pressed=\"true\" data-t=\"botao.grafico\">\u003c/button>\n        \u003cbutton data-view=\"table\" aria-pressed=\"false\" data-t=\"botao.tabela\">\u003c/button>\n        \u003cbutton data-svg=\"freq\" class=\"ghost\" data-t-title=\"botao.svgDica\">SVG\u003c/button>\n      \u003c/div>\n    \u003c/header>\n    \u003cdiv class=\"view-chart\">\u003csvg id=\"svg-freq\" role=\"img\" data-t-aria=\"card.freqAria\">\u003c/svg>\u003c/div>\n    \u003cdiv class=\"view-table hidden\" id=\"tbl-freq\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\" id=\"card-vern\">\n    \u003cheader>\n      \u003cdiv>\u003ch2 data-t=\"card.vern\">\u003c/h2>\u003ch3 data-t=\"card.vernSub\">\u003c/h3>\u003c/div>\n      \u003cdiv class=\"acts\">\n        \u003cbutton data-view=\"chart\" aria-pressed=\"true\" data-t=\"botao.grafico\">\u003c/button>\n        \u003cbutton data-view=\"table\" aria-pressed=\"false\" data-t=\"botao.tabela\">\u003c/button>\n        \u003cbutton data-svg=\"vern\" class=\"ghost\" data-t-title=\"botao.svgDica\">SVG\u003c/button>\n      \u003c/div>\n    \u003c/header>\n    \u003cdiv class=\"view-chart\">\u003csvg id=\"svg-vern\" role=\"img\" data-t-aria=\"card.vernAria\">\u003c/svg>\u003c/div>\n    \u003cdiv class=\"view-table hidden\" id=\"tbl-vern\">\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"grid\" style=\"margin-top:16px\">\n  \u003cdiv class=\"card\" id=\"card-heat\">\n    \u003cheader>\n      \u003cdiv>\u003ch2 data-t=\"card.heat\">\u003c/h2>\u003ch3 data-t=\"card.heatSub\">\u003c/h3>\u003c/div>\n      \u003cdiv class=\"acts\">\n        \u003cbutton data-view=\"chart\" aria-pressed=\"true\" data-t=\"botao.mapa\">\u003c/button>\n        \u003cbutton data-view=\"table\" aria-pressed=\"false\" data-t=\"botao.tabela\">\u003c/button>\n        \u003cbutton data-svg=\"heat\" class=\"ghost\" data-t-title=\"botao.svgDica\">SVG\u003c/button>\n      \u003c/div>\n    \u003c/header>\n    \u003cdiv class=\"view-chart\">\n      \u003csvg id=\"svg-heat\" role=\"img\" data-t-aria=\"card.heatAria\">\u003c/svg>\n      \u003cdiv class=\"scale\" id=\"escala-heat\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"view-table hidden\" id=\"tbl-heat\">\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"grid\" style=\"margin-top:16px\">\n  \u003cdiv class=\"card\" id=\"card-rede\">\n    \u003cheader>\n      \u003cdiv>\u003ch2 data-t=\"card.rede\">\u003c/h2>\u003ch3 data-t=\"card.redeSub\">\u003c/h3>\u003c/div>\n      \u003cdiv class=\"acts\">\n        \u003cbutton data-view=\"chart\" aria-pressed=\"true\" data-t=\"botao.grafo\">\u003c/button>\n        \u003cbutton data-view=\"table\" aria-pressed=\"false\" data-t=\"botao.tabela\">\u003c/button>\n        \u003cbutton data-svg=\"rede\" class=\"ghost\" data-t-title=\"botao.svgDica\">SVG\u003c/button>\n      \u003c/div>\n    \u003c/header>\n    \u003cdiv class=\"view-chart\">\n      \u003csvg id=\"svg-rede\" role=\"img\" data-t-aria=\"card.redeAria\">\u003c/svg>\n      \u003cdiv class=\"legend\" id=\"leg-rede\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"view-table hidden\" id=\"tbl-rede\">\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"grid\" style=\"margin-top:16px\">\n  \u003cdiv class=\"card\">\n    \u003cheader>\u003cdiv>\u003ch2 data-t=\"card.recursos\">\u003c/h2>\u003ch3 data-t=\"card.recursosSub\">\u003c/h3>\u003c/div>\n      \u003cdiv class=\"acts\">\u003cbutton data-csv=\"recursos\" class=\"ghost\">CSV\u003c/button>\u003c/div>\n    \u003c/header>\n    \u003cdiv id=\"tbl-recursos\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\">\n    \u003cheader>\u003cdiv>\u003ch2 data-t=\"card.pers\">\u003c/h2>\u003ch3 data-t=\"card.persSub\">\u003c/h3>\u003c/div>\n      \u003cdiv class=\"acts\">\u003cbutton data-csv=\"personagens\" class=\"ghost\">CSV\u003c/button>\u003c/div>\n    \u003c/header>\n    \u003cdiv id=\"tbl-pers\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\">\n    \u003cheader>\u003cdiv>\u003ch2 data-t=\"card.vernTab\">\u003c/h2>\u003ch3 data-t=\"card.vernTabSub\">\u003c/h3>\u003c/div>\n      \u003cdiv class=\"acts\">\u003cbutton data-csv=\"vernaculo\" class=\"ghost\">CSV\u003c/button>\u003c/div>\n    \u003c/header>\n    \u003cdiv id=\"tbl-vernaculo\">\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"card\" style=\"margin-top:16px\">\n  \u003ch2 data-t=\"card.prosa\">\u003c/h2>\n  \u003ch3 data-t=\"card.prosaSub\">\u003c/h3>\n  \u003cdiv id=\"prosa\">\u003c/div>\n\u003c/section>\n\n\u003csection class=\"card\" style=\"margin-top:16px\">\n  \u003ch2 data-t=\"card.limites\">\u003c/h2>\n  \u003ch3 data-t=\"card.limitesSub\">\u003c/h3>\n  \u003cdiv id=\"limitacoes\" class=\"prosa\">\u003c/div>\n  \u003cdiv id=\"validacao\">\u003c/div>\n\u003c/section>\n\n\u003cfooter id=\"rodape\">\u003c/footer>\n\u003c/div>\n\n\u003cdiv id=\"tip\" role=\"tooltip\">\u003c/div>\n\u003cscript id=\"dados\" type=\"application/json\">{\"meta\":{\"titulo\":\"Presépio da Graça\",\"datacao\":\"1779 — licenças de 27 de Janeiro de 1779; texto de repertório anterior\",\"proveniencia\":\"Requerimentos ao Santo Ofício e à Real Mesa Censória com o papel anexo; Teatro da Calçada da Graça, Lisboa, empresário Henrique da Costa Passos. Transcrição sem revisões, com quebras de linha do manuscrito conservadas.\\n\",\"genero\":\"presépio teatral — auto de Natal por passos, com entremezes intercalados\",\"slug\":\"presepio-da-graca\",\"data_execucao\":\"2026-08-25 13:47\",\"modelo\":\"\",\"ficheiro\":\"presepio_graca.txt\",\"n_linhas\":1188},\"metricas\":{\"citacoes_testadas\":145,\"citacoes_verificadas\":145,\"citacoes_deslocadas\":0,\"citacoes_nao_encontradas\":0,\"citacoes_sem_localizacao\":0,\"citacoes_verificadas_pct\":100.0,\"n_recursos\":145,\"n_tipos_recurso\":15,\"n_personagens\":35,\"n_relacoes\":63,\"n_vernaculo\":45,\"n_tipos_relacao\":10,\"n_linhas_peca\":1188,\"densidade_recursos_por_100_linhas\":12.21},\"recursos\":[{\"id\":\"R001\",\"tipo_recurso\":\"anáfora\",\"citacao\":\"Eu não sou a quem a devidade in tempore formou, aos mais unidos, eu não sou o maior dos escolhidos\",\"localizacao\":\"L0027-L0029\",\"personagem\":\"Luzbel\",\"interpretacao\":\"A soberba formula-se por negação repetida: Luzbel define-se recusando o lugar que lhe foi dado. A anáfora instala desde o primeiro verso o tema da comparação com o alto que atravessa toda a peça.\",\"verificacao\":\"verificada\",\"linha\":\"27\"},{\"id\":\"R002\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"ao sólio subirei no mesmo instante ocupando da glória o sacro assento\",\"localizacao\":\"L0039-L0040\",\"personagem\":\"Luzbel\",\"interpretacao\":\"A instantaneidade («no mesmo instante») mede a desmedida: a usurpação é imaginada sem processo nem mediação, o que a torna teologicamente absurda antes de ser punida.\",\"verificacao\":\"verificada\",\"linha\":\"39\"},{\"id\":\"R003\",\"tipo_recurso\":\"comparação\",\"citacao\":\"para em tudo ficar seu similante\",\"localizacao\":\"L0041\",\"personagem\":\"Luzbel\",\"interpretacao\":\"Semelhança pretendida por conquista. Ecoa por antecipação a semelhança concedida a Adão em L0092, invertendo-lhe o sinal: o que é dom na criatura é roubo no anjo.\",\"verificacao\":\"verificada\",\"linha\":\"41\"},{\"id\":\"R004\",\"tipo_recurso\":\"apóstrofe\",\"citacao\":\"Suspende o temerário pensameNto\",\"localizacao\":\"L0045\",\"personagem\":\"São Miguel\",\"interpretacao\":\"O soneto de resposta abre com imperativo directo, sem exórdio. A justiça divina é encenada como interrupção, não como argumento.\",\"verificacao\":\"verificada\",\"linha\":\"45\"},{\"id\":\"R005\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"desde já te sepulta no tromento\",\"localizacao\":\"L0048\",\"personagem\":\"São Miguel\",\"interpretacao\":\"Sepultura aplicada a um ser incorpóreo: a pena espiritual é dita em vocabulário funerário para se tornar representável em cena.\",\"verificacao\":\"verificada\",\"linha\":\"48\"},{\"id\":\"R006\",\"tipo_recurso\":\"antítese\",\"citacao\":\"e no horrendo lugar da escuridade fromará em prepétuo o teu assento\",\"localizacao\":\"L0052-L0053\",\"personagem\":\"São Miguel\",\"interpretacao\":\"Contraponto exacto ao «sacro assento» de L0040. A mesma palavra ocupa os dois extremos do eixo alto/baixo que organiza o auto.\",\"verificacao\":\"verificada\",\"linha\":\"52\"},{\"id\":\"R007\",\"tipo_recurso\":\"personificação\",\"citacao\":\"e as entranhas da terra feia e escura sepulte para sempre esse maldito\",\"localizacao\":\"L0060-L0061\",\"personagem\":\"São Miguel\",\"interpretacao\":\"A terra ganha entranhas e vontade punitiva. Prepara a terra hostil de Caim (L0248) e a terra regada de lágrimas de Adão (L0162).\",\"verificacao\":\"verificada\",\"linha\":\"60\"},{\"id\":\"R008\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"Desterrem-se as trevas que em sombras revestem a orbe\",\"localizacao\":\"L0065\",\"personagem\":\"Padre Eterno\",\"interpretacao\":\"Criação dita em vocabulário jurídico-político: o desterro é pena de degredo. A ordem do mundo é imaginada como acto de soberania régia.\",\"verificacao\":\"verificada\",\"linha\":\"65\"},{\"id\":\"R009\",\"tipo_recurso\":\"anáfora\",\"citacao\":\"Produza a terra todas as plantas e árvores... Produza o mar a competente criação de toda a diversidade de peixes... Produzam-se todos os animais segundo a ordem natural\",\"localizacao\":\"L0082-L0087\",\"personagem\":\"Padre Eterno\",\"interpretacao\":\"A repetição do verbo escande a sequência criadora e serve de deixa às mutações de cenário anunciadas nas didascálias, articulando retórica e tramoia.\",\"verificacao\":\"verificada\",\"linha\":\"82\"},{\"id\":\"R010\",\"tipo_recurso\":\"comparação\",\"citacao\":\"façamos o homem à nossa imagem e semelhança\",\"localizacao\":\"L0092\",\"personagem\":\"Padre Eterno\",\"interpretacao\":\"Fórmula bíblica conservada intacta; funciona como termo de comparação estruturante a que Luzbel (L0041) e, mais tarde, a soberba de Olofernes se opõem.\",\"verificacao\":\"verificada\",\"linha\":\"92\"},{\"id\":\"R011\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"Na tua face deposito uma espiritual essência da vida\",\"localizacao\":\"L0097\",\"personagem\":\"Padre Eterno\",\"interpretacao\":\"O sopro divino é dito como depósito — termo de guarda e de confiança, que implica devolução e prepara a lógica do preceito.\",\"verificacao\":\"verificada\",\"linha\":\"97\"},{\"id\":\"R012\",\"tipo_recurso\":\"comparação\",\"citacao\":\"façamos um adjutório semelhante a ele\",\"localizacao\":\"L0100\",\"personagem\":\"Padre Eterno\",\"interpretacao\":\"Eva é introduzida por semelhança e subordinação simultâneas; o termo «adjutório» fixa desde a criação a hierarquia que a sentença de L0132 tornará explícita.\",\"verificacao\":\"verificada\",\"linha\":\"100\"},{\"id\":\"R013\",\"tipo_recurso\":\"alegoria\",\"citacao\":\"esta é a Árvore da ciência onde donde oculto o conhicimento do bem e do mal\",\"localizacao\":\"L0105\",\"personagem\":\"Padre Eterno\",\"interpretacao\":\"O saber moral é figurado como fruto guardado. A alegoria dá corpo cénico a uma proibição abstracta e torna-a representável num único objecto.\",\"verificacao\":\"verificada\",\"linha\":\"105\"},{\"id\":\"R014\",\"tipo_recurso\":\"ironia\",\"citacao\":\"De nenhum modo comendo dela podereis prigar na vida\",\"localizacao\":\"L0113\",\"personagem\":\"Serpente\",\"interpretacao\":\"A tentação opera por negação enfática do que é verdadeiro. É a primeira das falas enganosas da peça, série que continua no Diabo cómico e se inverte na dissimulação virtuosa de Judite.\",\"verificacao\":\"verificada\",\"linha\":\"113\"},{\"id\":\"R015\",\"tipo_recurso\":\"personificação\",\"citacao\":\"não sei o que me vaticina o coração\",\"localizacao\":\"L0119\",\"personagem\":\"Adão\",\"interpretacao\":\"O coração profetiza: o pressentimento é externalizado num órgão que fala. Adão adivinha a culpa antes de a cometer, o que agrava a transgressão.\",\"verificacao\":\"verificada\",\"linha\":\"119\"},{\"id\":\"R016\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"como réu da culpa me escondi\",\"localizacao\":\"L0127\",\"personagem\":\"Adão\",\"interpretacao\":\"Vocabulário forense aplicado à consciência. A queda é imediatamente traduzida em processo judicial, registo que domina toda a intervenção do Padre Eterno.\",\"verificacao\":\"verificada\",\"linha\":\"127\"},{\"id\":\"R017\",\"tipo_recurso\":\"enumeração\",\"citacao\":\"naçarás filho algum sem empulsos de dores, será sojeita aos perceitos do homem, e debaixo do seu domínio vivirás\",\"localizacao\":\"L0132\",\"personagem\":\"Padre Eterno\",\"interpretacao\":\"Três encargos acumulados sobre Eva: dor, sujeição e domínio. A hierarquia doméstica setecentista é aqui enunciada como sentença divina, e é a passagem de maior densidade social do primeiro terço.\",\"verificacao\":\"verificada\",\"linha\":\"132\"},{\"id\":\"R018\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"sarás a mais desgraçada entre todas as feras\",\"localizacao\":\"L0132\",\"personagem\":\"Padre Eterno\",\"interpretacao\":\"Superlativo absoluto que fixa a serpente no fundo da escala dos viventes, completando por baixo a hierarquia que a criação estabelecera por cima.\",\"verificacao\":\"verificada\",\"linha\":\"132\"},{\"id\":\"R019\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"em copioso suor do teu rosto ganharás o pão té que te convertas em terra\",\"localizacao\":\"L0135\",\"personagem\":\"Padre Eterno\",\"interpretacao\":\"O trabalho é dito em imagem circular: o homem vem da terra, alimenta-se dela e volta a ela. A metáfora agrícola torna-se, no lamento seguinte, a do pranto que rega.\",\"verificacao\":\"verificada\",\"linha\":\"135\"},{\"id\":\"R020\",\"tipo_recurso\":\"personificação\",\"citacao\":\"sintirás as paixões que o mundo ilaça\",\"localizacao\":\"L0141\",\"personagem\":\"Anjo\",\"interpretacao\":\"O mundo enlaça como caçador. A expulsão não é apenas espacial: entrega o homem a um agente activo e hostil.\",\"verificacao\":\"verificada\",\"linha\":\"141\"},{\"id\":\"R021\",\"tipo_recurso\":\"personificação\",\"citacao\":\"vai que o mundo te dará o desengano\",\"localizacao\":\"L0144\",\"personagem\":\"Anjo\",\"interpretacao\":\"O mundo torna-se preceptor moral. A oitava fecha o passo com uma sentença de sabor barroco — o desengano como forma de conhecimento.\",\"verificacao\":\"verificada\",\"linha\":\"144\"},{\"id\":\"R022\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"desfaze-te em puro pranto para lavar teu defeito\",\"localizacao\":\"L0148\",\"personagem\":\"Adão\",\"interpretacao\":\"O choro como água baptismal antecipada. A penitência é figurada em operação de limpeza, isotopia que percorre toda a lamentação.\",\"verificacao\":\"verificada\",\"linha\":\"148\"},{\"id\":\"R023\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"se não lançar pelos olhos lágrimas de cento a cento\",\"localizacao\":\"L0151-L0152\",\"personagem\":\"Eva\",\"interpretacao\":\"A contagem das lágrimas transforma a dor em quantidade. O exagero numérico é o registo próprio da lamentação cantada deste passo.\",\"verificacao\":\"verificada\",\"linha\":\"151\"},{\"id\":\"R024\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"Enquanto tivermos vida seja o nosso pranto eterno\",\"localizacao\":\"L0159-L0160\",\"personagem\":\"Adão\",\"interpretacao\":\"Fala conjunta de Adão e Eva («Ambos»). A eternidade do pranto mede-se pela duração da vida: a hipérbole é, na verdade, uma definição da condição humana pós-lapsária.\",\"verificacao\":\"verificada\",\"linha\":\"159\"},{\"id\":\"R025\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"Chora regando essa terra Adão, com lágrimas puras\",\"localizacao\":\"L0162-L0163\",\"personagem\":\"Adão\",\"interpretacao\":\"O pranto converte-se em rega e a penitência em lavoura, ligando directamente a pena do trabalho (L0135) à pena da dor. É a metáfora mais bem integrada do passo.\",\"verificacao\":\"verificada\",\"linha\":\"162\"},{\"id\":\"R026\",\"tipo_recurso\":\"antítese\",\"citacao\":\"pois pusestes fim ao bem por dares prencípio ao mal\",\"localizacao\":\"L0169-L0170\",\"personagem\":\"Adão\",\"interpretacao\":\"Quiasmo perfeito entre fim/princípio e bem/mal. A auto-acusação assume forma de sentença moral memorizável, própria da glosa cantada.\",\"verificacao\":\"verificada\",\"linha\":\"169\"},{\"id\":\"R027\",\"tipo_recurso\":\"apóstrofe\",\"citacao\":\"Sofre terra o golpe irado pois sendo a que me formaste fostes a mesma que brotastes fruto para o meu pecado\",\"localizacao\":\"L0178-L0181\",\"personagem\":\"Adão\",\"interpretacao\":\"Adão interpela a terra como cúmplice: matéria da sua origem e do seu crime. A apóstrofe desloca parcialmente a culpa para a criação, movimento que o texto não corrige.\",\"verificacao\":\"verificada\",\"linha\":\"178\"},{\"id\":\"R028\",\"tipo_recurso\":\"antítese\",\"citacao\":\"pois tantos séculos de graça por um bocado a perdi\",\"localizacao\":\"L0193-L0194\",\"personagem\":\"Adão\",\"interpretacao\":\"Desproporção entre séculos e bocado: a antítese quantifica a queda e é, das formulações do passo, a que melhor condensa a doutrina.\",\"verificacao\":\"verificada\",\"linha\":\"193\"},{\"id\":\"R029\",\"tipo_recurso\":\"antítese\",\"citacao\":\"que de Deus a imensa graça é maior que o teu pecado\",\"localizacao\":\"L0204-L0205\",\"personagem\":\"Adão\",\"interpretacao\":\"Contra-antítese consoladora que responde à anterior. As duas juntas desenham o arco teológico completo — culpa desmedida, misericórdia maior — que a peça só cumprirá em Belém.\",\"verificacao\":\"verificada\",\"linha\":\"204\"},{\"id\":\"R030\",\"tipo_recurso\":\"enumeração\",\"citacao\":\"poi são as pensões da vida: morrer, sentir e chorar\",\"localizacao\":\"L0224-L0225\",\"personagem\":\"Adão\",\"interpretacao\":\"Fala conjunta de Adão e Eva. «Pensão» tem aqui o valor coevo de encargo ou tributo devido, não o moderno de rendimento: a vida é dita como dívida a pagar em três prestações.\",\"verificacao\":\"verificada\",\"linha\":\"224\"},{\"id\":\"R031\",\"tipo_recurso\":\"anáfora\",\"citacao\":\"Que podemos conseguir depois de pecado ter? Coro: Morrer.\",\"localizacao\":\"L0214-L0216\",\"personagem\":\"Coro\",\"interpretacao\":\"O Coro responde com uma palavra a cada pergunta (Morrer / Sentir / Chorar). O destino é encenado como eco: não se argumenta, repete-se — e as três respostas são depois recolhidas no dístico final.\",\"verificacao\":\"verificada\",\"linha\":\"214\"},{\"id\":\"R032\",\"tipo_recurso\":\"antítese\",\"citacao\":\"tu fertilizas os campos com grandes rabanhos, o meu gado cada vez mais se deminuem, e o teu se aumenta\",\"localizacao\":\"L0233\",\"personagem\":\"Caim\",\"interpretacao\":\"A inveja nasce de uma comparação contabilística. A antítese entre aumentar e diminuir é o motor do fratricídio e reencena, em escala doméstica, a comparação soberba de Luzbel.\",\"verificacao\":\"verificada\",\"linha\":\"233\"},{\"id\":\"R033\",\"tipo_recurso\":\"ironia\",\"citacao\":\"acaso julgas-te mais saprior qu'eu?\",\"localizacao\":\"L0237\",\"personagem\":\"Caim\",\"interpretacao\":\"Pergunta retórica que atribui ao irmão a soberba de que o próprio Caim está possuído. A projecção é o mecanismo psicológico que o texto expõe sem o nomear.\",\"verificacao\":\"verificada\",\"linha\":\"237\"},{\"id\":\"R034\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"sou escravo do senhor, e mais não sei\",\"localizacao\":\"L0238\",\"personagem\":\"Abel\",\"interpretacao\":\"A obediência define-se por servidão voluntária e por recusa de saber. Abel é o contrário exacto da Serpente, que prometia conhecimento (L0113).\",\"verificacao\":\"verificada\",\"linha\":\"238\"},{\"id\":\"R035\",\"tipo_recurso\":\"eufemismo\",\"citacao\":\"com a tua morte porarei fim a tantos cuidados\",\"localizacao\":\"L0239\",\"personagem\":\"Caim\",\"interpretacao\":\"O homicídio é dito como alívio administrativo. O eufemismo tem gémeo exacto na boca de Judite (L0689-L0690), simetria que a peça não comenta.\",\"verificacao\":\"verificada\",\"linha\":\"239\"},{\"id\":\"R036\",\"tipo_recurso\":\"personificação\",\"citacao\":\"serva-te de castigo a mesma terra, que andando por ela fugitivo nem ela mesma te empare nem eu jamais te secorra\",\"localizacao\":\"L0248\",\"personagem\":\"Padre Eterno\",\"interpretacao\":\"A terra passa de mãe a carcereira. Completa a série iniciada em L0060 e prepara a imagem seguinte, em que Caim pede à mesma terra que se abra.\",\"verificacao\":\"verificada\",\"linha\":\"248\"},{\"id\":\"R037\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"Ainda a terra não se abre em diferentes bocas para somergir este desesperado\",\"localizacao\":\"L0253\",\"personagem\":\"Caim\",\"interpretacao\":\"A terra ganha bocas: o desespero pede a punição que lhe foi negada. A hipérbole marca a passagem do registo trágico ao entremez que se lhe segue.\",\"verificacao\":\"verificada\",\"linha\":\"253\"},{\"id\":\"R038\",\"tipo_recurso\":\"comparação\",\"citacao\":\"Eu entendo que vossa mercê é como os engleses, que em lhe dando bexigas querem-se enterrar vivos\",\"localizacao\":\"L0254\",\"personagem\":\"Diabo\",\"interpretacao\":\"Comparação anacrónica que muda o registo da peça de um golpe: o desespero bíblico é reclassificado como melancolia inglesa, tópico corrente na Europa setecentista.\",\"verificacao\":\"verificada\",\"linha\":\"254\"},{\"id\":\"R039\",\"tipo_recurso\":\"ironia\",\"citacao\":\"Engana-se, que eu cantei bem nos meus tempos\",\"localizacao\":\"L0256\",\"personagem\":\"Diabo\",\"interpretacao\":\"O Diabo responde à repulsa com vaidade de cantor. A auto-ironia humaniza-o e é precisamente o que o torna eficaz como tentador.\",\"verificacao\":\"verificada\",\"linha\":\"256\"},{\"id\":\"R040\",\"tipo_recurso\":\"provérbio\",\"citacao\":\"não tenha medo que o diabo não é tão feio como o pintam\",\"localizacao\":\"L0258\",\"personagem\":\"Diabo\",\"interpretacao\":\"O Diabo cita o provérbio que existe sobre si próprio. O efeito metalinguístico é o achado cómico do passo e desactiva a iconografia do medo que a cena acabara de montar.\",\"verificacao\":\"verificada\",\"linha\":\"258\"},{\"id\":\"R041\",\"tipo_recurso\":\"anacronismo\",\"citacao\":\"Venha comigo que lhe quero dar uma sala onde tome chá com o meu amigo Poltão\",\"localizacao\":\"L0262\",\"personagem\":\"Diabo\",\"interpretacao\":\"O Inferno como sala de visitas com chá servido. Plutão, deformado em Poltão, torna-se anfitrião mundano: o mal apresenta-se por convite de sociabilidade, não por ameaça.\",\"verificacao\":\"verificada\",\"linha\":\"262\"},{\"id\":\"R042\",\"tipo_recurso\":\"anacronismo\",\"citacao\":\"o tomei por valete de chambri que costuma servir aos hóspades\",\"localizacao\":\"L0264\",\"personagem\":\"Diabo\",\"interpretacao\":\"A corte infernal organiza-se como casa nobre lisboeta, com criadagem hierarquizada. O galicismo cru marca a moda cortesã da segunda metade de setecentos.\",\"verificacao\":\"verificada\",\"linha\":\"264\"},{\"id\":\"R043\",\"tipo_recurso\":\"antítese\",\"citacao\":\"o céu me falta, a terra não me ampara\",\"localizacao\":\"L0272\",\"personagem\":\"Caim\",\"interpretacao\":\"Suspensão entre dois recursos negados. A oitava de Caim fecha o passo com a formulação mais concisa do desamparo em toda a peça.\",\"verificacao\":\"verificada\",\"linha\":\"272\"},{\"id\":\"R044\",\"tipo_recurso\":\"apóstrofe\",\"citacao\":\"chovam já desses céus emensos raios\",\"localizacao\":\"L0276\",\"personagem\":\"Caim\",\"interpretacao\":\"Invocação do castigo como desafio. A chuva de raios contrasta, por antecipação, com a chuva de bênção que fechará o passo de Noé (L0307).\",\"verificacao\":\"verificada\",\"linha\":\"276\"},{\"id\":\"R045\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"O mundo flutua em um lago de tropezas\",\"localizacao\":\"L0285\",\"personagem\":\"Padre Eterno\",\"interpretacao\":\"Metáfora aquática que anuncia literalmente o dilúvio: o pecado é já água antes de a água ser castigo. É a prolepse mais elegante do papel.\",\"verificacao\":\"verificada\",\"linha\":\"285\"},{\"id\":\"R046\",\"tipo_recurso\":\"apóstrofe\",\"citacao\":\"Oh quem podera satisfazer aos pecados de todos para que ficássemos salvos de tanta ruína\",\"localizacao\":\"L0286\",\"personagem\":\"Noé\",\"interpretacao\":\"Desejo formulado como pergunta impossível. No plano da compilação, é uma prefiguração explícita da Redenção que o Passo dos Pastores virá celebrar.\",\"verificacao\":\"verificada\",\"linha\":\"286\"},{\"id\":\"R047\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"samos mandados clausurar em uma arca\",\"localizacao\":\"L0292\",\"personagem\":\"Noé\",\"interpretacao\":\"«Clausurar» tem aqui o valor de clausura monástica, não o moderno de encerramento genérico: a arca é lida como convento, e a salvação como recolhimento regrado.\",\"verificacao\":\"verificada\",\"linha\":\"292\"},{\"id\":\"R048\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"Receba a terra o ósculo de paz\",\"localizacao\":\"L0305\",\"personagem\":\"Noé\",\"interpretacao\":\"Fala colectiva («Todos»). O gesto litúrgico da paz é transferido para a terra emersa, transformando o fim do dilúvio em cerimónia de reconciliação.\",\"verificacao\":\"verificada\",\"linha\":\"305\"},{\"id\":\"R049\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"Já que ficamos livres da ruína a bênção chova em nós da mão divina\",\"localizacao\":\"L0307\",\"personagem\":\"Noé\",\"interpretacao\":\"Fala colectiva. A mesma imagem — chuva — que fora instrumento de destruição torna-se veículo de graça. A inversão fecha o passo com economia notável.\",\"verificacao\":\"verificada\",\"linha\":\"307\"},{\"id\":\"R050\",\"tipo_recurso\":\"comparação\",\"citacao\":\"Capitães valerosos cujos peitos excedem ao de Martem, heróim invicto\",\"localizacao\":\"L0326-L0327\",\"personagem\":\"Olofernes\",\"interpretacao\":\"O termo de comparação é mitológico e pagão, adequado ao tirano assírio. Contrasta deliberadamente com as comparações domésticas dos passos cómicos.\",\"verificacao\":\"verificada\",\"linha\":\"326\"},{\"id\":\"R051\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"esforçai o valor bramindo a lança\",\"localizacao\":\"L0328\",\"personagem\":\"Olofernes\",\"interpretacao\":\"O bramido pertence ao animal e é transferido para a arma. A guerra é figurada como som antes de ser acção — coerente com um tirano que vence sobretudo por discurso.\",\"verificacao\":\"verificada\",\"linha\":\"328\"},{\"id\":\"R052\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"morram todos e não fiquem nenhum vivos\",\"localizacao\":\"L0344\",\"personagem\":\"Olofernes\",\"interpretacao\":\"Pleonasmo hiperbólico que expõe a desmedida pela própria redundância sintáctica. O excesso da ordem está no excesso da frase.\",\"verificacao\":\"verificada\",\"linha\":\"344\"},{\"id\":\"R053\",\"tipo_recurso\":\"antítese\",\"citacao\":\"esquecida a paixão para a piedade té se rompam os sagrados idifícios\",\"localizacao\":\"L0355-L0356\",\"personagem\":\"Olofernes\",\"interpretacao\":\"A paixão é convocada para a destruição e esquecida para a clemência. A antítese define o tirano por aquilo que decide não sentir.\",\"verificacao\":\"verificada\",\"linha\":\"355\"},{\"id\":\"R054\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"Com a espada morram o braço armado o coração vestido de bravura\",\"localizacao\":\"L0368-L0369\",\"personagem\":\"1.º Capitão\",\"interpretacao\":\"O coração veste-se como um corpo. O soneto a dois vozes dos capitães faz da obediência militar uma forma métrica: o encaixe das réplicas é a imagem da disciplina.\",\"verificacao\":\"verificada\",\"linha\":\"368\"},{\"id\":\"R055\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"rotas as pedras se veja destruída não se deixe vivente algum com vida\",\"localizacao\":\"L0405-L0406\",\"personagem\":\"Olofernes\",\"interpretacao\":\"Destruição total declarada em dois planos — mineral e vivo. A acumulação prepara a tríade final de L0435.\",\"verificacao\":\"verificada\",\"linha\":\"405\"},{\"id\":\"R056\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"tudo estrago será, nem sepultura aos mortos lhe darei em parte digna\",\"localizacao\":\"L0424-L0425\",\"personagem\":\"Olofernes\",\"interpretacao\":\"A negação de sepultura é, na tradição clássica, o extremo da desumanidade. O tirano define-se por ultrapassar o limite que separa a guerra do sacrilégio.\",\"verificacao\":\"verificada\",\"linha\":\"424\"},{\"id\":\"R057\",\"tipo_recurso\":\"anáfora\",\"citacao\":\"tudo em pó, tudo em cinza e tudo em fogo\",\"localizacao\":\"L0435\",\"personagem\":\"Olofernes\",\"interpretacao\":\"Tríade em gradação que fecha a ária de Olofernes. É pura potência verbal — e a peça encarrega-se de a desmentir, fazendo-o cair por uma mulher e um jantar.\",\"verificacao\":\"verificada\",\"linha\":\"435\"},{\"id\":\"R058\",\"tipo_recurso\":\"personificação\",\"citacao\":\"a sua mesma cabeça será testemunha disto, pois separada do corpo hei de trazê-la comigo\",\"localizacao\":\"L0449-L0452\",\"personagem\":\"Judite\",\"interpretacao\":\"A cabeça decepada é convocada como testemunha judicial. Judite anuncia o desfecho com precisão forense, e o troféu vale como prova.\",\"verificacao\":\"verificada\",\"linha\":\"449\"},{\"id\":\"R059\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"oh ânimo revestido de uma pura fé\",\"localizacao\":\"L0456-L0457\",\"personagem\":\"Sacerdote\",\"interpretacao\":\"A fé é armadura. A metáfora bélica aplicada à virtude autoriza religiosamente a violência de Judite e converte iniciativa individual em causa colectiva.\",\"verificacao\":\"verificada\",\"linha\":\"456\"},{\"id\":\"R060\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"já meu amo tira hoje a ferruge ao seu dinheiro\",\"localizacao\":\"L0467-L0469\",\"personagem\":\"Mestre-Sala\",\"interpretacao\":\"A avareza é dita pela oxidação da moeda parada. É a primeira fala do criado e fixa de imediato a sua função: ver o senhor por dentro.\",\"verificacao\":\"verificada\",\"linha\":\"467\"},{\"id\":\"R061\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"o Mestre-Sala também há de ter a sua função de lambedela\",\"localizacao\":\"L0471-L0472\",\"personagem\":\"Mestre-Sala\",\"interpretacao\":\"O banquete do amo desdobra-se num banquete de criados. A metáfora do lamber marca a posição na cadeia alimentar da casa — e da peça.\",\"verificacao\":\"verificada\",\"linha\":\"471\"},{\"id\":\"R062\",\"tipo_recurso\":\"anacronismo\",\"citacao\":\"vi uma dama destas de topete alto à Zamperina\",\"localizacao\":\"L0503-L0504\",\"personagem\":\"Mestre-Sala\",\"interpretacao\":\"Judite entra na tenda assíria com o penteado da cantora de ópera em voga em Lisboa. É o anacronismo mais preciso do papel e o seu melhor indício de datação relativa.\",\"verificacao\":\"verificada\",\"linha\":\"503\"},{\"id\":\"R063\",\"tipo_recurso\":\"trocadilho\",\"citacao\":\"Minha menina, poteis intrare\",\"localizacao\":\"L0508\",\"personagem\":\"Mestre-Sala\",\"interpretacao\":\"Latim de fantasia com terminação italianizante. O criado exibe língua que não domina — procedimento que se repetirá com a Velha (L0625) e com o Doutor (L0883).\",\"verificacao\":\"verificada\",\"linha\":\"508\"},{\"id\":\"R064\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"por desventura da estrela foi de minha vida o berço\",\"localizacao\":\"L0519-L0520\",\"personagem\":\"Judite\",\"interpretacao\":\"Astrologia como retórica de queixa. Judite constrói uma biografia falsa em romance cantado, e a metáfora fatalista é o que a torna verosímil ao ouvido do tirano.\",\"verificacao\":\"verificada\",\"linha\":\"519\"},{\"id\":\"R065\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"não ficará pedra sobre pedra desta enfeliz cidade de Betúlia\",\"localizacao\":\"L0566-L0568\",\"personagem\":\"Olofernes\",\"interpretacao\":\"A promessa de arrasamento é feita como galanteio: a destruição de uma cidade oferecida a uma mulher como prova de afecto. A hipérbole tem aqui função erótica.\",\"verificacao\":\"verificada\",\"linha\":\"566\"},{\"id\":\"R066\",\"tipo_recurso\":\"anacronismo\",\"citacao\":\"E que função terão os rapazes na Cotovia com tanta pedra?\",\"localizacao\":\"L0569-L0570\",\"personagem\":\"Mestre-Sala\",\"interpretacao\":\"O aparte reduz o arrasamento de Betúlia a matéria-prima para as pedradas dos rapazes de um bairro lisboeta. É o mecanismo central do papel: rebaixar o bíblico à rua do espectador.\",\"verificacao\":\"verificada\",\"linha\":\"569\"},{\"id\":\"R067\",\"tipo_recurso\":\"ironia\",\"citacao\":\"Cuidado nisso.\",\"localizacao\":\"L0573\",\"personagem\":\"Mestre-Sala\",\"interpretacao\":\"Duas palavras respondem a uma ameaça de genocídio. O laconismo do criado desactiva a retórica do amo com mais eficácia do que qualquer réplica longa.\",\"verificacao\":\"verificada\",\"linha\":\"573\"},{\"id\":\"R068\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"a tua fromusura me tem arrebatado de tal sorte que já não sei parte de mim\",\"localizacao\":\"L0586-L0588\",\"personagem\":\"Olofernes\",\"interpretacao\":\"O tirano descreve-se como território conquistado. A metáfora inverte a relação de poder antes de a acção o fazer: quem cerca cidades é cercado.\",\"verificacao\":\"verificada\",\"linha\":\"586\"},{\"id\":\"R069\",\"tipo_recurso\":\"ironia\",\"citacao\":\"Foram-se os gulosos mas foram bem convidados\",\"localizacao\":\"L0613-L0614\",\"personagem\":\"Mestre-Sala\",\"interpretacao\":\"O criado avalia o banquete pela perspectiva do que sobra. A ironia sobre a gula dos senhores é também constatação de fome própria.\",\"verificacao\":\"verificada\",\"linha\":\"613\"},{\"id\":\"R070\",\"tipo_recurso\":\"trocadilho\",\"citacao\":\"Vossa mercê não sabe que acessório séquito porém cipa-me cipale\",\"localizacao\":\"L0625-L0626\",\"personagem\":\"Mestre-Sala\",\"interpretacao\":\"Latim macarrónico usado como arma de galanteio. Não comunica: exibe — e a Velha desmascara-o na fala seguinte.\",\"verificacao\":\"verificada\",\"linha\":\"625\"},{\"id\":\"R071\",\"tipo_recurso\":\"ironia\",\"citacao\":\"ei sei cá latim!\",\"localizacao\":\"L0627\",\"personagem\":\"Velha\",\"interpretacao\":\"A ignorância declarada derrota a erudição fingida. A resposta é o momento em que a peça toma partido pelo saber popular contra a exibição letrada.\",\"verificacao\":\"verificada\",\"linha\":\"627\"},{\"id\":\"R072\",\"tipo_recurso\":\"anáfora\",\"citacao\":\"não repara nestas cãs, não vê esta prespicácia\",\"localizacao\":\"L0635-L0637\",\"personagem\":\"Velha\",\"interpretacao\":\"A dupla negação invoca a autoridade da idade. A Velha reivindica respeito com os mesmos argumentos com que a peça a torna ridícula.\",\"verificacao\":\"verificada\",\"linha\":\"635\"},{\"id\":\"R073\",\"tipo_recurso\":\"anáfora\",\"citacao\":\"Farei com que mais não fale farei com que mais não diga e lhe arrancarei esses olhos\",\"localizacao\":\"L0648-L0650\",\"personagem\":\"Velha\",\"interpretacao\":\"Gradação de ameaças que sobe da palavra ao corpo. A anáfora dá à fúria da velha uma forma retórica quase litúrgica, o que aumenta o efeito cómico.\",\"verificacao\":\"verificada\",\"linha\":\"648\"},{\"id\":\"R074\",\"tipo_recurso\":\"metáfora\",\"citacao\":\"vai-te negra cristaleira do inferno\",\"localizacao\":\"L0654\",\"personagem\":\"Mestre-Sala\",\"interpretacao\":\"A injúria identifica a velha com o ofício de aplicar clisteres. O corpo feminino envelhecido é reduzido a função escatológica — o registo mais violento do papel.\",\"verificacao\":\"verificada\",\"linha\":\"654\"},{\"id\":\"R075\",\"tipo_recurso\":\"hipérbole\",\"citacao\":\"Traze-me para aqui um bom alguidar de sopas com seiscentas rodas de paio\",\"localizacao\":\"L0659-L0660\",\"personagem\":\"Mestre-Sala\",\"interpretacao\":\"O número redondo e absurdo mede a fome. A hipérbole alimentar é o contraponto exacto da hipérbole destrutiva de Olofernes (L0435).\",\"verificacao\":\"verificada\",\"linha\":\"659\"},{\"id\":\"R076\",\"tipo_recurso\":\"trocadilho\",\"citacao\":\"Quem te alinhavara o corpo co uma faca\",\"localizacao\":\"L0664-L0665\",\"personagem\":\"Mestre-Sala\",\"interpretacao\":\"O criado devolve ao cozinheiro a palavra que este acabara de usar para o cozido («alinhavado», L0663), transferindo-a da costura para o golpe. A ameaça nasce do léxico do outro.\",\"verificacao\":\"verificada\",\"linha\":\"664\"},{\"id\":\"R077\",\"tipo_recurso\":\"anáfora\",\"citacao\":\"Queimado sejas tu, venha a olha... Apodrecidos sejam os teus olhos\",\"localizacao\":\"L0667-L0669\",\"personagem\":\"Mestre-Sala\",\"interpretacao\":\"Cada resposta do Preto é convertida em maldição pela repetição do particípio. O diálogo funciona como máquina: o que falta à cozinha volta como praga.\",\"verificacao\":\"verificada\",\"linha\":\"667\"},{\"id\":\"R078\",\"tipo_recurso\":\"ironia\",\"citacao\":\"Nos copa de meu
