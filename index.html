Serpente,\"A tentação opera por negação enfática do que é verdadeiro. É a primeira das falas enganosas da peça, série que continua no Diabo cómico e se inverte na dissimulação virtuosa de Judite.\",113,113,verificada\nR015,personificação,não sei o que me vaticina o coração,L0119,Adão,\"O coração profetiza: o pressentimento é externalizado num órgão que fala. Adão adivinha a culpa antes de a cometer, o que agrava a transgressão.\",119,119,verificada\nR016,metáfora,como réu da culpa me escondi,L0127,Adão,\"Vocabulário forense aplicado à consciência. A queda é imediatamente traduzida em processo judicial, registo que domina toda a intervenção do Padre Eterno.\",127,127,verificada\nR017,enumeração,\"naçarás filho algum sem empulsos de dores, será sojeita aos perceitos do homem, e debaixo do seu domínio vivirás\",L0132,Padre Eterno,\"Três encargos acumulados sobre Eva: dor, sujeição e domínio. A hierarquia doméstica setecentista é aqui enunciada como sentença divina, e é a passagem de maior densidade social do primeiro terço.\",132,132,verificada\nR018,hipérbole,sarás a mais desgraçada entre todas as feras,L0132,Padre Eterno,\"Superlativo absoluto que fixa a serpente no fundo da escala dos viventes, completando por baixo a hierarquia que a criação estabelecera por cima.\",132,132,verificada\nR019,metáfora,em copioso suor do teu rosto ganharás o pão té que te convertas em terra,L0135,Padre Eterno,\"O trabalho é dito em imagem circular: o homem vem da terra, alimenta-se dela e volta a ela. A metáfora agrícola torna-se, no lamento seguinte, a do pranto que rega.\",135,135,verificada\nR020,personificação,sintirás as paixões que o mundo ilaça,L0141,Anjo,O mundo enlaça como caçador. A expulsão não é apenas espacial: entrega o homem a um agente activo e hostil.,141,141,verificada\nR021,personificação,vai que o mundo te dará o desengano,L0144,Anjo,O mundo torna-se preceptor moral. A oitava fecha o passo com uma sentença de sabor barroco — o desengano como forma de conhecimento.,144,144,verificada\nR022,metáfora,desfaze-te em puro pranto para lavar teu defeito,L0148,Adão,\"O choro como água baptismal antecipada. A penitência é figurada em operação de limpeza, isotopia que percorre toda a lamentação.\",148,148,verificada\nR023,hipérbole,se não lançar pelos olhos lágrimas de cento a cento,L0151-L0152,Eva,A contagem das lágrimas transforma a dor em quantidade. O exagero numérico é o registo próprio da lamentação cantada deste passo.,151,152,verificada\nR024,hipérbole,Enquanto tivermos vida seja o nosso pranto eterno,L0159-L0160,Adão,\"Fala conjunta de Adão e Eva («Ambos»). A eternidade do pranto mede-se pela duração da vida: a hipérbole é, na verdade, uma definição da condição humana pós-lapsária.\",159,160,verificada\nR025,metáfora,\"Chora regando essa terra Adão, com lágrimas puras\",L0162-L0163,Adão,\"O pranto converte-se em rega e a penitência em lavoura, ligando directamente a pena do trabalho (L0135) à pena da dor. É a metáfora mais bem integrada do passo.\",162,163,verificada\nR026,antítese,pois pusestes fim ao bem por dares prencípio ao mal,L0169-L0170,Adão,\"Quiasmo perfeito entre fim/princípio e bem/mal. A auto-acusação assume forma de sentença moral memorizável, própria da glosa cantada.\",169,170,verificada\nR027,apóstrofe,Sofre terra o golpe irado pois sendo a que me formaste fostes a mesma que brotastes fruto para o meu pecado,L0178-L0181,Adão,\"Adão interpela a terra como cúmplice: matéria da sua origem e do seu crime. A apóstrofe desloca parcialmente a culpa para a criação, movimento que o texto não corrige.\",178,181,verificada\nR028,antítese,pois tantos séculos de graça por um bocado a perdi,L0193-L0194,Adão,\"Desproporção entre séculos e bocado: a antítese quantifica a queda e é, das formulações do passo, a que melhor condensa a doutrina.\",193,194,verificada\nR029,antítese,que de Deus a imensa graça é maior que o teu pecado,L0204-L0205,Adão,\"Contra-antítese consoladora que responde à anterior. As duas juntas desenham o arco teológico completo — culpa desmedida, misericórdia maior — que a peça só cumprirá em Belém.\",204,205,verificada\nR030,enumeração,\"poi são as pensões da vida: morrer, sentir e chorar\",L0224-L0225,Adão,\"Fala conjunta de Adão e Eva. «Pensão» tem aqui o valor coevo de encargo ou tributo devido, não o moderno de rendimento: a vida é dita como dívida a pagar em três prestações.\",224,225,verificada\nR031,anáfora,Que podemos conseguir depois de pecado ter? Coro: Morrer.,L0214-L0216,Coro,\"O Coro responde com uma palavra a cada pergunta (Morrer / Sentir / Chorar). O destino é encenado como eco: não se argumenta, repete-se — e as três respostas são depois recolhidas no dístico final.\",214,216,verificada\nR032,antítese,\"tu fertilizas os campos com grandes rabanhos, o meu gado cada vez mais se deminuem, e o teu se aumenta\",L0233,Caim,\"A inveja nasce de uma comparação contabilística. A antítese entre aumentar e diminuir é o motor do fratricídio e reencena, em escala doméstica, a comparação soberba de Luzbel.\",233,233,verificada\nR033,ironia,acaso julgas-te mais saprior qu'eu?,L0237,Caim,Pergunta retórica que atribui ao irmão a soberba de que o próprio Caim está possuído. A projecção é o mecanismo psicológico que o texto expõe sem o nomear.,237,237,verificada\nR034,metáfora,\"sou escravo do senhor, e mais não sei\",L0238,Abel,\"A obediência define-se por servidão voluntária e por recusa de saber. Abel é o contrário exacto da Serpente, que prometia conhecimento (L0113).\",238,238,verificada\nR035,eufemismo,com a tua morte porarei fim a tantos cuidados,L0239,Caim,\"O homicídio é dito como alívio administrativo. O eufemismo tem gémeo exacto na boca de Judite (L0689-L0690), simetria que a peça não comenta.\",239,239,verificada\nR036,personificação,\"serva-te de castigo a mesma terra, que andando por ela fugitivo nem ela mesma te empare nem eu jamais te secorra\",L0248,Padre Eterno,\"A terra passa de mãe a carcereira. Completa a série iniciada em L0060 e prepara a imagem seguinte, em que Caim pede à mesma terra que se abra.\",248,248,verificada\nR037,hipérbole,Ainda a terra não se abre em diferentes bocas para somergir este desesperado,L0253,Caim,A terra ganha bocas: o desespero pede a punição que lhe foi negada. A hipérbole marca a passagem do registo trágico ao entremez que se lhe segue.,253,253,verificada\nR038,comparação,\"Eu entendo que vossa mercê é como os engleses, que em lhe dando bexigas querem-se enterrar vivos\",L0254,Diabo,\"Comparação anacrónica que muda o registo da peça de um golpe: o desespero bíblico é reclassificado como melancolia inglesa, tópico corrente na Europa setecentista.\",254,254,verificada\nR039,ironia,\"Engana-se, que eu cantei bem nos meus tempos\",L0256,Diabo,O Diabo responde à repulsa com vaidade de cantor. A auto-ironia humaniza-o e é precisamente o que o torna eficaz como tentador.,256,256,verificada\nR040,provérbio,não tenha medo que o diabo não é tão feio como o pintam,L0258,Diabo,O Diabo cita o provérbio que existe sobre si próprio. O efeito metalinguístico é o achado cómico do passo e desactiva a iconografia do medo que a cena acabara de montar.,258,258,verificada\nR041,anacronismo,Venha comigo que lhe quero dar uma sala onde tome chá com o meu amigo Poltão,L0262,Diabo,\"O Inferno como sala de visitas com chá servido. Plutão, deformado em Poltão, torna-se anfitrião mundano: o mal apresenta-se por convite de sociabilidade, não por ameaça.\",262,262,verificada\nR042,anacronismo,o tomei por valete de chambri que costuma servir aos hóspades,L0264,Diabo,\"A corte infernal organiza-se como casa nobre lisboeta, com criadagem hierarquizada. O galicismo cru marca a moda cortesã da segunda metade de setecentos.\",264,264,verificada\nR043,antítese,\"o céu me falta, a terra não me ampara\",L0272,Caim,Suspensão entre dois recursos negados. A oitava de Caim fecha o passo com a formulação mais concisa do desamparo em toda a peça.,272,272,verificada\nR044,apóstrofe,chovam já desses céus emensos raios,L0276,Caim,\"Invocação do castigo como desafio. A chuva de raios contrasta, por antecipação, com a chuva de bênção que fechará o passo de Noé (L0307).\",276,276,verificada\nR045,metáfora,O mundo flutua em um lago de tropezas,L0285,Padre Eterno,Metáfora aquática que anuncia literalmente o dilúvio: o pecado é já água antes de a água ser castigo. É a prolepse mais elegante do papel.,285,285,verificada\nR046,apóstrofe,Oh quem podera satisfazer aos pecados de todos para que ficássemos salvos de tanta ruína,L0286,Noé,\"Desejo formulado como pergunta impossível. No plano da compilação, é uma prefiguração explícita da Redenção que o Passo dos Pastores virá celebrar.\",286,286,verificada\nR047,metáfora,samos mandados clausurar em uma arca,L0292,Noé,\"«Clausurar» tem aqui o valor de clausura monástica, não o moderno de encerramento genérico: a arca é lida como convento, e a salvação como recolhimento regrado.\",292,292,verificada\nR048,metáfora,Receba a terra o ósculo de paz,L0305,Noé,\"Fala colectiva («Todos»). O gesto litúrgico da paz é transferido para a terra emersa, transformando o fim do dilúvio em cerimónia de reconciliação.\",305,305,verificada\nR049,metáfora,Já que ficamos livres da ruína a bênção chova em nós da mão divina,L0307,Noé,Fala colectiva. A mesma imagem — chuva — que fora instrumento de destruição torna-se veículo de graça. A inversão fecha o passo com economia notável.,307,307,verificada\nR050,comparação,\"Capitães valerosos cujos peitos excedem ao de Martem, heróim invicto\",L0326-L0327,Olofernes,\"O termo de comparação é mitológico e pagão, adequado ao tirano assírio. Contrasta deliberadamente com as comparações domésticas dos passos cómicos.\",326,327,verificada\nR051,metáfora,esforçai o valor bramindo a lança,L0328,Olofernes,O bramido pertence ao animal e é transferido para a arma. A guerra é figurada como som antes de ser acção — coerente com um tirano que vence sobretudo por discurso.,328,328,verificada\nR052,hipérbole,morram todos e não fiquem nenhum vivos,L0344,Olofernes,Pleonasmo hiperbólico que expõe a desmedida pela própria redundância sintáctica. O excesso da ordem está no excesso da frase.,344,344,verificada\nR053,antítese,esquecida a paixão para a piedade té se rompam os sagrados idifícios,L0355-L0356,Olofernes,A paixão é convocada para a destruição e esquecida para a clemência. A antítese define o tirano por aquilo que decide não sentir.,355,356,verificada\nR054,metáfora,Com a espada morram o braço armado o coração vestido de bravura,L0368-L0369,1.º Capitão,O coração veste-se como um corpo. O soneto a dois vozes dos capitães faz da obediência militar uma forma métrica: o encaixe das réplicas é a imagem da disciplina.,368,369,verificada\nR055,hipérbole,rotas as pedras se veja destruída não se deixe vivente algum com vida,L0405-L0406,Olofernes,Destruição total declarada em dois planos — mineral e vivo. A acumulação prepara a tríade final de L0435.,405,406,verificada\nR056,hipérbole,\"tudo estrago será, nem sepultura aos mortos lhe darei em parte digna\",L0424-L0425,Olofernes,\"A negação de sepultura é, na tradição clássica, o extremo da desumanidade. O tirano define-se por ultrapassar o limite que separa a guerra do sacrilégio.\",424,425,verificada\nR057,anáfora,\"tudo em pó, tudo em cinza e tudo em fogo\",L0435,Olofernes,\"Tríade em gradação que fecha a ária de Olofernes. É pura potência verbal — e a peça encarrega-se de a desmentir, fazendo-o cair por uma mulher e um jantar.\",435,435,verificada\nR058,personificação,\"a sua mesma cabeça será testemunha disto, pois separada do corpo hei de trazê-la comigo\",L0449-L0452,Judite,\"A cabeça decepada é convocada como testemunha judicial. Judite anuncia o desfecho com precisão forense, e o troféu vale como prova.\",449,452,verificada\nR059,metáfora,oh ânimo revestido de uma pura fé,L0456-L0457,Sacerdote,A fé é armadura. A metáfora bélica aplicada à virtude autoriza religiosamente a violência de Judite e converte iniciativa individual em causa colectiva.,456,457,verificada\nR060,metáfora,já meu amo tira hoje a ferruge ao seu dinheiro,L0467-L0469,Mestre-Sala,A avareza é dita pela oxidação da moeda parada. É a primeira fala do criado e fixa de imediato a sua função: ver o senhor por dentro.,467,469,verificada\nR061,metáfora,o Mestre-Sala também há de ter a sua função de lambedela,L0471-L0472,Mestre-Sala,O banquete do amo desdobra-se num banquete de criados. A metáfora do lamber marca a posição na cadeia alimentar da casa — e da peça.,471,472,verificada\nR062,anacronismo,vi uma dama destas de topete alto à Zamperina,L0503-L0504,Mestre-Sala,Judite entra na tenda assíria com o penteado da cantora de ópera em voga em Lisboa. É o anacronismo mais preciso do papel e o seu melhor indício de datação relativa.,503,504,verificada\nR063,trocadilho,\"Minha menina, poteis intrare\",L0508,Mestre-Sala,Latim de fantasia com terminação italianizante. O criado exibe língua que não domina — procedimento que se repetirá com a Velha (L0625) e com o Doutor (L0883).,508,508,verificada\nR064,metáfora,por desventura da estrela foi de minha vida o berço,L0519-L0520,Judite,\"Astrologia como retórica de queixa. Judite constrói uma biografia falsa em romance cantado, e a metáfora fatalista é o que a torna verosímil ao ouvido do tirano.\",519,520,verificada\nR065,hipérbole,não ficará pedra sobre pedra desta enfeliz cidade de Betúlia,L0566-L0568,Olofernes,A promessa de arrasamento é feita como galanteio: a destruição de uma cidade oferecida a uma mulher como prova de afecto. A hipérbole tem aqui função erótica.,566,568,verificada\nR066,anacronismo,E que função terão os rapazes na Cotovia com tanta pedra?,L0569-L0570,Mestre-Sala,O aparte reduz o arrasamento de Betúlia a matéria-prima para as pedradas dos rapazes de um bairro lisboeta. É o mecanismo central do papel: rebaixar o bíblico à rua do espectador.,569,570,verificada\nR067,ironia,Cuidado nisso.,L0573,Mestre-Sala,Duas palavras respondem a uma ameaça de genocídio. O laconismo do criado desactiva a retórica do amo com mais eficácia do que qualquer réplica longa.,573,573,verificada\nR068,metáfora,a tua fromusura me tem arrebatado de tal sorte que já não sei parte de mim,L0586-L0588,Olofernes,O tirano descreve-se como território conquistado. A metáfora inverte a relação de poder antes de a acção o fazer: quem cerca cidades é cercado.,586,588,verificada\nR069,ironia,Foram-se os gulosos mas foram bem convidados,L0613-L0614,Mestre-Sala,O criado avalia o banquete pela perspectiva do que sobra. A ironia sobre a gula dos senhores é também constatação de fome própria.,613,614,verificada\nR070,trocadilho,Vossa mercê não sabe que acessório séquito porém cipa-me cipale,L0625-L0626,Mestre-Sala,Latim macarrónico usado como arma de galanteio. Não comunica: exibe — e a Velha desmascara-o na fala seguinte.,625,626,verificada\nR071,ironia,ei sei cá latim!,L0627,Velha,A ignorância declarada derrota a erudição fingida. A resposta é o momento em que a peça toma partido pelo saber popular contra a exibição letrada.,627,627,verificada\nR072,anáfora,\"não repara nestas cãs, não vê esta prespicácia\",L0635-L0637,Velha,A dupla negação invoca a autoridade da idade. A Velha reivindica respeito com os mesmos argumentos com que a peça a torna ridícula.,635,637,verificada\nR073,anáfora,Farei com que mais não fale farei com que mais não diga e lhe arrancarei esses olhos,L0648-L0650,Velha,\"Gradação de ameaças que sobe da palavra ao corpo. A anáfora dá à fúria da velha uma forma retórica quase litúrgica, o que aumenta o efeito cómico.\",648,650,verificada\nR074,metáfora,vai-te negra cristaleira do inferno,L0654,Mestre-Sala,A injúria identifica a velha com o ofício de aplicar clisteres. O corpo feminino envelhecido é reduzido a função escatológica — o registo mais violento do papel.,654,654,verificada\nR075,hipérbole,Traze-me para aqui um bom alguidar de sopas com seiscentas rodas de paio,L0659-L0660,Mestre-Sala,O número redondo e absurdo mede a fome. A hipérbole alimentar é o contraponto exacto da hipérbole destrutiva de Olofernes (L0435).,659,660,verificada\nR076,trocadilho,Quem te alinhavara o corpo co uma faca,L0664-L0665,Mestre-Sala,\"O criado devolve ao cozinheiro a palavra que este acabara de usar para o cozido («alinhavado», L0663), transferindo-a da costura para o golpe. A ameaça nasce do léxico do outro.\",664,665,verificada\nR077,anáfora,\"Queimado sejas tu, venha a olha... Apodrecidos sejam os teus olhos\",L0667-L0669,Mestre-Sala,Cada resposta do Preto é convertida em maldição pela repetição do particípio. O diálogo funciona como máquina: o que falta à cozinha volta como praga.,667,669,verificada\nR078,ironia,\"Nos copa de meu senhor Oslofernes há muntas cosas, há pão, há vinho\",L0671-L0672,Preto (criado de Olofernes),\"Depois de negar tudo, o cozinheiro aponta a despensa do amo. A fala expõe, sem o dizer, que a escassez dos criados coexiste com a abundância do senhor.\",671,672,verificada\nR079,eufemismo,\"dormindo está, eterno há de ser o seu descanso\",L0689-L0690,Judite,\"O sono desliza para a morte no espaço de uma vírgula. O eufemismo é idêntico em função ao de Caim (L0239), com valoração moral oposta.\",689,690,verificada\nR080,apóstrofe,morre ó mostro da tirania não blazones de atrevido quando uma molher te osurpa os assentos,L0692-L0694,Judite,O golpe é acompanhado de sentença. «Assentos» retoma pela terceira vez a palavra que Luzbel quis ocupar (L0040) e que São Miguel lhe negou (L0053): a inversão hierárquica fecha aqui o seu ciclo.,692,694,verificada\nR081,comparação,\"Oh valerosa Pantalisea, bote, bote aqui neste avental que eu levo lá para dentro\",L0695-L0696,Velha,Judite é saudada como Pentesileia e no mesmo fôlego convidada a pôr a cabeça num avental. A queda do registo épico para o doméstico é o mais eficaz bathos do papel.,695,696,verificada\nR082,ironia,Quem havia de ser senão aquela caganita que lhe levou a cabeça,L0707-L0708,Mestre-Sala,\"O tiranicídio é reportado em linguagem de insulto de rua. O criado retira à heroína a solenidade que o texto sério lhe atribui, e a peça deixa as duas leituras coexistir.\",707,708,verificada\nR083,hipérbole,aqui tens a cabeça mais ferina,L0719,Judite,\"Superlativo que transforma o despojo em prova pública. A oitava final devolve o passo ao registo elevado, apagando o entremez que acabara de decorrer.\",719,719,verificada\nR084,apóstrofe,\"Descuidados pastores, ter sentido, despertai desse sono tão profundo\",L0733-L0734,Anjo,\"O anúncio começa por repreensão. O sono dos pastores é o mesmo descuido moral de que a peça vem tratando desde Adão, e o despertar vale por conversão.\",733,734,verificada\nR085,anáfora,\"Já o Céu glória em si está possuindo, já os homens tem paz, gosto jocundo\",L0737-L0738,Anjo,A dupla anáfora do «já» marca a mudança de tempo teológico: o que era espera passa a estado presente. É a articulação que justifica todos os passos anteriores.,737,738,verificada\nR086,antítese,ou será favor do Céu ou é sonho do sentido,L0747-L0748,Alceto,\"Fala colectiva dos pastores. A alternativa entre revelação e ilusão é resolvida pela verificação («pois eu os olhos abrindo», L0750), procedimento que dá ao milagre o estatuto de facto testemunhado.\",747,748,verificada\nR087,metáfora,vi encaminhar-se ao Céu um celeste paranifo,L0751-L0752,Alceto,\"«Paraninfo» — o que conduz a noiva — aplica ao anjo vocabulário de núpcias, alusão à união entre o divino e o humano que o Natal celebra.\",751,752,verificada\nR088,antítese,\"Tens do céu estimação, arruinado idifício, pois em ti nasce o prencípio para a nossa salvação\",L0765-L0768,Alceto,\"A ruína material é a condição da elevação espiritual. Esta antítese é a formulação central da teologia do presépio e responde, ponto por ponto, à ruína de Betúlia.\",765,768,verificada\nR089,anáfora,Quanto posso e quanto tenho desde já fica ofrecido,L0771-L0772,Alceto,\"A oferta define-se por totalidade, não por quantidade. A anáfora mede a dádiva pela capacidade e não pelo valor — doutrina que Anfriso completará oferecendo a pobreza.\",771,772,verificada\nR090,metáfora,só por ser ademetido ao vosso santo rebenho,L0773-L0774,Alceto,O pastor pede para ser ovelha. A inversão de papéis dentro da própria metáfora pastoril é o modo como o passo articula ofício real e figura religiosa.,773,774,verificada\nR091,apóstrofe,\"Oh, ditosas porfecias de alto mistério profundo\",L0785-L0786,Amador,\"A invocação dirige-se às profecias e não a Deus: o que se celebra é o cumprimento de um texto, o que faz do presépio a última cena de uma escritura.\",785,786,verificada\nR092,antítese,\"para ter fim todo o mal, é nascido o nosso bem\",L0797-L0798,Florindo,\"Fecho doutrinal da adoração, com paralelismo perfeito entre mal e bem. Encerra a série de antíteses aberta em L0169 pela auto-acusação de Adão.\",797,798,verificada\nR093,hipérbole,Todas as horas e dias seja o louvor de contínuo,L0789-L0790,Amador,A totalidade temporal do louvor responde à totalidade da oferta (L0771). Os quatro pastores repartem entre si os modos possíveis de dar.,789,790,verificada\nR094,apóstrofe,\"Ah tempos, tempos, como estais virsificados dos antigos tempos!\",L0818,Manuel Gonçalves,\"Tópico do elogio do tempo antigo, transposto para a boca de um pescador. A queixa geracional abre o monólogo e legitima a evocação nostálgica que se segue.\",818,818,verificada\nR095,ironia,Qui seja possibli que estes labutem nos destranques e que eu ande chafurdando na obra da arca,L0818,Manuel Gonçalves,\"Fala metateatral: o actor queixa-se do serviço que lhe dá a máquina do dilúvio. É a prova interna mais forte de que este monólogo é a «parte» anunciada em L0289, dentro do passo de Noé.\",818,818,verificada\nR096,comparação,uma delas era mocetona como um barco,L0818,Manuel Gonçalves,\"O corpo feminino medido em tonelagem. A comparação instala o campo náutico que organizará todo o monólogo, do vestuário à correspondência amorosa.\",818,818,verificada\nR097,metáfora,\"era um camezote de Holanda, de vela de navios, com punhos e bofes de casa de traquete\",L0818,Manuel Gonçalves,A camisa é descrita peça a peça como aparelho de navio. O luxo é dito no único vocabulário técnico que o falante possui — o que é simultaneamente cómico e socialmente exacto.,818,818,verificada\nR098,enumeração,\"pondem-se-á 3 casões, 20 arraias, 18 safios, 30 eroses , 60 caxuxos, e de sardinhas 500\",L0818,Manuel Gonçalves,\"Inventário de pescado com quantidades crescentes. A enumeração serve de prova de amor e é, ao mesmo tempo, o documento lexical mais rico do papel sobre a pesca da costa.\",818,818,verificada\nR099,trocadilho,te rimeto esse despigo pois ainda me não despigo,L0821-L0822,Manuel Gonçalves,Paronomásia entre o despojo de pescado e o despicar-se amoroso. A décima do pescador constrói-se inteira sobre este tipo de duplo sentido técnico-afectivo.,821,822,verificada\nR100,metáfora,pois vai com o sangue na guelra,L0829,Manuel Gonçalves,\"A frescura do peixe garante a frescura do amor. A metáfora funde por completo o campo do ofício e o do sentimento, sem resto.\",829,829,verificada\nR101,trocadilho,\"pois na compra do carinho, ninguém me tira do lanço\",L0832-L0833,Manuel Gonçalves,«Lanço» é ao mesmo tempo o lance da rede e o lance do leilão. O afecto é dito como transacção em que o falante não se deixa cobrir.,832,833,verificada\nR102,trocadilho,só contigo mi trismalho,L0839,Manuel Gonçalves,O trasmalho é a rede de três malhas e «tresmalhar-se» é perder-se. O verso condensa em três palavras a arte e o desnorte amoroso.,839,839,verificada\nR103,alegoria,\"Fichi a carta e miti a chavi n'alzibeira, embarquei-a no paquete, largou este o passo todo, foi bolinando por i fora, chegou à porta da moça, pouse a capa, fez sinal à fortaleza\",L0841,Manuel Gonçalves,\"A entrega da carta é narrada como viagem completa de embarcação, com manobra, aproximação e sinal à fortaleza. É a alegoria mais desenvolvida do papel e transforma um recado numa campanha naval.\",841,841,verificada\nR104,metáfora,\"cingi a farrusca a balravento, mandi abri os embornais nos sapatos, pus o galério no topi, virei o gajeiro para a parte esquerda\",L0841,Manuel Gonçalves,\"O corpo vestido é aparelhado como navio, do calçado ao chapéu. O léxico náutico converte-se aqui em código de elegância popular.\",841,841,verificada\nR105,hipérbole,só os bofes afogados podiam encher todas as tavernas do mal cozinhado,L0841,Manuel Gonçalves,Os folhos da camisa dariam para abastecer as casas de comida da Ribeira. A hipérbole mede o traje pela geografia comercial de Lisboa.,841,841,verificada\nR106,ironia,\"mas isperi, com quem falo eu\",L0841,Manuel Gonçalves,Interrupção metateatral que devolve o falante à consciência do público. Fecha o monólogo com a mesma quebra de ilusão com que ele começara (L0818).,841,841,verificada\nR107,metáfora,vamos entrando na palesta de Cupido,L0861,Chantre,A portaria do convento é declarada palestra — lugar de combate e de exercício. O galanteio é enquadrado desde a primeira fala como desporto regrado.,861,861,verificada\nR108,antítese,\"que sendo esta portaria aula de amorosos certames, se veja agora teatro de mercancias\",L0861,Chantre,Contraste entre o passado cortês e o presente comercial da mesma grade. A palavra «teatro» acrescenta uma camada metateatral à sátira do freiratismo.,861,861,verificada\nR109,metáfora,os frios corações de afectos perseverantes vinham buscar calor no moratório aos raios de tantos sóis que garnecem esta clausura,L0861,Chantre,\"As freiras são sóis e a clausura é braseiro. A metáfora petrarquista é aplicada com toda a seriedade a um espaço religioso, e é dessa impropriedade que nasce a sátira.\",861,861,verificada\nR110,metáfora,\"Se a enfirmidade de amor precisa de junta, aqui está um doutor\",L0867,Doutor,O amor como doença que requer junta médica. A isotopia clínica atravessará todo o passo e permite ao Doutor tratar sentimentos como sintomas.,867,867,verificada\nR111,metáfora,ainda não está enferma a nossa conrespondência,L0869,Chantre,O Chantre aceita a metáfora do outro e continua-a. A amizade é diagnosticada como se fosse corpo — sinal de que os dois falam a mesma língua paródica.,869,869,verificada\nR112,trocadilho,\"Função rija? De que é, de pau do Brasil?\",L0871,Doutor,\"O adjectivo «rija» é desviado do sentido de solene para o de dura, e daí para a madeira colonial. O equívoco obsceno funciona por deslize material.\",871,871,verificada\nR113,trocadilho,Por que mandaste vir algum romendão? Ora estimo pois também quero o meu romendo,L0875,Doutor,Jogo entre o músico remendão e o remendo. A resposta rebaixa o concerto anunciado a trabalho de costura.,875,875,verificada\nR114,sátira,\"Tudo o que é asneira é despidido juízo, pois na loucura não se dá acto de descurso Ergo; é vossa mercê um pedaço d'asno\",L0883,Doutor,\"Silogismo escolástico completo, com «Ergo» incluído, ao serviço de um insulto. É o núcleo intelectual do entremez: a lógica das escolas exibida como maquinaria vazia.\",883,883,verificada\nR115,hipérbole,\"Quem, por destino dos astros, vem comprir o fado desta portaria\",L0889-L0890,Chantre,Resposta a uma porteira formulada em estilo de tragédia. O desajuste entre a grandeza do enunciado e a banalidade da situação é o método cómico do passo.,889,890,verificada\nR116,metáfora,É forte lobisomi,L0892,Doutor,\"Aparte que classifica o companheiro como criatura nocturna. O Doutor comenta à parte tudo o que o Chantre diz a sério, mantendo o público do seu lado.\",892,892,verificada\nR117,ironia,\"Se a saúde tem notícia dela, pregoa/prego-a no mar\",L0896,Doutor,\"A saúde da freira é dada por perdida numa fórmula de escárnio marítimo. A barra é do transcritor e assinala leitura dupla, não uma escolha do texto.\",896,896,verificada\nR118,ironia,estimarei que vossa senhoria conte dilatados anos só para vir a ser desengano das idades,L0900,Doutor,O voto de vida longa converte-se em insulto pela finalidade que lhe é dada. É a construção irónica mais fina do papel: a cortesia usada como veículo exacto da ofensa.,900,900,verificada\nR119,ironia,\"Não, minha senhora, mas está já muito alquebrada\",L0904,Doutor,\"A negação atenuante agrava o insulto anterior. O par pergunta/resposta mostra que a vítima entende, o que aumenta a crueldade cómica.\",904,904,verificada\nR120,hipérbole,Isso é uma traquinada de cacos que vinha da botica,L0922,Galego,O criado reporta a medicação como estrondo de louça. A deformação popular do vocabulário médico caracteriza-o socialmente e ridiculariza a farmacopeia.,922,922,verificada\nR121,ironia,\"Ó galego, teu amo quer pôr agora loje de sabão!\",L0924,Doutor,\"Do relato dos frascos deduz-se um negócio de sabão. O Doutor troça do criado e, por tabela, do amo que o emprega.\",924,924,verificada\nR122,ironia,\"Vai, que eu cá a irei temperando\",L0932,Doutor,\"O verbo oscila entre acalmar e afinar, com evidente insinuação. O médico oferece-se para cuidar da prima na ausência do primo.\",932,932,verificada\nR123,hipérbole,\"quem ama, os minutos lhe parece itirnidade\",L0952,Freira,\"Tópico petrarquista do tempo dilatado, dito com toda a seriedade dentro de uma cena cómica. A Freira é a única personagem do passo que não faz troça de ninguém.\",952,952,verificada\nR124,sátira,\"Ah, que a freira quer ter cachorrinho de fralda a toda a hora\",L0954,Doutor,\"O primo é reduzido a animal de regaço. A imagem satiriza de um golpe o freiratismo, a ociosidade conventual e a masculinidade do Chantre.\",954,954,verificada\nR125,sátira,seriam poucos todos os gorgomilos para poblicar a glória que tenho de ver a vossa senhoria,L0958,Doutor,\"Paródia do estilo cultista levada ao limite do inteligível. O excesso de ornamento denuncia-se a si próprio, e o cumprimento não chega a significar nada.\",958,958,verificada\nR126,comparação,Seu primo parece-me um bonecro,L0962,Doutor,O Chantre é comparado a um boneco. A redução a objecto articulado prepara o soneto ridículo que ele próprio vai declamar.,962,962,verificada\nR127,enumeração,\"Durmo pouco, ando sempre com mil pressas, visto às vezes as meias às avessas, não sei o que vou ler no bribiário\",L0975-L0977,Chantre,Catálogo de sintomas amorosos rebaixado do sofrimento cortês para o desmazelo doméstico. A meia às avessas substitui as insónias de Petrarca.,975,977,verificada\nR128,sátira,fui marrar outro dia com um almário,L0981-L0982,Chantre,O soneto amoroso termina com uma cabeçada num armário. O bathos final desmonta os treze versos anteriores e é a assinatura cómica do passo.,981,982,verificada\nR129,sátira,\"Tenho um primo Joaquim que é um galante sujeito, comprei onte à tarde um leito para esta noute dormir\",L0992-L0995,Doutor,\"Décima de disparates encadeados sem nexo, em resposta ao soneto do Chantre. A paródia opera pela ausência total de pertinência — a forma poética mantém-se, o sentido evapora-se.\",992,995,verificada\nR130,hipérbole,\"depois de vos ouvir, prima adorada, já não tem mais que ouvir o meu desejo\",L1043-L1044,Chantre,Encerramento do encómio: ouvir a prima esgota o desejo de ouvir. A hipérbole é sincera dentro da ficção e ridícula fora dela.,1043,1044,verificada\nR131,ironia,\"que essa voz, pelo grosso e pelo fino, bem pode acompanhar qualquer defunto\",L1050-L1051,Doutor,\"Primeiro verso do contra-encómio. O soneto do Doutor responde ao do Chantre verso a verso, formando um díptico louvor/vitupério que é a construção retórica mais elaborada do papel.\",1050,1051,verificada\nR132,comparação,esse eco substimado parece de rapaz inda de escola quando vai a fazer o seu recado,L1057-L1059,Doutor,\"A voz da freira é comparada à de um moço de recados. A comparação retira-lhe simultaneamente idade, sexo e dignidade.\",1057,1059,verificada\nR133,ironia,há de cantar os passos da charola,L1063,Doutor,O destino artístico prometido é o das procissões da Quaresma. A referência local dá ao insulto uma precisão que o público reconheceria de imediato.,1063,1063,verificada\nR134,trocadilho,\"Cacau tem ela, que lhe dá o Chantre\",L1068,Doutor,Aparte obsceno construído sobre a mercadoria colonial que acaba de entrar em cena. É o ponto em que a sátira ao clero se torna mais crua.,1068,1068,verificada\nR135,hipérbole,Essa vozo é um trovão,L1079,Preto (vendedor de cacau),\"O elogio hiperbólico do vendedor é sincero e, por isso mesmo, mais devastador do que a ironia do Doutor. A voz que todos criticaram é aqui fenómeno meteorológico.\",1079,1079,verificada\nR136,comparação,pode ir a uma função com os pretinhos de Guiné,L1083-L1084,Preto (vendedor de cacau),\"O louvor situa a freira numa festa negra de Lisboa. A comparação atravessa a fronteira social do convento e é, no papel, a única que o faz por elogio.\",1083,1084,verificada\nR137,metáfora,\"Ai, que o sebo vai-se derretendo\",L1090,Doutor,Aparte que traduz o enlevo geral em gordura a derreter. A metáfora corpórea desfaz o clima de galanteio no exacto momento em que ele culmina.,1090,1090,verificada\nR138,comparação,O senhor doutor parece que gritava àque del rei,L1110,Preto (vendedor de cacau),\"O canto do médico é comparado ao grito de socorro. A comparação vinga, sem intenção aparente, todas as troças que o Doutor distribuiu.\",1110,1110,verificada\nR139,ironia,\"Se ele curasse os doentes cantando, morriam todos\",L1112,Galego,\"O criado remata o escárnio ao médico. É significativo que a sentença mais dura contra o Doutor venha do galego, a personagem de menor estatuto da cena.\",1112,1112,verificada\nR140,antítese,quem não vive duvidoso não ama os finos desvelos,L1120-L1121,Chantre,\"Glosa do mote «Quem tem amores, tem zelos». A antítese entre dúvida e amor é doutrina cortês tratada com seriedade, num contexto que a esvazia.\",1120,1121,verificada\nR141,enumeração,\"Casado tem mulher, quem bem paga tem dinheiro, vende vinho o taverneiro, quem tem fome quer comer\",L1129-L1132,Doutor,Glosa feita inteira de truísmos. A forma poética cumpre-se com rigor enquanto o conteúdo se recusa: é paródia da glosa como exercício obrigatório de sociedade.,1129,1132,verificada\nR142,ironia,\"era preta dos outro laia, parenta dos Vasconcelos\",L1155-L1156,Preto (vendedor de cacau),Atribui-se à mulher negra parentesco com uma casa nobre portuguesa. O verso brinca com a genealogia e com os apelidos impostos pela escravatura — leitura que o texto abre e não desenvolve.,1155,1156,verificada\nR143,sátira,que o mesmo é ter freira que cobrar a cabeça,L1166,Doutor,\"Sentença final sobre o freiratismo, com jogo entre a cabeça que se cobra e a que se perde. Fecha o passo devolvendo-lhe o motivo da decapitação que o passo de Judite tratara a sério.\",1166,1166,verificada\nR144,trocadilho,\"vá-se embora, que aqui não há frete\",L1180,Preto (vendedor de cacau),«Frete» é carreto e é proveito. A altercação final entre os dois criados estrangeirados faz-se toda sobre os ofícios a que cada um é socialmente atribuído.,1180,1180,verificada\nR145,trocadilho,vá-se embora que aqui não há que esfolar,L1182,Galego,\"Resposta simétrica, com o ofício de esfolar atribuído ao adversário. A peça acaba, significativamente, num conflito entre subalternos e não entre senhores.\",1182,1182,verificada\n"},{"nome":"frequencias_recursos.csv","rotulo":"Frequências por tipo de recurso","url":"presepio-da-graca/frequencias_recursos.csv","bytes":"244","conteudo":"﻿tipo_recurso,n_ocorrencias\nmetáfora,31\nironia,19\nhipérbole,18\nantítese,12\ncomparação,11\ntrocadilho,11\nanáfora,9\napóstrofe,8\npersonificação,6\nsátira,6\nenumeração,5\nanacronismo,4\nalegoria,2\neufemismo,2\nprovérbio,1\n"},{"nome":"personagens.csv","rotulo":"Personagens","url":"presepio-da-graca/personagens.csv","bytes":"6650","conteudo":"﻿personagem,funcao_dramatica,simbologia\nPadre Eterno,\"Criador, legislador e juiz; estrutura todo o primeiro terço por preceito e sanção\",\"A ordem como palavra eficaz: cada fala sua é seguida de uma mutação de cenário, de modo que a omnipotência se traduz materialmente em tramoia\"\nLuzbel,Antagonista inaugural; abre a peça com o soneto da revolta,\"Soberba como erro de medida; a semelhança com Deus pretendida por usurpação, em espelho invertido da semelhança concedida a Adão\"\nSão Miguel,\"Executor da sentença divina, em soneto simétrico ao de Luzbel\",A justiça como interrupção imediata e proporcional; a palavra que repõe a ordem que outra palavra tentara subverter\nAdão,\"Criatura, transgressor e penitente; passa da prosa ao verso depois da queda\",O homem como sujeito da culpa e da esperança; a sua penitência antecipa a Redenção que só Belém cumprirá\nEva,Interlocutora da Serpente e primeira transgressora; co-protagonista da lamentação,\"Recebe a maldição socialmente mais pesada do papel (dor, sujeição, domínio); a hierarquia doméstica setecentista dita como sentença divina\"\nSerpente,Tentadora; opera por pergunta antes de negar,A palavra que engana pela forma; primeira de uma série de enganadores que continua no Diabo e se inverte na dissimulação virtuosa de Judite\nAnjo,Mensageiro celeste; expulsa do Paraíso em oitava e anuncia o Natal em oitava,A mesma voz e a mesma estrofe fecham o arco que abriram: o desengano do mundo e a convocação a Belém são as duas pontas da peça\nCoro,Voz colectiva sentenciosa; responde com uma palavra a cada pergunta de Adão e Eva,\"O destino como eco — aquilo que não se argumenta, apenas se repete\"\nAbel,Vítima do fratricídio; modelo de obediência que não pergunta,\"A submissão devota como recusa de saber, contraposta ponto por ponto à curiosidade que perde Caim\"\nCaim,Fratricida; repete em escala humana o gesto de Luzbel,\"O desespero que recusa até o amparo; única figura trágica a quem a peça retira a dignidade, entregando-a a um entremez\"\nDiabo,Tentador cómico; primeira grande ruptura de registo do papel,\"O mal domesticado em mundanidade lisboeta — com chá, criadagem e visitas — e por isso mais perigoso do que o mal terrível\"\nNoé,Obediente exemplar; o seu passo é o mais breve e menos dramatizado,A arca lida como clausura monástica: a salvação figurada como recolhimento regrado\nSem,Filho de Noé; função coral de agradecimento,A obediência filial como forma de piedade colectiva\nJafé,Filho de Noé; reparte com Sem o agradecimento,\"A gratidão repartida por vozes, que converte a salvação individual em rito de família\"\nOlofernes,\"Tirano assírio; antagonista de escala política, o único do papel\",\"O poder como excesso de linguagem: a sua ameaça é pura potência verbal, desmentida por uma mulher e um jantar\"\nJudite,Protagonista do passo mais longo; agente único da reviravolta,\"Mulher forte que decapita o tirano; leitura tipológica tradicional como prefiguração de Maria, o que explica a sua presença num presépio\"\nSacerdote,Autoridade religiosa que legitima a acção de Judite e a devolve à liturgia,Converte iniciativa individual em causa colectiva; a fé como armadura que autoriza a violência\nMestre-Sala,Gracioso do passo de Olofernes; comenta e desmonta toda a acção séria,O criado que vê o senhor por dentro; é por ele que o sublime bíblico é continuamente rebaixado à rua de Lisboa\nVelha,Criada de Judite; cúmplice no plano sério e adversária do Mestre-Sala no cómico,A velhice popular como língua solta e corpo desqualificado; produz o maior bathos do papel ao saudar Judite como Pentesileia e logo lhe pedir o avental\nVolante,Arauto; leva o ultimato e traz a recusa,A brevidade da sua função sublinha que a guerra já estava decidida antes de ser anunciada\n1.º Capitão,Coro militar; fala um soneto a dois com o companheiro,A obediência armada como forma métrica: o encaixe das réplicas é a imagem da disciplina\n2.º Capitão,Coro militar; completa os quartetos e tercetos do companheiro,A intercambialidade das vozes como figura da tropa — nenhum dos dois tem traço próprio\nPreto (criado de Olofernes),Cozinheiro; nega sucessivamente ao Mestre-Sala tudo o que ele pede,A escassez vista de baixo e a hierarquia entre criados; fala na convenção teatral da língua de preto\nSoldado,Descobre o corpo de Olofernes e desencadeia o desfecho,A autoridade militar reduzida a testemunha tardia do que já acontece    Regra do sítio: traduz-se a exposição, não a evidência. As formas citadas do
   manuscrito (`perceito`, `molher`, `a sua mes / ma cabeça`) ficam como estão
   nas duas versões, porque são o objecto de que se fala. */

           pt:"Cada linha recebe uma morada. Sem ela, nada do que se segue seria verificável."},
  corpo: [
    {en:"Before the text is sent anywhere, each of its lines is prefixed with a stable marker — <code>[L0042]</code> — and the protocol requires every quotation to declare where it comes from using those markers. This is the single decision on which the whole method rests. A quotation without an address can be searched for in the text, but a quotation <i>with</i> one can be checked against a specific place, which is a far stronger claim: it distinguishes «this phrase occurs somewhere in the play» from «this phrase occurs here, where the analysis says it does».",
     pt:"Antes de o texto ser enviado para onde quer que seja, cada uma das suas linhas recebe um marcador estável — <code>[L0042]</code> — e o protocolo exige que toda a citação declare de onde vem usando esses marcadores. É a decisão única sobre a qual assenta o método inteiro. Uma citação sem morada pode ser procurada no texto; uma citação <i>com</i> morada pode ser conferida contra um lugar determinado, o que é uma afirmação muito mais forte: distingue «esta frase ocorre algures na peça» de «esta frase ocorre aqui, onde a análise diz que ocorre»."},
    {en:"The numbering is applied to the transcription as it is, not to a cleaned copy, so line 42 of the analysis is line 42 of the page. It is also what allows a location to be a range (<code>L0027-L0029</code>) when a quotation spans several lines of the manuscript, which in verse is the normal case.",
     pt:"A numeração é aplicada à transcrição tal como está, e não a uma cópia limpa, pelo que a linha 42 da análise é a linha 42 da página. É também o que permite que uma localização seja um intervalo (<code>L0027-L0029</code>) quando uma citação atravessa várias linhas do manuscrito, o que em verso é o caso normal."}
  ]
},

/* ─────────────────────────────────────────────────────────── 04 ── estrutura */
{
  id: "estrutura", n: "04",
  titulo: {en:"Reading the structure of the copy", pt:"Leitura da estrutura da cópia"},
  resumo: {en:"Speech headings, episode markers and folios are detected — as proposals, never as findings.",
           pt:"Rubricas de fala, marcos de passo e fólios são detectados — como propostas, nunca como achados."},
  corpo: [
    {en:"The numbered text is then read for its own architecture: which lines carry a speech heading, where an episode begins, where the copyist turned the page. Transcription conventions vary from source to source and even within one, so the detection accepts many forms — <i>Nome:</i>, <i>NOME.</i>, <i>Nome —</i>, <i>Fala Nome —</i>, headings separated by a tab — and treats <i>Passo de …</i> and <i>Vista de …</i> as structural markers.",
     pt:"O texto numerado é depois lido quanto à sua própria arquitectura: que linhas levam rubrica de fala, onde começa um passo, onde o copista virou a folha. As convenções de transcrição variam de fonte para fonte e mesmo dentro de uma, pelo que a detecção aceita muitas formas — <i>Nome:</i>, <i>NOME.</i>, <i>Nome —</i>, <i>Fala Nome —</i>, rubricas separadas por tabulação — e trata <i>Passo de …</i> e <i>Vista de …</i> como marcos de estrutura."},
    {en:"What comes out of this stage is deliberately weak. It is a list of candidates, offered to the analysis as context, and it is never used to correct or contradict what the analysis concludes. A heading that the detector misses does not remove a character from the play; a false positive does not add one. The stage exists to give the reading a map of the copy, and to report — in the run's own log — how many distinct speech headings and how many structural markers were found, which is often the first indication that a transcription uses a convention nobody had described.",
     pt:"O que sai desta fase é deliberadamente fraco. É uma lista de candidatos, oferecida à análise como contexto, e nunca é usada para corrigir ou contradizer o que a análise conclui. Uma rubrica que o detector falhe não retira uma personagem à peça; um falso positivo não acrescenta nenhuma. A fase existe para dar à leitura um mapa da cópia e para relatar — no registo da própria execução — quantas rubricas distintas e quantos marcos de estrutura foram encontrados, o que é muitas vezes o primeiro indício de que uma transcrição usa uma convenção que ninguém tinha descrito."}
  ],
  nota: {en:"For a long play the text may also be segmented here, so that the reading proceeds by parts. Segmentation changes how the text is delivered, never how it is numbered: the addresses remain those of the whole play.",
         pt:"Numa peça extensa o texto pode também ser segmentado nesta fase, para a leitura decorrer por partes. A segmentação altera a forma como o texto é entregue, nunca a forma como é numerado: as moradas continuam a ser as da peça inteira."}
},

/* ────────────────────────────────────────────────────────────── 05 ── papel */
{
  id: "papel", n: "05",
  titulo: {en:"The reading position", pt:"A posição de leitura"},
  resumo: {en:"The analysis is asked for from a declared standpoint, with a declared vocabulary of certainty.",
           pt:"A análise é pedida a partir de um ponto de vista declarado, com um vocabulário de certeza declarado."},
  corpo: [
    {en:"The model is not asked to «analyse the text». It is placed in a specific position — historian of the theatre and philologist of eighteenth-century Portuguese dramatic literature, with classical rhetoric and the period's own lexicography at hand: Bluteau's <i>Vocabulario Portuguez e Latino</i> (1712–1728), Morais Silva's <i>Diccionario da Lingua Portugueza</i> (1789) — and given the play together with the metadata that situate it: title, dating, provenance, genre.",
     pt:"Ao modelo não se pede que «analise o texto». É colocado numa posição determinada — historiador do teatro e filólogo da literatura dramática portuguesa setecentista, com a retórica clássica e a lexicografia da época à mão: o <i>Vocabulario Portuguez e Latino</i> de Bluteau (1712–1728), o <i>Diccionario da Lingua Portugueza</i> de Morais Silva (1789) — e recebe a peça juntamente com os metadados que a situam: título, datação, proveniência, género."},
    {en:"Two requirements of that position matter more than the rest. The first is historical: meanings are to be read at the date of composition, and wherever the period sense diverges from the modern one the divergence must be stated rather than passed over. The second is epistemic: textual observation and interpretative inference are not to be confused, and every reading must declare its own degree of certainty from a fixed vocabulary — <b>seguro</b>, <b>provável</b>, <b>hipotético</b>. A reading that cannot say which of the three it is has not been made carefully enough to publish.",
     pt:"Duas exigências dessa posição contam mais do que as restantes. A primeira é histórica: os sentidos hão-de ser lidos à data da composição, e sempre que a acepção de época divergir da moderna a divergência tem de ser assinalada em vez de passada em claro. A segunda é epistémica: constatação textual e inferência interpretativa não se confundem, e cada leitura tem de declarar o seu grau de certeza a partir de um vocabulário fixo — <b>seguro</b>, <b>provável</b>, <b>hipotético</b>. Uma leitura que não consiga dizer qual dos três é não foi feita com cuidado suficiente para ser publicada."}
  ]
},

/* ───────────────────────────────────────────────────────────── 06 ── ronda 1 */
{
  id: "ronda1", n: "06",
  titulo: {en:"First round — reading and interpretation", pt:"Primeira ronda — leitura e interpretação"},
  resumo: {en:"Tasks 1 and 2 of the protocol: the cast and its symbolism; the vernacular and the rhetorical figures.",
           pt:"Tarefas 1 e 2 do protocolo: o elenco e a sua simbologia; o vernáculo e os recursos expressivos."},
  corpo: [
    {en:"The whole play is sent in one block and read through before anything is written. The first round produces prose, not tables, and answers two questions.",
     pt:"A peça inteira segue num bloco e é lida de ponta a ponta antes de se escrever fosse o que fosse. A primeira ronda produz prosa, não tabelas, e responde a duas perguntas."},
    {en:"Prose is the right output at this stage precisely because it is not yet data. It allows a reading to say that Judith stands at the typological hinge of a nativity play, or that the word <i>assento</i> returns three times in three positions of the same high–low axis — the kind of observation a table has no column for, and which is nevertheless what the tables will later have to be consistent with.",
     pt:"A prosa é o resultado certo nesta fase precisamente por ainda não ser dado. Permite a uma leitura dizer que Judite está na charneira tipológica de um auto de Natal, ou que a palavra <i>assento</i> regressa três vezes em três posições do mesmo eixo alto/baixo — o género de observação para que uma tabela não tem coluna, e que é ainda assim aquilo com que as tabelas terão depois de ser coerentes."},
    {en:"The round also has an output that is easy to overlook and is treated as part of the result: a declaration of its own limits. Illegible passages, alternative readings, places where the copy defeats the reading — these are written down rather than resolved, and they travel through to the published page.",
     pt:"A ronda tem ainda um resultado fácil de menosprezar e que é tratado como parte do produto: uma declaração dos seus próprios limites. Passagens ilegíveis, leituras alternativas, lugares onde a cópia derrota a leitura — ficam escritos em vez de resolvidos, e seguem até à página publicada."}
  ],
  lista: {
    titulo: {en:"What the first round establishes", pt:"O que a primeira ronda estabelece"},
    itens: [
      {t:{en:"Task 1 · Characters, symbolism, relations", pt:"Tarefa 1 · Personagens, simbologia, relações"},
       c:{en:"Every character in the play; for each, its dramatic function, its symbolic weight — social, religious, moral, comic — and the textual evidence that supports both. Then the relations between them, classified by type (hierarchical, familial, antagonistic, amorous, comic, servile) and interpreted in the play's own terms.",
          pt:"Todas as personagens da peça; para cada uma, a função dramática, a carga simbólica — social, religiosa, moral, cómica — e a evidência textual que sustenta ambas. Depois as relações entre elas, classificadas por tipo (hierárquica, familiar, antagónica, amorosa, cómica, servil) e interpretadas nos termos da própria peça."}},
      {t:{en:"Task 2 · Vernacular and rhetorical figures", pt:"Tarefa 2 · Vernáculo e recursos expressivos"},
       c:{en:"Vernacular expressions, regionalisms and archaisms, each with a proposed period meaning, a declared degree of certainty and, where possible, contemporary lexicographic support. Then the rhetorical figures — metaphor, simile, parable, satire, irony, hyperbole, antithesis and whatever else the text presents — each with an exact quotation, a location, the character who utters it, and a reading of the effect it produces.",
          pt:"Expressões vernaculares, regionalismos e arcaísmos, cada um com significado de época proposto, grau de certeza declarado e, quando possível, apoio lexicográfico coevo. Depois os recursos expressivos — metáfora, comparação, parábola, sátira, ironia, hipérbole, antítese e o mais que o texto apresente —, cada ocorrência com citação exacta, localização, personagem enunciadora e leitura do efeito produzido."}}
    ]
  }
},

/* ───────────────────────────────────────────────────────────── 07 ── ronda 2 */
{
  id: "ronda2", n: "07",
  titulo: {en:"Second round — systematisation", pt:"Segunda ronda — sistematização"},
  resumo: {en:"Task 3: the reading becomes five tables, in a schema identical for every play.",
           pt:"Tarefa 3: a leitura torna-se cinco tabelas, num esquema igual para todas as peças."},
  corpo: [
    {en:"The conversion into data happens in a second exchange, over the result of the first. Separating <i>reading</i> from <i>tabulating</i> is not a technical convenience: asking for interpretation and structured output in one breath produces fewer observations and worse-formed rows, because the two demands compete. The play travels with the second round as well, so that a quotation being tabulated can be re-read in its place, and it is sent with a cache marker — the same text, read twice, is not paid for twice.",
     pt:"A conversão em dados acontece numa segunda troca, sobre o resultado da primeira. Separar <i>ler</i> de <i>tabelar</i> não é uma conveniência técnica: pedir interpretação e saída estruturada no mesmo fôlego produz menos observações e linhas pior formadas, porque as duas exigências competem entre si. A peça acompanha também a segunda ronda, para que uma citação em vias de ser tabelada possa ser relida no seu lugar, e segue com marca de cache — o mesmo texto, lido duas vezes, não se paga duas vezes."},
    {en:"The schema is fixed and identical for every play analysed. That is what makes comparison between plays possible later, and it is also a constraint on the reading: an observation that cannot be expressed in one of these five shapes stays in the prose, where it remains readable, rather than being forced into a column where it would be misleading.",
     pt:"O esquema é fixo e igual para todas as peças analisadas. É isso que torna possível compará-las mais tarde, e é também uma restrição sobre a leitura: uma observação que não caiba numa destas cinco formas fica na prosa, onde continua legível, em vez de ser forçada para uma coluna onde induziria em erro."},
    {en:"The unit of analysis differs from table to table, and knowing which is which is the difference between reading these numbers correctly and misreading them. One row of <code>recursos_expressivos.csv</code> is one <i>occurrence</i> — the same metaphor used twice is two rows. One row of <code>personagens.csv</code> is one <i>character</i>. One row of <code>vernaculo.csv</code> is one <i>expression</i>, with a count attached.",
     pt:"A unidade de análise difere de tabela para tabela, e saber qual é qual é a diferença entre ler bem estes números e lê-los mal. Uma linha de <code>recursos_expressivos.csv</code> é uma <i>ocorrência</i> — a mesma metáfora usada duas vezes são duas linhas. Uma linha de <code>personagens.csv</code> é uma <i>personagem</i>. Uma linha de <code>vernaculo.csv</code> é uma <i>expressão</i>, com uma contagem associada."}
  ],
  ligacao: {rota:"data", texto:{en:"The five tables, column by column", pt:"As cinco tabelas, coluna a coluna"}}
},

/* ────────────────────────────────────────────────────────────── 08 ── cotejo */
{
  id: "cotejo", n: "08", chave: true,
  titulo: {en:"The check against the manuscript", pt:"O cotejo com o manuscrito"},
  resumo: {en:"Every quotation is looked for in the transcription before it is allowed to become a figure.",
           pt:"Cada citação é procurada na transcrição antes de lhe ser permitido tornar-se figura."},
  corpo: [
    {en:"This is the stage the whole method exists to make possible. A language model produces plausible prose at speed, and plausible is not the same as true: a quotation that reads exactly like the play, attributed to a character who exists, placed at a line that exists, can still not be in the text. No amount of care in the prompt removes that possibility. So it is not addressed by care. It is addressed by looking.",
     pt:"É esta a fase que o método inteiro existe para tornar possível. Um modelo de linguagem produz prosa plausível com rapidez, e plausível não é verdadeiro: uma citação que se lê exactamente como a peça, atribuída a uma personagem que existe, colocada numa linha que existe, pode ainda assim não estar no texto. Nenhuma dose de cuidado no prompt elimina essa possibilidade. Por isso não é resolvida com cuidado. É resolvida procurando."},
    {en:"Each quotation is taken with the location it declares, and looked for first in a window of six lines either side of that location. Found there, it is <b>confirmed</b>. Not found there but present elsewhere in the play, it is <b>displaced</b> — the reading is about a real passage, but the address is wrong, and a footnote built on it would send a reader to the wrong page. Not found at all, it is <b>not found</b>, and that is treated as an error of the run rather than as a detail.",
     pt:"Cada citação é tomada com a localização que declara e procurada primeiro numa janela de seis linhas para cada lado dessa localização. Encontrada aí, fica <b>verificada</b>. Não encontrada aí mas presente noutro ponto da peça, fica <b>deslocada</b> — a leitura é sobre uma passagem real, mas a morada está errada, e uma nota de rodapé construída sobre ela mandaria o leitor à página errada. Não encontrada de todo, fica <b>não encontrada</b>, e isso é tratado como erro da execução e não como pormenor."},
    {en:"The comparison has to survive the transcription's own fidelity, and this is where the diplomatic decisions of stage 02 come back. Both sides are reduced to a canonical form — lower case, accents removed, punctuation removed, the long <i>ſ</i> of eighteenth-century founts resolved to <i>s</i> — and then <b>all spacing is removed</b>. Comparing without spaces is what makes the check immune to a word cut in half at the line break: <i>a sua mes</i> / <i>ma cabeça</i> and <i>a sua mesma cabeça</i> become the same string. For fragments longer than a dozen characters the risk of a false match is negligible.",
     pt:"A comparação tem de sobreviver à fidelidade da própria transcrição, e é aqui que as decisões diplomáticas da fase 02 regressam. Os dois lados são reduzidos a uma forma canónica — minúsculas, sem acentos, sem pontuação, com o <i>ſ</i> longo das fontes setecentistas resolvido em <i>s</i> — e depois <b>retira-se todo o espaçamento</b>. Comparar sem espaços é o que torna o cotejo imune a uma palavra partida a meio na mudança de linha: <i>a sua mes</i> / <i>ma cabeça</i> e <i>a sua mesma cabeça</i> passam a ser a mesma cadeia. Para fragmentos com mais de uma dúzia de caracteres o risco de coincidência falsa é negligenciável."},
    {en:"A quotation given with an ellipsis is split at the ellipsis and each fragment is required to be present; a quotation too short to be discriminating is not counted as evidence either way. The canonical form is never written to disk and never replaces the original spelling: it exists for the length of one comparison, to answer one question — is this in the text?",
     pt:"Uma citação dada com reticências é partida nas reticências e exige-se a presença de cada fragmento; uma citação demasiado curta para ser discriminante não conta como prova em nenhum sentido. A forma canónica nunca é escrita em disco nem substitui a ortografia original: existe pelo tempo de uma comparação, para responder a uma pergunta — isto está no texto?"}
  ],
  contraste: {
    titulo: {en:"What the check settles, and what it leaves open",
             pt:"O que o cotejo resolve, e o que deixa em aberto"},
    sim: {t:{en:"It establishes", pt:"Estabelece"},
          c:{en:"That the quoted words are in the play, in the copy transcribed, at the line the analysis gives. Every figure on this site can therefore be traced back to a place in the manuscript — which is what makes the numbers arguable rather than merely asserted.",
             pt:"Que as palavras citadas estão na peça, na cópia transcrita, na linha que a análise indica. Todas as figuras deste sítio podem por isso ser reconduzidas a um lugar do manuscrito — que é o que torna os números discutíveis em vez de meramente afirmados."}},
    nao: {t:{en:"It does not establish", pt:"Não estabelece"},
          c:{en:"That the reading made of the passage is right. A quotation can be perfectly confirmed and the irony attributed to it be someone's invention. The check guards against fabrication, not against misreading — and no automatic procedure can do the second.",
             pt:"Que a leitura que dela se faz esteja certa. Uma citação pode estar perfeitamente confirmada e a ironia que lhe é atribuída ser invenção de alguém. O cotejo protege contra a fabricação, não contra a má leitura — e nenhum procedimento automático pode fazer a segunda coisa."}}
  },
  nota: {en:"On the <i>Presépio da Graça</i>, 145 of 145 quotations were confirmed. The result of the check is published quotation by quotation, in the analysis table and in a downloadable file, so that the claim can be inspected rather than believed.",
         pt:"No <i>Presépio da Graça</i>, 145 de 145 citações ficaram confirmadas. O resultado do cotejo é publicado citação a citação, na tabela da análise e num ficheiro descarregável, para que a afirmação possa ser inspeccionada em vez de acreditada."}
},

/* ─────────────────────────────────────────────────────────── 09 ── validação */
{

  resumo: {en:"Eight checks on the tables themselves, and nothing corrected in silence.",
           pt:"Oito verificações sobre as próprias tabelas, e nada corrigido em silêncio."},
  corpo: [
    {en:"The check against the manuscript answers a question about the text. A second layer answers questions about the data: whether the tables are complete, internally consistent, and saying the same thing as each other.",
     pt:"O cotejo com o manuscrito responde a uma pergunta sobre o texto. Uma segunda camada responde a perguntas sobre os dados: se as tabelas estão completas, se são internamente coerentes e se dizem umas às outras a mesma coisa."},
    {en:"The governing rule of this layer is that nothing is corrected in silence. Where a value is harmonised — a character's name given twice with different capitalisation, a degree of certainty written outside the controlled vocabulary — the change is recorded as a note; where something is wrong and cannot be repaired, it is recorded as a warning or an error. All of it goes into a validation report published alongside the data. A run with errors is a run that shows its errors.",
     pt:"A regra que governa esta camada é que nada é corrigido em silêncio. Quando um valor é harmonizado — o nome de uma personagem dado duas vezes com maiúsculas diferentes, um grau de certeza escrito fora do vocabulário controlado — a alteração fica registada como nota; quando algo está errado e não pode ser reparado, fica registado como aviso ou como erro. Tudo isso vai para um relatório de validação publicado ao lado dos dados. Uma execução com erros é uma execução que mostra os seus erros."},
    {en:"One of these checks deserves separate mention because it silently corrects a number the reader would otherwise trust. The frequency table is not accepted as given: it is <b>recomputed</b> from the occurrences actually recorded. Counting is exactly the sort of task at which a language model is unreliable and a computer is not, and on the <i>Presépio da Graça</i> the recomputation changed seven of the declared figures.",
     pt:"Uma destas verificações merece menção à parte, por corrigir em silêncio um número em que o leitor de outro modo confiaria. A tabela de frequências não é aceite como vem: é <b>recalculada</b> a partir das ocorrências efectivamente registadas. Contar é exactamente o género de tarefa em que um modelo de linguagem é pouco fiável e um computador não é, e no <i>Presépio da Graça</i> o recálculo alterou sete dos valores declarados."}
  ],
  lista: {
    titulo: {en:"The checks", pt:"As verificações"},
    itens: [
      {t:{en:"Presence and required fields", pt:"Presença e campos obrigatórios"},
       c:{en:"No table empty; no row missing a field the schema requires.",
          pt:"Nenhuma tabela vazia; nenhuma linha sem um campo que o esquema exija."}},
      {t:{en:"Identifiers", pt:"Identificadores"},
       c:{en:"Occurrence ids unique and sequential; a missing id is assigned and the assignment recorded.",
          pt:"Identificadores de ocorrência únicos e sequenciais; um id em falta é atribuído e a atribuição fica registada."}},
      {t:{en:"Referential integrity", pt:"Integridade referencial"},
       c:{en:"Characters named in occurrences and in relations must be characters in the cast; near-misses are harmonised and reported; a relation of a character with itself, or a repeated edge, is flagged.",
          pt:"As personagens nomeadas nas ocorrências e nas relações têm de ser personagens do elenco; as quase-coincidências são harmonizadas e relatadas; uma relação de uma personagem consigo mesma, ou uma aresta repetida, fica assinalada."}},
      {t:{en:"Cast coverage", pt:"Cobertura do elenco"},

          pt:"As personagens detectadas nas rubricas mas ausentes da análise são relatadas, tal como as personagens da análise que nunca falam."}},
      {t:{en:"Controlled vocabulary", pt:"Vocabulário controlado"},
       c:{en:"Degrees of certainty must be <i>seguro</i>, <i>provável</i> or <i>hipotético</i>; anything else is classified as hypothetical and the reclassification recorded.",
          pt:"Os graus de certeza têm de ser <i>seguro</i>, <i>provável</i> ou <i>hipotético</i>; qualquer outra coisa é classificada como hipotética e a reclassificação fica registada."}},
      {t:{en:"Recomputed frequencies", pt:"Frequências recalculadas"},
       c:{en:"The frequency table is rebuilt from the occurrences; every divergence from the declared figures is listed.",

  }
},

/* ────────────────────────────────────────────────────────── 10 ── figuras */
{
  id: "figuras", n: "10",
  titulo: {en:"Visualisation, by code", pt:"Visualização, por código"},
  resumo: {en:"Task 4 is executed by the program, not by the model — and gives the same figure every time.",
           pt:"A Tarefa 4 é executada pelo programa, não pelo modelo — e dá sempre a mesma figura."},
  corpo: [
    {en:"The protocol asks for three visualisations: the frequency of each type of figure, the distribution of figures across characters, and the network of relations. It also requires that they be drawn <b>exclusively</b> from the tables of Task 3. That requirement is met by not asking the model for them at all.",
     pt:"O protocolo pede três visualizações: a frequência de cada tipo de recurso, a distribuição dos recursos pelas personagens e a rede de relações. Exige também que sejam desenhadas <b>exclusivamente</b> a partir das tabelas da Tarefa 3. Essa exigência cumpre-se não pedindo as visualizações ao modelo de todo."},
    {en:"The charts are generated by the program from the validated CSVs. Two things follow. The first is a guarantee: no figure can show anything the tables do not contain, because the figure has no other source. The second is reproducibility — the graph layout uses a fixed seed, so the same play always produces the same picture, and a figure printed in an article can be regenerated years later and still match.",

    {en:"Every chart carries a table view of the same data and exports to SVG, so that what is on screen can be read as numbers and reused in print at any size. The filters act on all of them at once: choosing a character, a type of figure or a degree of certainty redraws the whole page, which is how a reading about one <i>passo</i> can be isolated from the compilation around it.",

const D = JSON.parse(document.getElementById("dados").textContent);
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* O inglês é a língua por omissão do sítio; o português está a um clique, e
   fica no endereço para poder ser enviado por ligação. */
let LINGUA = "en";

/* t("chave", {n: 3}) → o texto na língua corrente, com as marcas substituídas */
function t(chave, subs){
  const entrada = DIC[chave];
  let s = entrada ? (entrada[LINGUA] || entrada.en || "") : chave;
  if (subs) for (const k in subs) s = s.split("{" + k + "}").join(subs[k]);
  return s;
}

/* Valores vindos do catálogo podem ser texto simples ou {en, pt}. */
function txt(v){
  if (v == null) return "";
  if (typeof v === "object") return v[LINGUA] || v.en || v.pt || "";
  return String(v);
}

const num = n => (n === null || n === undefined || n === "")
  ? "—" : Number(n).toLocaleString(LINGUA === "pt" ? "pt-PT" : "en-GB");
const pct = n => (typeof n === "number")
  ? n.toLocaleString(LINGUA === "pt" ? "pt-PT" : "en-GB", {maximumFractionDigits:1}) + "%" : "—";

function tamanho(bytes){
  const b = Number(bytes) || 0;
  if (b < 1024) return b + " B";
  if (b < 1024*1024) return Math.round(b/1024) + " kB";
  return (b/1048576).toFixed(1) + " MB";
}

/* Estado do cotejo de uma análise, sempre com ícone e etiqueta — nunca só cor. */
function estadoCotejo(analise){
  const m = (analise.validacao && analise.validacao.metricas) || {};
  const p = m.citacoes_verificadas_pct;
  if (typeof p !== "number") return {pct:null, cor:"--text-muted", marca:"○", texto:t("ui.noCheck")};
  if (p >= 99.5) return {pct:p, cor:"--good",     marca:"●", texto:t("ui.checkGood")};
  if (p >= 90)   return {pct:p, cor:"--warning",  marca:"◐", texto:t("ui.checkWarn")};
  return           {pct:p, cor:"--critical", marca:"✕", texto:t("ui.checkBad")};
}

function selo(estado){
  return `<span class="selo" title="${esc(estado.texto)}">` +
         `<span class="marca" style="color:${cssv(estado.cor)}">${estado.marca}</span>` +
         (estado.pct === null ? esc(t("ui.noCheck")) : esc(t("ui.checked", {p: pct(estado.pct)}))) +
         `</span>`;
}

   JavaScript são redesenhadas a seguir, pelo router. */

  document.documentElement.lang = LINGUA;
  $$("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  $$("[data-t-title]").forEach(el => { el.title = t(el.dataset.tTitle); });

      val:pct(x.pct_verificadas),
      nota:`<span class="selo"><span class="marca" style="color:${cssv(e[0])}">${e[1]}</span>` +

/* ---------- o processo metodológico ----------

function biling(v){ return (v && (v[LINGUA] || v.en)) || ""; }

}
